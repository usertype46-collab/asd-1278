<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蝦皮門市作業輔助與回報系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>

<body class="pb-10">

    <header class="bg-orange-500 text-white text-center py-4 sticky top-0 z-10 shadow-md">
        <h1 class="text-xl font-bold tracking-wider">📦 蝦皮門市作業輔助系統</h1>

    <main class="max-w-lg mx-auto mt-4 px-4 space-y-6">
        
        <section class="bg-white rounded-xl card p-5 border-t-4 border-green-500">
            <div class="flex justify-between items-center mb-3">

            <div id="shortcutButtons" class="grid grid-cols-3 gap-2 text-center">
                </div>

            <div id="manageShortcutsSection" class="hidden mt-4 pt-4 border-t border-gray-200">
                <h3 class="text-sm font-bold text-gray-600 mb-2" id="shortcutFormTitle">新增捷徑</h3>
                <form id="shortcutForm" onsubmit="saveShortcut(event)" class="mb-4">
                    <input type="hidden" id="editShortcutId">

                            <input type="url" id="shortcutUrl" placeholder="LINE 網址 (https://...)" required class="flex-[2] border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                    </div>
                    <div class="flex gap-2">

                    <select id="locationSelect" class="flex-1 border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                        <option value="潮州中洲">潮州中洲</option>
                        <option value="潮州光華">潮州光華</option>
                        <option value="潮州大同">潮州大同</option>
                        <option value="潮州光春">潮州光春</option>
                        <option value="潮州愛國">潮州愛國</option>
                        <option value="潮州四維">潮州四維</option>
                        <option value="潮州文化">潮州文化</option>
                        <option value="潮州延平">潮州延平</option>
                        <option value="潮州太平">潮州太平</option>
                        <option value="潮州新生">潮州新生</option>
                        <option value="新園仙吉">新園仙吉</option>

                <div class="bg-blue-50 p-3 rounded border">
                    <div class="flex justify-between items-center mb-2">

                            <button onclick="editL2()" class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded shadow-sm">✏️修改</button>
                            <button onclick="deleteL2()" class="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded shadow-sm">🗑️刪除</button>

                <div id="line3Container" class="hidden bg-gray-50 p-3 rounded border">

                        <label class="block text-xs font-semibold text-gray-600">第三行狀態</label>
                        <div class="space-x-1 shrink-0">
                            <button onclick="addL3()" class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded shadow-sm">➕新增</button>
                            <button onclick="editL3()" class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded shadow-sm">✏️修改</button>

        <section class="bg-white rounded-xl card p-5 border-t-4 border-purple-500 mb-10">
            <h2 class="text-md font-bold text-gray-800 mb-4">🔣 條碼 & QR Code 產生器</h2>
            
            <div class="space-y-3">
                <input type="text" id="inputValue" placeholder="請輸入數值 (例如: SPX30657)..." class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-purple-500 outline-none">

                    <select id="codeType" onchange="toggleAdvancedOptions()" class="flex-1 border border-gray-300 rounded px-2 py-2 bg-gray-100 outline-none">

                        <option value="barcode">條碼 (Barcode)</option>

                    <select id="barcodeFormat" style="display: none;" class="flex-1 border border-gray-300 rounded px-2 py-2 bg-gray-100 outline-none">
                        <option value="CODE128">CODE128 (英數)</option>
                        <option value="CODE39">CODE39 (大寫)</option>
                    </select>

                    <select id="qrErrorLevel" class="flex-1 border border-gray-300 rounded px-2 py-2 bg-gray-100 outline-none">
                        <option value="M">容錯: 一般</option>
                        <option value="H">容錯: 高</option>
                    </select>

                <button onclick="generateCode()" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 rounded-lg shadow transition">

    <script>
        /* ================= 1. Supabase 連線與 GPS 捷徑邏輯 ================= */
        const { createClient } = supabase;
        const supabaseUrl = 'https://hyvcfxwoewvbpfzvfdnn.supabase.co';
        const supabaseKey = 'sb_publishable_TR5C2Zc7eOj9uUosUUsX4g_KbBOwey2';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        let shortcuts = [];
        let currentVisibleGroup = null; 
        let editShortcutId = null;

        const STORE_LOCATIONS = {
            '愛國群組': [
                { name: '潮州愛國智取店', lat: 22.55148, lng: 120.54549 },
                { name: '潮州四維智取店', lat: 22.55543, lng: 120.54819 },
                { name: '潮州文化智取店', lat: 22.55827, lng: 120.54389 },
                { name: '潮州延平智取店', lat: 22.55568, lng: 120.54041 },
                { name: '潮州太平智取店', lat: 22.55389, lng: 120.53813 },
                { name: '潮州新生智取店', lat: 22.55035, lng: 120.53872 }
            ],
            '中洲群組': [
                { name: '潮州中洲智取店', lat: 22.54232, lng: 120.54150 },
                { name: '潮州光華智取店', lat: 22.54361, lng: 120.54497 },
                { name: '潮州大同智取店', lat: 22.54263, lng: 120.53265 },
                { name: '潮州光春智取店', lat: 22.54329, lng: 120.53733 }
            ]
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        function startGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(position => {
                    checkLocation(position.coords.latitude, position.coords.longitude);
                }, error => {
                    const gpsSpan = document.getElementById('gpsStatus');
                    gpsSpan.innerText = '📍 定位拒絕或失敗';
                    gpsSpan.className = 'text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-700';
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
            } else {
                document.getElementById('gpsStatus').innerText = '📍 裝置不支援GPS';
            }
        }

        function checkLocation(userLat, userLng) {
            let newGroup = null;
            let closestStore = null;

            for (let store of STORE_LOCATIONS['愛國群組']) {
                if (calculateDistance(userLat, userLng, store.lat, store.lng) <= 50) {
                    newGroup = '愛國群組';
                    closestStore = store.name.replace('智取店', '');
                    break;
                }
            }

            if (!newGroup) {
                for (let store of STORE_LOCATIONS['中洲群組']) {
                    if (calculateDistance(userLat, userLng, store.lat, store.lng) <= 50) {
                        newGroup = '中洲群組';
                        closestStore = store.name.replace('智取店', '');
                        break;
                    }
                }
            }

            currentVisibleGroup = newGroup;

            const gpsSpan = document.getElementById('gpsStatus');
            if (newGroup) {
                gpsSpan.className = 'text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700';
                gpsSpan.innerText = `📍 在 ${newGroup} 範圍內`;
                
                // 自動帶出門市下拉選單
                if (closestStore) {
                    const locSelect = document.getElementById('locationSelect');
                    for (let i = 0; i < locSelect.options.length; i++) {
                        if (locSelect.options[i].value === closestStore) {
                            locSelect.selectedIndex = i;
                            break;
                        }
                    }
                }
            } else {
                gpsSpan.className = 'text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500';
                gpsSpan.innerText = `📍 未進入任何門市 50m 內`;
            }

            renderShortcuts();
        }

        async function fetchShortcuts() {
            const { data, error } = await supabaseClient.from('shortcuts').select('*').order('created_at', { ascending: true });
            if (!error) {
                shortcuts = data || [];
                renderShortcuts();
            }
        }

        supabaseClient.channel('public:shortcuts')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'shortcuts' }, payload => { fetchShortcuts(); })
            .subscribe();

        function renderShortcuts() {
            const btnContainer = document.getElementById('shortcutButtons');
            if (!currentVisibleGroup) {
                btnContainer.innerHTML = `<div class="col-span-3 text-xs text-gray-400 text-center py-3 bg-gray-50 rounded border border-dashed border-gray-300">目前距離過遠，捷徑隱藏中。</div>`;
            } else {
                const visibleShortcuts = shortcuts.filter(s => s.group_type === currentVisibleGroup);
                if (visibleShortcuts.length === 0) {
                    btnContainer.innerHTML = `<div class="col-span-3 text-xs text-gray-400 text-center py-3 bg-gray-50 rounded border border-dashed border-gray-300">已進入 ${escapeHtml(currentVisibleGroup)}，但尚未設定捷徑。<br>請點擊右上方「管理」新增。</div>`;
                } else {
                    btnContainer.innerHTML = visibleShortcuts.map(s => `<a href="${s.url}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-3 px-1 rounded-lg shadow transition flex items-center justify-center break-all">${escapeHtml(s.name)}</a>`).join('');
                }
            }
            
            document.getElementById('manageShortcutList').innerHTML = shortcuts.map(s => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-200">
                    <div class="overflow-hidden pr-2">
                        <div class="font-bold text-sm text-gray-800 flex items-center gap-1">
                            <span class="text-[10px] bg-gray-200 text-gray-600 px-1 py-0.5 rounded">${escapeHtml(s.group_type)}</span>
                            ${escapeHtml(s.name)}
                        </div>
                        <div class="text-xs text-gray-400 truncate">${escapeHtml(s.url)}</div>
                    </div>
                    <div class="flex gap-1 shrink-0">
                        <button type="button" onclick="editShortcut('${s.id}')" class="bg-blue-100 hover:bg-blue-200 text-blue-600 px-2 py-1 rounded text-xs transition">✏️</button>
                        <button type="button" onclick="deleteShortcut('${s.id}')" class="bg-red-100 hover:bg-red-200 text-red-600 px-2 py-1 rounded text-xs transition">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleManageShortcuts() {
            document.getElementById('manageShortcutsSection').classList.toggle('hidden');
            resetShortcutForm();
        }

        async function saveShortcut(e) {
            e.preventDefault();
            const group_type = document.getElementById('shortcutGroup').value;
            const name = document.getElementById('shortcutName').value.trim();
            const url = document.getElementById('shortcutUrl').value.trim();
            if (!name || !url) return;
            if (editShortcutId) await supabaseClient.from('shortcuts').update({ name, url, group_type }).eq('id', editShortcutId);
            else await supabaseClient.from('shortcuts').insert([{ name, url, group_type }]);
            resetShortcutForm();
        }

        function editShortcut(id) {
            const s = shortcuts.find(x => x.id === id);
            if (!s) return;
            editShortcutId = id;
            document.getElementById('shortcutGroup').value = s.group_type || '愛國群組';
            document.getElementById('shortcutName').value = s.name;
            document.getElementById('shortcutUrl').value = s.url;
            document.getElementById('shortcutFormTitle').innerText = '修改捷徑';
            document.getElementById('saveShortcutBtn').innerText = '更新';
        }

        async function deleteShortcut(id) {
            if (!confirm('確定要刪除此捷徑嗎？(即時同步)')) return;
            await supabaseClient.from('shortcuts').delete().eq('id', id);
        }

        function resetShortcutForm() {
            editShortcutId = null;
            document.getElementById('shortcutForm').reset();
            document.getElementById('shortcutFormTitle').innerText = '新增捷徑';
            document.getElementById('saveShortcutBtn').innerText = '儲存';
        }

        function escapeHtml(str) { return str ? str.replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag] || tag)) : ''; }

        /* ================= 2. 動態回報字串產生器邏輯 ================= */
        const today = new Date();
        document.getElementById('todayDate').innerText = `${today.getMonth() + 1}/${today.getDate()}`;

        // 預設資料 (首次載入時使用)[span_0](start_span)[span_0](end_span)
        const DEFAULT_CONFIG = {
            categories: [
                { id: 'cat_1', text: 'SCS,FBS黑箱' },
                { id: 'cat_2', text: 'NDD,FBS離店打包' },
                { id: 'cat_3', text: 'NDD上架完成' },

                { id: 'cat_5', text: 'PDA上架完成' },
                { id: 'cat_6', text: '滯留箱數回報' },
                { id: 'cat_7', text: '門面檢查' }
            ],
            l2: {

                'cat_2': [ { id: 'l2_2_1', text: '無' }, { id: 'l2_2_2', text: '缺[數量]' } ],
                'cat_3': [ { id: 'l2_3_1', text: '無' }, { id: 'l2_3_2', text: '缺[數量]' }, { id: 'l2_3_3', text: '滯留[件數]件' }, { id: 'l2_3_4', text: '滯留[裸數]裸' }, { id: 'l2_3_5', text: '異退[件數]件' } ],
                'cat_4': [],
                'cat_5': [ { id: 'l2_5_1', text: '無滯留' }, { id: 'l2_5_2', text: '滯留[箱數]箱[裸數]裸' }, { id: 'l2_5_3', text: '滯留[箱數]箱' }, { id: 'l2_5_4', text: '滯留[裸數]裸' } ],
                'cat_6': [ { id: 'l2_6_1', text: '無' }, { id: 'l2_6_2', text: '滯留[箱數]箱[裸數]裸' }, { id: 'l2_6_3', text: '滯留[箱數]箱' }, { id: 'l2_6_4', text: '滯留[裸數]裸' } ],
                'cat_7': []

            l3: {
                'l2_1_1': [ { id: 'l3_1_1_1', text: '束帶×[數量]' }, { id: 'l3_1_1_2', text: '無束帶×[數量]' } ],
                'l2_2_2': [ { id: 'l3_2_2_1', text: '無' }, { id: 'l3_2_2_2', text: '已刷已找' } ],
                'l2_3_2': [ { id: 'l3_3_2_1', text: '門市已無包裹' } ],

                'l2_3_3': [ { id: 'l3_3_3_1', text: '無合適櫃位' }, { id: 'l3_3_3_2', text: '無櫃位' } ],
                'l2_3_4': [ { id: 'l3_3_4_1', text: '無合適櫃位' }, { id: 'l3_3_4_2', text: '無櫃位' } ],
                'l2_5_2': [ { id: 'l3_5_2_1', text: '無合適櫃位' }, { id: 'l3_5_2_2', text: '無櫃位' } ],
                'l2_5_3': [ { id: 'l3_5_3_1', text: '無合適櫃位' }, { id: 'l3_5_3_2', text: '無櫃位' } ],
                'l2_5_4': [ { id: 'l3_5_4_1', text: '無合適櫃位' }, { id: 'l3_5_4_2', text: '無櫃位' } ],
                'l2_6_2': [ { id: 'l3_6_2_1', text: '無合適櫃位' }, { id: 'l3_6_2_2', text: '無櫃位' } ],
                'l2_6_3': [ { id: 'l3_6_3_1', text: '無合適櫃位' }, { id: 'l3_6_3_2', text: '無櫃位' } ],
                'l2_6_4': [ { id: 'l3_6_4_1', text: '無合適櫃位' }, { id: 'l3_6_4_2', text: '無櫃位' } ]
            }
        };

        // 從 LocalStorage 載入設定或使用預設
        let config = JSON.parse(localStorage.getItem('shopee_report_config')) || DEFAULT_CONFIG;
        if (!config.l2) config.l2 = {};
        if (!config.l3) config.l3 = {};

        function saveConfig() { localStorage.setItem('shopee_report_config', JSON.stringify(config)); }
        function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        
        const INPUT_HELP = '若需要手動輸入數值，請用「中括號」包住變數名稱。\n範例：「滯留[箱數]箱[裸數]裸」或「缺[數量]」';

        // ---- 渲染與切換邏輯 ----
        function initSelects() {
            renderCategories();
        }

        function renderCategories(selectId = null) {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="" disabled selected>請選擇回報情境...</option>' + 
                config.categories.map(c => `<option value="${c.id}" data-raw="${escapeHtml(c.text)}">${escapeHtml(c.text)}</option>`).join('');
            if (selectId) select.value = selectId;
            onCategoryChange();
        }

        function onCategoryChange() {
            const catId = document.getElementById('categorySelect').value;
            const l2Container = document.getElementById('line2Container');
            const l3Container = document.getElementById('line3Container');
            
            if (!catId) {
                l2Container.classList.add('hidden');
                l3Container.classList.add('hidden');
                return;
            }

            l2Container.classList.remove('hidden');
            renderL2(catId);
        }

        function renderL2(catId, selectId = null) {
            const select = document.getElementById('line2Select');
            const options = config.l2[catId] || [];
            
            select.innerHTML = options.length ? options.map(o => `<option value="${o.id}" data-raw="${escapeHtml(o.text)}">${escapeHtml(o.text.replace(/\[.*?\]/g, ' ')).trim()}</option>`).join('') : '<option value="" disabled selected>無選項</option>';
            if (selectId && options.find(o => o.id === selectId)) select.value = selectId;
            
            onL2Change();
        }

        function onL2Change() {
            const l2Id = document.getElementById('line2Select').value;
            parseInputs('line2Select', 'line2Inputs', 'l2');

            const l3Container = document.getElementById('line3Container');
            if (!l2Id) {
                l3Container.classList.add('hidden');
                return;
            }

            l3Container.classList.remove('hidden');
            renderL3(l2Id);
        }

        function renderL3(l2Id, selectId = null) {
            const select = document.getElementById('line3Select');
            const options = config.l3[l2Id] || [];
            
            if (options.length === 0) {
                document.getElementById('line3Container').classList.add('hidden');
                select.innerHTML = '';
            } else {
                document.getElementById('line3Container').classList.remove('hidden');
                select.innerHTML = options.map(o => `<option value="${o.id}" data-raw="${escapeHtml(o.text)}">${escapeHtml(o.text.replace(/\[.*?\]/g, ' ')).trim()}</option>`).join('');
                if (selectId && options.find(o => o.id === selectId)) select.value = selectId;
            }
            onL3Change();
        }

        function onL3Change() {
            parseInputs('line3Select', 'line3Inputs', 'l3');
        }

        function parseInputs(selectId, containerId, levelPrefix) {
            const select = document.getElementById(selectId);
            const container = document.getElementById(containerId);
            if (!select.value || select.options[select.selectedIndex].disabled) {
                container.innerHTML = '';
                return;
            }
            const rawText = select.options[select.selectedIndex].getAttribute('data-raw');
            const regex = /\[(.*?)\]/g;
            let match, html = '', i = 0;
            while ((match = regex.exec(rawText)) !== null) {
                html += `<input type="number" id="${levelPrefix}_in_${i}" placeholder="${match[1]}" class="w-16 border border-gray-300 rounded px-1 py-1 text-center text-sm outline-none focus:ring-1 focus:ring-blue-500" min="0">`;
                i++;
            }
            container.innerHTML = html;
        }

        // ---- 動態管理功能 (增刪改) ----
        function addCategory() {
            const text = prompt('請輸入新「回報情境」名稱:');
            if (!text) return;
            const id = 'cat_' + genId();
            config.categories.push({ id, text });
            config.l2[id] = [];
            saveConfig(); renderCategories(id);
        }
        function editCategory() {
            const sel = document.getElementById('categorySelect');
            if (!sel.value) return;
            const text = prompt('修改「回報情境」名稱:', sel.options[sel.selectedIndex].getAttribute('data-raw'));
            if (!text) return;
            config.categories.find(c => c.id === sel.value).text = text;
            saveConfig(); renderCategories(sel.value);
        }
        function deleteCategory() {
            const sel = document.getElementById('categorySelect');
            if (!sel.value || !confirm('確定刪除此情境？\n(底下的子選項將會一併刪除)')) return;
            config.categories = config.categories.filter(c => c.id !== sel.value);
            delete config.l2[sel.value];
            saveConfig(); renderCategories();
        }

        function addL2() {
            const catId = document.getElementById('categorySelect').value;
            if (!catId) return alert('請先選擇回報情境！');
            const text = prompt('【新增第二行狀態】\n' + INPUT_HELP);
            if (!text) return;
            const id = 'l2_' + genId();
            if(!config.l2[catId]) config.l2[catId] = [];
            config.l2[catId].push({ id, text });
            config.l3[id] = [];
            saveConfig(); renderL2(catId, id);
        }
        function editL2() {
            const catId = document.getElementById('categorySelect').value;
            const sel = document.getElementById('line2Select');
            if (!sel.value) return;
            const text = prompt('【修改第二行狀態】\n' + INPUT_HELP, sel.options[sel.selectedIndex].getAttribute('data-raw'));
            if (!text) return;
            config.l2[catId].find(c => c.id === sel.value).text = text;
            saveConfig(); renderL2(catId, sel.value);
        }
        function deleteL2() {
            const catId = document.getElementById('categorySelect').value;
            const sel = document.getElementById('line2Select');
            if (!sel.value || !confirm('確定刪除？')) return;
            config.l2[catId] = config.l2[catId].filter(c => c.id !== sel.value);
            delete config.l3[sel.value];
            saveConfig(); renderL2(catId);
        }

        function addL3() {
            const l2Id = document.getElementById('line2Select').value;
            if (!l2Id) return alert('請先新增並選擇第二行狀態！');
            const text = prompt('【新增第三行狀態】\n' + INPUT_HELP);
            if (!text) return;
            const id = 'l3_' + genId();
            if(!config.l3[l2Id]) config.l3[l2Id] = [];
            config.l3[l2Id].push({ id, text });
            saveConfig(); renderL3(l2Id, id);
        }
        function editL3() {
            const l2Id = document.getElementById('line2Select').value;
            const sel = document.getElementById('line3Select');
            if (!sel.value) return;
            const text = prompt('【修改第三行狀態】\n' + INPUT_HELP, sel.options[sel.selectedIndex].getAttribute('data-raw'));
            if (!text) return;
            config.l3[l2Id].find(c => c.id === sel.value).text = text;
            saveConfig(); renderL3(l2Id, sel.value);
        }
        function deleteL3() {
            const l2Id = document.getElementById('line2Select').value;
            const sel = document.getElementById('line3Select');
            if (!sel.value || !confirm('確定刪除？')) return;
            config.l3[l2Id] = config.l3[l2Id].filter(c => c.id !== sel.value);
            saveConfig(); renderL3(l2Id);
        }

        // ---- 產生最終字串 ----
        function formatDynamicLine(selectId, levelPrefix) {
            const select = document.getElementById(selectId);
            if (!select || !select.value || select.options[select.selectedIndex].disabled) return '';
            const rawText = select.options[select.selectedIndex].getAttribute('data-raw');
            if (rawText === '無') return ''; 

            let result = rawText;
            let i = 0;
            result = result.replace(/\[.*?\]/g, () => {
                const el = document.getElementById(`${levelPrefix}_in_${i}`);
                const val = el ? (el.value || '0') : '0';
                i++;
                return val;
            });
            return result;
        }

        function generateAndCopyString() {
            const cat = document.getElementById('categorySelect').value;
            if (!cat) return alert('⚠️ 請先選擇回報情境！');

            const dateStr = document.getElementById('todayDate').innerText;
            const store = document.getElementById('locationSelect').value;
            const lines = [`${dateStr} ${store}`];

            const l2Container = document.getElementById('line2Container');
            if (!l2Container.classList.contains('hidden')) {
                const l2Text = formatDynamicLine('line2Select', 'l2');
                if (l2Text) lines.push(l2Text);
            }

            const l3Container = document.getElementById('line3Container');
            if (!l3Container.classList.contains('hidden')) {
                const l3Text = formatDynamicLine('line3Select', 'l3');
                if (l3Text) lines.push(l3Text);
            }

            const finalString = lines.join('\n');
            const output = document.getElementById('resultOutput');
            output.value = finalString;

            navigator.clipboard.writeText(finalString).then(() => {
                alert('✅ 字串已成功複製！\n\n' + finalString);
            }).catch(() => {
                alert('❌ 複製失敗，請手動選取文字框的內容複製。');
            });
        }

        /* ================= 3. 條碼 & QR Code 產生器邏輯 (未更動) ================= */
        function toggleAdvancedOptions() {
            const type = document.getElementById('codeType').value;
            document.getElementById('barcodeFormat').style.display = type === 'barcode' ? 'block' : 'none';
            document.getElementById('qrErrorLevel').style.display = type === 'qrcode' ? 'block' : 'none';
        }

        function generateCode() {
            const inputField = document.getElementById('inputValue');
            let rawInput = inputField.value.trim();
            const type = document.getElementById('codeType').value;

            if (!rawInput) return alert('⚠️ 請先輸入數值！');
            const safeInput = rawInput.replace(/[\u200B-\u200D\uFEFF]/g, '');
            const grid = document.getElementById('codeGrid');
            const card = document.createElement('div');
            card.className = 'bg-white p-4 border rounded-xl shadow-sm flex flex-col items-center gap-3';
            const textDisplay = document.createElement('div');
            textDisplay.className = 'font-bold text-gray-700 break-all text-center w-full text-sm';
            textDisplay.textContent = safeInput;
            const actions = document.createElement('div');
            actions.className = 'flex gap-2 w-full';

            let downloadTarget;
            try {
                if (type === 'barcode') {
                    if (typeof JsBarcode === 'undefined') return alert('⚠️ 條碼模組載入中，請稍候再試。');
                    const canvas = document.createElement('canvas');
                    const format = document.getElementById('barcodeFormat').value;
                    JsBarcode(canvas, safeInput, { format: format, width: 2, height: 60, displayValue: false, margin: 10 });
                    canvas.className = "max-w-full h-auto rounded bg-white p-2";
                    card.appendChild(canvas);
                    downloadTarget = canvas;
                } else if (type === 'qrcode') {
                    if (typeof QRious === 'undefined') return alert('⚠️ QR Code 模組載入中，請稍候再試。');
                    const qrCanvas = document.createElement('canvas');
                    new QRious({ element: qrCanvas, value: safeInput, size: 160, level: document.getElementById('qrErrorLevel').value });
                    qrCanvas.className = "max-w-full h-auto rounded bg-white p-2 border";
                    card.appendChild(qrCanvas);
                    downloadTarget = qrCanvas;
                }
            } catch (e) {
                return alert(`❌ 產生失敗！系統訊息: ${e.message || e}`); 
            }

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'flex-1 bg-blue-100 text-blue-600 font-bold py-2 rounded hover:bg-blue-200 transition text-sm';
            downloadBtn.textContent = '下載';
            downloadBtn.onclick = () => downloadImage(downloadTarget, safeInput, type);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'flex-1 bg-red-100 text-red-600 font-bold py-2 rounded hover:bg-red-200 transition text-sm';
            removeBtn.textContent = '移除';
            removeBtn.onclick = () => card.remove();

            actions.appendChild(downloadBtn);
            actions.appendChild(removeBtn);
            card.appendChild(textDisplay);
            card.appendChild(actions);

            grid.prepend(card); 
            inputField.value = ''; 
        }

        function downloadImage(canvas, text, type) {
            const url = canvas.toDataURL("image/png");
            const a = document.createElement('a');
            a.href = url;
            const safeName = text.replace(/[^a-zA-Z0-9]/gi, '_').substring(0, 15);
            a.download = `${type}_${safeName || 'image'}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchShortcuts(); 
            startGPS();       
            initSelects();    
        });
    </script>
</body>
