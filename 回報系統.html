<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蝦皮門市作業輔助系統</title>
    <!-- 引入 Tailwind CSS 美化介面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 JsBarcode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <!-- 引入 QRious (QR Code) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .num-input { width: 70px; text-align: center; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; margin: 0 4px; outline: none;}
        .num-input:focus { border-color: #f97316; ring: 2px solid #f97316; }
    </style>
</head>
<body class="pb-10">

    <!-- 頂部導航 -->
    <header class="bg-orange-500 text-white text-center py-4 sticky top-0 z-10 shadow-md">
        <h1 class="text-xl font-bold tracking-wider">📦 蝦皮門市作業輔助系統</h1>
    </header>

    <main class="max-w-xl mx-auto mt-4 px-4">
        
        <!-- 模組 1：LINE 群組快捷鍵 (支援 CRUD，使用 LocalStorage) -->
        <section class="mb-6 bg-white rounded-xl card p-5 border-t-4 border-green-500">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800">🟢 LINE 門市群組捷徑</h2>
                <button onclick="toggleShortcutManager()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded shadow">
                    ⚙️ 管理捷徑
                </button>
            </div>
            
            <!-- 捷徑顯示區 -->
            <div id="shortcutList" class="grid grid-cols-3 gap-2 text-center">
                <!-- 動態生成 -->
            </div>

            <!-- 捷徑管理區 (預設隱藏) -->
            <div id="shortcutManager" class="hidden mt-4 pt-4 border-t border-gray-200">
                <h3 class="text-sm font-bold text-gray-600 mb-2" id="managerTitle">➕ 新增捷徑</h3>
                <input type="hidden" id="editShortcutId">
                <div class="flex flex-col gap-2 mb-2">
                    <input type="text" id="shortcutName" placeholder="門市名稱 (例: 潮州愛國)" class="w-full border rounded p-2 text-sm">
                    <input type="text" id="shortcutUrl" placeholder="LINE 群組網址 (https://...)" class="w-full border rounded p-2 text-sm">
                </div>
                <div class="flex gap-2">
                    <button onclick="saveShortcut()" class="flex-1 bg-green-500 text-white text-sm font-bold py-2 rounded">儲存</button>
                    <button onclick="cancelEditShortcut()" class="flex-1 bg-gray-400 text-white text-sm font-bold py-2 rounded hidden" id="cancelShortcutBtn">取消</button>
                </div>
                <div id="manageList" class="mt-4 space-y-2">
                    <!-- 管理列表動態生成 -->
                </div>
            </div>
        </section>

        <!-- 模組 2：回報字串產生器 -->
        <section class="bg-white rounded-xl card p-5 mb-6 border-t-4 border-orange-500">
            <h2 class="text-lg font-bold text-gray-800 mb-4">📝 回報字串產生器</h2>
            
            <div class="mb-4 flex gap-2 items-center">
                <span class="bg-gray-200 text-gray-800 font-bold py-2 px-3 rounded" id="todayDate"></span>
                <select id="storeSelect" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-orange-500 text-md">
                    <option value="潮州中洲">潮州中洲</option>
                    <option value="潮州光華">潮州光華</option>
                    <option value="潮州大同">潮州大同</option>
                    <option value="潮州光春">潮州光春</option>
                    <option value="潮州愛國">潮州愛國</option>
                    <option value="潮州四維">潮州四維</option>
                    <option value="潮州文化">潮州文化</option>
                    <option value="潮州延平">潮州延平</option>
                    <option value="潮州太平">潮州太平</option>
                    <option value="潮州新生">潮州新生</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-600 mb-1">主分類</label>
                <select id="mainType" onchange="updateGeneratorUI()" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-orange-500 bg-orange-50 font-bold">
                    <option value="">-- 請選擇回報類型 --</option>
                    <option value="scs">SCS,FBS黑箱</option>
                    <option value="ndd_pack">NDD,FBS離店打包</option>
                    <option value="ndd_shelf">NDD上架完成</option>
                    <option value="reassign">包裹重新分配</option>
                    <option value="pda">PDA上架完成</option>
                    <option value="stay">滯留箱數回報</option>
                    <option value="check">門面檢查</option>
                </select>
            </div>

            <!-- 第二行動態區塊 -->
            <div id="line2Container" class="mb-4 hidden">
                <label class="block text-sm font-bold text-gray-600 mb-1">第二行</label>
                <div id="line2Content" class="flex flex-wrap items-center gap-2 p-3 bg-gray-50 rounded border"></div>
            </div>

            <!-- 第三行動態區塊 -->
            <div id="line3Container" class="mb-4 hidden">
                <label class="block text-sm font-bold text-gray-600 mb-1">第三行</label>
                <div id="line3Content" class="flex flex-wrap items-center gap-2 p-3 bg-gray-50 rounded border"></div>
            </div>

            <button onclick="generateString()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition mb-3">
                產生並複製字串
            </button>
            <textarea id="resultOutput" rows="4" class="w-full border border-gray-300 rounded-lg p-3 outline-none bg-gray-50 text-gray-800" readonly placeholder="產生的字串會顯示在這裡..."></textarea>
        </section>

        <!-- 模組 3：條碼與 QR Code 產生器 -->
        <section class="bg-white rounded-xl card p-5 mb-6 border-t-4 border-blue-500">
            <h2 class="text-lg font-bold text-gray-800 mb-4">🏷️ 條碼 & QR Code 產生器</h2>
            
            <div class="flex flex-col gap-3 mb-4">
                <input type="text" id="codeInputValue" placeholder="請輸入數值 (例如: SPX30657)..." class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" />
                
                <div class="flex gap-2">
                    <select id="codeType" onchange="toggleAdvancedOptions()" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 outline-none">
                        <option value="qrcode">QR Code</option>
                        <option value="barcode">條碼 (Barcode)</option>
                    </select>
                    
                    <select id="barcodeFormat" style="display: none;" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 outline-none">
                        <option value="CODE128">CODE128 (英數)</option>
                        <option value="CODE39">CODE39 (大寫)</option>
                    </select>

                    <select id="qrErrorLevel" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 outline-none">
                        <option value="M">容錯: 一般 (M)</option>
                        <option value="H">容錯: 高 (H)</option>
                    </select>
                </div>
                
                <button onclick="generateCode()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded-lg shadow transition">
                    產生圖片
                </button>
            </div>

            <div id="codeGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
                <!-- 生成的條碼卡片 -->
            </div>
        </section>

    </main>

    <script>
        /* =========================================================
           模組 1：LINE 捷徑管理 (LocalStorage)
           ========================================================= */
        const defaultShortcuts = [
            { id: Date.now()+1, name: '潮州愛國', url: 'https://line.me/R/ti/g/fZrPvcKMBK' },
            { id: Date.now()+2, name: '潮州中洲', url: 'https://line.me/R/ti/g/QBVMmunss2' },
            { id: Date.now()+3, name: '新園仙吉', url: 'https://line.me/R/ti/g/rqjPNW5fjg' }
        ];

        let shortcuts = [];

        function loadShortcuts() {
            const saved = localStorage.getItem('shopee_line_shortcuts');
            if (saved) {
                try { shortcuts = JSON.parse(saved); } catch(e) { shortcuts = defaultShortcuts; }
            } else {
                shortcuts = defaultShortcuts;
                saveToLocalStorage();
            }
            renderShortcuts();
        }

        function saveToLocalStorage() {
            localStorage.setItem('shopee_line_shortcuts', JSON.stringify(shortcuts));
        }

        function renderShortcuts() {
            const list = document.getElementById('shortcutList');
            const manageList = document.getElementById('manageList');
            list.innerHTML = '';
            manageList.innerHTML = '';

            shortcuts.forEach(sc => {
                // 主顯示區
                list.innerHTML += `<a href="${sc.url}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-3 px-1 rounded-lg shadow transition block truncate">${sc.name}</a>`;
                
                // 管理區
                manageList.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded border">
                        <span class="text-sm font-bold truncate flex-1">${sc.name}</span>
                        <div class="flex gap-1 ml-2">
                            <button onclick="editShortcut(${sc.id})" class="bg-blue-500 text-white text-xs px-2 py-1 rounded">編輯</button>
                            <button onclick="deleteShortcut(${sc.id})" class="bg-red-500 text-white text-xs px-2 py-1 rounded">刪除</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleShortcutManager() {
            const manager = document.getElementById('shortcutManager');
            manager.classList.toggle('hidden');
            cancelEditShortcut();
        }

        function saveShortcut() {
            const id = document.getElementById('editShortcutId').value;
            const name = document.getElementById('shortcutName').value.trim();
            const url = document.getElementById('shortcutUrl').value.trim();

            if (!name || !url) { alert('請填寫完整名稱與網址！'); return; }

            if (id) {
                // 修改
                const idx = shortcuts.findIndex(s => s.id == id);
                if(idx !== -1) {
                    shortcuts[idx].name = name;
                    shortcuts[idx].url = url;
                }
            } else {
                // 新增
                shortcuts.push({ id: Date.now(), name, url });
            }
            
            saveToLocalStorage();
            renderShortcuts();
            cancelEditShortcut();
        }

        function editShortcut(id) {
            const sc = shortcuts.find(s => s.id == id);
            if(sc) {
                document.getElementById('editShortcutId').value = sc.id;
                document.getElementById('shortcutName').value = sc.name;
                document.getElementById('shortcutUrl').value = sc.url;
                document.getElementById('managerTitle').innerText = '✏️ 編輯捷徑';
                document.getElementById('cancelShortcutBtn').classList.remove('hidden');
            }
        }

        function deleteShortcut(id) {
            if(confirm('確定要刪除此捷徑嗎？')) {
                shortcuts = shortcuts.filter(s => s.id != id);
                saveToLocalStorage();
                renderShortcuts();
            }
        }

        function cancelEditShortcut() {
            document.getElementById('editShortcutId').value = '';
            document.getElementById('shortcutName').value = '';
            document.getElementById('shortcutUrl').value = '';
            document.getElementById('managerTitle').innerText = '➕ 新增捷徑';
            document.getElementById('cancelShortcutBtn').classList.add('hidden');
        }

        /* =========================================================
           模組 2：回報字串產生器 (複雜邏輯映射)
           ========================================================= */
        const today = new Date();
        document.getElementById('todayDate').innerText = `${today.getMonth() + 1}/${today.getDate()}`;

        function updateGeneratorUI() {
            const type = document.getElementById('mainType').value;
            const l2Cont = document.getElementById('line2Container');
            const l3Cont = document.getElementById('line3Container');
            const l2 = document.getElementById('line2Content');
            const l3 = document.getElementById('line3Content');

            // 初始化隱藏與清空
            l2Cont.classList.add('hidden'); l3Cont.classList.add('hidden');
            l2.innerHTML = ''; l3.innerHTML = '';

            if (!type) return;

            switch(type) {
                case 'scs':
                    l2Cont.classList.remove('hidden');
                    l2.innerHTML = `
                        <select id="scs_l2_sel" onchange="handleSCS_L2()" class="border rounded p-1">
                            <option value="束帶">束帶</option>
                            <option value="無束帶">無束帶</option>
                        </select>
                        <span>×</span>
                        <input type="number" id="scs_l2_val" class="num-input" placeholder="數量" min="0">
                    `;
                    l3.innerHTML = `
                        <select id="scs_l3_sel" class="border rounded p-1">
                            <option value="束帶">束帶</option>
                            <option value="無束帶">無束帶</option>
                        </select>
                        <span>×</span>
                        <input type="number" id="scs_l3_val" class="num-input" placeholder="數量" min="0">
                    `;
                    handleSCS_L2(); // 觸發邏輯檢查第三行是否顯示
                    break;

                case 'ndd_pack':
                    l2Cont.classList.remove('hidden');
                    l2.innerHTML = `
                        <select id="np_l2_sel" onchange="handleNDDPack_L2()" class="border rounded p-1">
                            <option value="無">無</option>
                            <option value="缺">缺</option>
                        </select>
                        <input type="number" id="np_l2_val" class="num-input hidden" placeholder="數量" min="0">
                    `;
                    l3.innerHTML = `
                        <select id="np_l3_sel" class="border rounded p-1 w-full">
                            <option value="無">無</option>
                            <option value="已刷已找">已刷已找</option>
                        </select>
                    `;
                    handleNDDPack_L2();
                    break;

                case 'ndd_shelf':
                    l2Cont.classList.remove('hidden');
                    l2.innerHTML = `
                        <select id="ns_l2_sel" onchange="handleNDDShelf_L2()" class="border rounded p-1 w-full mb-1">
                            <option value="無">無</option>
                            <option value="缺滯留">缺/滯留(件)</option>
                            <option value="滯留裸">滯留(裸)</option>
                            <option value="異退">異退(件)</option>
                        </select>
                        <div id="ns_l2_inputs" class="w-full flex gap-1 items-center"></div>
                    `;
                    handleNDDShelf_L2();
                    break;

                case 'reassign':
                case 'check':
                    // 只有第一行，直接隱藏 2, 3 行 (前面已初始化隱藏)
                    break;

                case 'pda':
                case 'stay':
                    l2Cont.classList.remove('hidden');
                    l2.innerHTML = `
                        <select id="ps_l2_sel" onchange="handlePDAStay_L2()" class="border rounded p-1 w-full mb-1">
                            <option value="無">無</option>
                            <option value="箱裸">滯留(箱+裸)</option>
                            <option value="箱">滯留(箱)</option>
                            <option value="裸">滯留(裸)</option>
                        </select>
                        <div id="ps_l2_inputs" class="w-full flex gap-1 items-center"></div>
                    `;
                    l3.innerHTML = `
                        <select id="ps_l3_sel" class="border rounded p-1 w-full">
                            <option value="無合適櫃位">無合適櫃位</option>
                            <option value="無櫃位">無櫃位</option>
                        </select>
                    `;
                    handlePDAStay_L2();
                    break;
            }
        }

        // --- 連動邏輯函數 ---
        
        function handleSCS_L2() {
            const sel = document.getElementById('scs_l2_sel').value;
            const l3Cont = document.getElementById('line3Container');
            // 第二行點選無束帶絕不出現第三行
            if (sel === '無束帶') l3Cont.classList.add('hidden');
            else l3Cont.classList.remove('hidden');
        }

        function handleNDDPack_L2() {
            const sel = document.getElementById('np_l2_sel').value;
            const input = document.getElementById('np_l2_val');
            const l3Cont = document.getElementById('line3Container');
            if (sel === '無') {
                input.classList.add('hidden');
                l3Cont.classList.add('hidden');
            } else {
                input.classList.remove('hidden');
                l3Cont.classList.remove('hidden');
            }
        }

        function handleNDDShelf_L2() {
            const sel = document.getElementById('ns_l2_sel').value;
            const inputs = document.getElementById('ns_l2_inputs');
            const l3Cont = document.getElementById('line3Container');
            const l3 = document.getElementById('line3Content');
            
            inputs.innerHTML = '';
            l3Cont.classList.remove('hidden');

            if (sel === '無') {
                l3Cont.classList.add('hidden');
            } else if (sel === '缺滯留') {
                inputs.innerHTML = `<span>缺</span><input type="number" id="ns_v1" class="num-input"><span>滯留</span><input type="number" id="ns_v2" class="num-input"><span>件</span>`;
                l3.innerHTML = `<select id="ns_l3_sel" class="border rounded p-1 w-full"><option value="門市已無包裹">門市已無包裹</option></select>`;
            } else if (sel === '滯留裸') {
                inputs.innerHTML = `<span>滯留</span><input type="number" id="ns_v1" class="num-input"><span>裸</span>`;
                l3.innerHTML = `
                    <select id="ns_l3_sel" class="border rounded p-1 w-full">
                        <option value="無合適櫃位">無合適櫃位</option>
                        <option value="無櫃位">無櫃位</option>
                    </select>`;
            } else if (sel === '異退') {
                inputs.innerHTML = `<span>異退</span><input type="number" id="ns_v1" class="num-input"><span>件</span>`;
                l3.innerHTML = `
                    <select id="ns_l3_sel" class="border rounded p-1 w-full">
                        <option value="濕損破損">濕損破損</option>
                        <option value="系統無法驗收">系統無法驗收</option>
                        <option value="無面單">無面單</option>
                        <option value="雙面對單">雙面對單</option>
                    </select>`;
            }
        }

        function handlePDAStay_L2() {
            const sel = document.getElementById('ps_l2_sel').value;
            const inputs = document.getElementById('ps_l2_inputs');
            const l3Cont = document.getElementById('line3Container');
            
            inputs.innerHTML = '';
            if (sel === '無') {
                l3Cont.classList.add('hidden');
            } else {
                l3Cont.classList.remove('hidden');
                if (sel === '箱裸') inputs.innerHTML = `<span>滯留</span><input type="number" id="ps_v1" class="num-input"><span>箱</span><input type="number" id="ps_v2" class="num-input"><span>裸</span>`;
                if (sel === '箱') inputs.innerHTML = `<span>滯留</span><input type="number" id="ps_v1" class="num-input"><span>箱</span>`;
                if (sel === '裸') inputs.innerHTML = `<span>滯留</span><input type="number" id="ps_v1" class="num-input"><span>裸</span>`;
            }
        }

        // --- 字串生成器邏輯 ---
        function generateString() {
            const type = document.getElementById('mainType').value;
            if (!type) { alert('請先選擇回報主分類！'); return; }

            const dateStr = document.getElementById('todayDate').innerText;
            const store = document.getElementById('storeSelect').value;
            let result = [ `${dateStr} ${store}` ]; // 第一行

            const getV = (id) => { const el=document.getElementById(id); return el ? (el.value||'0') : '0'; };

            if (type === 'scs') {
                const l2s = document.getElementById('scs_l2_sel').value;
                result.push(`${l2s}×${getV('scs_l2_val')}`);
                if (l2s !== '無束帶') {
                    const l3s = document.getElementById('scs_l3_sel').value;
                    result.push(`${l3s}×${getV('scs_l3_val')}`);
                }
            } 
            else if (type === 'ndd_pack') {
                const l2s = document.getElementById('np_l2_sel').value;
                if (l2s === '無') {
                    result.push('無');
                } else {
                    result.push(`缺${getV('np_l2_val')}`);
                    result.push(document.getElementById('np_l3_sel').value);
                }
            }
            else if (type === 'ndd_shelf') {
                const l2s = document.getElementById('ns_l2_sel').value;
                if (l2s === '無') {
                    result.push('無');
                } else {
                    if (l2s === '缺滯留') result.push(`缺${getV('ns_v1')}滯留${getV('ns_v2')}件`);
                    if (l2s === '滯留裸') result.push(`滯留${getV('ns_v1')}裸`);
                    if (l2s === '異退') result.push(`異退${getV('ns_v1')}件`);
                    result.push(document.getElementById('ns_l3_sel').value);
                }
            }
            else if (type === 'pda' || type === 'stay') {
                const l2s = document.getElementById('ps_l2_sel').value;
                if (l2s === '無') {
                    result.push('無');
                } else {
                    if (l2s === '箱裸') result.push(`滯留${getV('ps_v1')}箱${getV('ps_v2')}裸`);
                    if (l2s === '箱') result.push(`滯留${getV('ps_v1')}箱`);
                    if (l2s === '裸') result.push(`滯留${getV('ps_v1')}裸`);
                    result.push(document.getElementById('ps_l3_sel').value);
                }
            }

            // check 和 reassign 只有第一行，不需額外 push

            const finalStr = result.join('\n');
            const outputArea = document.getElementById('resultOutput');
            outputArea.value = finalStr;

            // 複製到剪貼簿
            navigator.clipboard.writeText(finalStr).then(() => {
                alert('✅ 字串已成功產生並複製！\n您可以直接去 LINE 貼上了。');
            }).catch(() => {
                alert('字串已產生，但您的瀏覽器阻擋了自動複製，請手動複製下方文字。');
            });
        }


        /* =========================================================
           模組 3：條碼與 QR Code 產生器 (完全沿用，適配 Tailwind)
           ========================================================= */
        function toggleAdvancedOptions() {
            const type = document.getElementById('codeType').value;
            document.getElementById('barcodeFormat').style.display = type === 'barcode' ? 'block' : 'none';
            document.getElementById('qrErrorLevel').style.display = type === 'qrcode' ? 'block' : 'none';
        }

        function generateCode() {
            const inputField = document.getElementById('codeInputValue');
            let rawInput = inputField.value.trim();
            const type = document.getElementById('codeType').value;

            if (!rawInput) { alert('⚠️ 請先輸入數值！'); return; }

            const safeInput = rawInput.replace(/[\u200B-\u200D\uFEFF]/g, '');
            const grid = document.getElementById('codeGrid');
            const card = document.createElement('div');
            card.className = 'bg-gray-50 border p-4 rounded-xl flex flex-col items-center gap-3 relative';

            const textDisplay = document.createElement('div');
            textDisplay.className = 'w-full text-center font-bold text-gray-700 break-all text-sm';
            textDisplay.textContent = safeInput;

            const actions = document.createElement('div');
            actions.className = 'flex w-full gap-2 mt-2';

            let downloadTarget;

            try {
                if (type === 'barcode') {
                    if (typeof JsBarcode === 'undefined') { alert('模組載入中，請稍候。'); return; }
                    const canvas = document.createElement('canvas');
                    canvas.className = 'max-w-full bg-white p-2 rounded';
                    const format = document.getElementById('barcodeFormat').value;
                    JsBarcode(canvas, safeInput, { format: format, width: 2, height: 60, displayValue: false, margin: 10 });
                    card.appendChild(canvas);
                    downloadTarget = canvas;
                } else {
                    if (typeof QRious === 'undefined') { alert('模組載入中，請稍候。'); return; }
                    const qrCanvas = document.createElement('canvas');
                    qrCanvas.className = 'max-w-full bg-white p-2 rounded';
                    new QRious({ element: qrCanvas, value: safeInput, size: 180, level: document.getElementById('qrErrorLevel').value });
                    card.appendChild(qrCanvas);
                    downloadTarget = qrCanvas;
                }
            } catch (e) {
                alert(`❌ 產生失敗: ${e.message}`);
                return; 
            }

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'flex-1 bg-blue-500 hover:bg-blue-600 text-white text-xs py-2 rounded';
            downloadBtn.textContent = '下載';
            downloadBtn.onclick = () => downloadImage(downloadTarget, safeInput, type);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'flex-1 bg-red-500 hover:bg-red-600 text-white text-xs py-2 rounded';
            removeBtn.textContent = '刪除';
            removeBtn.onclick = () => card.remove();

            actions.appendChild(downloadBtn);
            actions.appendChild(removeBtn);
            card.appendChild(textDisplay);
            card.appendChild(actions);
            grid.prepend(card); 
            inputField.value = ''; 
        }

        function downloadImage(canvas, text, type) {
            const url = canvas.toDataURL("image/png");
            const a = document.createElement('a');
            a.href = url;
            a.download = `${type}_${text.replace(/[^a-zA-Z0-9]/gi, '_').substring(0, 15)}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 初始化
        window.onload = () => {
            loadShortcuts();
            toggleAdvancedOptions();
        };
    </script>
</body>
</html>
