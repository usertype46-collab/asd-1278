<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烤漆作業排程 - 順序看板與查詢 (含總排程)</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 基礎全域設定，採用深色模式提升視覺舒適度 */
        body { 
            background-color: #1e1e1e; 
            color: #e5e5e5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        /* 卡片容器樣式設定 */
        .card { 
            background-color: #252526; 
            border: 1px solid #3c3c3c; 
            border-radius: 0.5rem; 
            padding: 1.5rem; 
            margin-bottom: 1.5rem; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        
        /* 表格與儲存格通用樣式 */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: auto; 
        }
        th, td { 
            border: 1px solid #444; 
            padding: 0.85rem; 
            vertical-align: middle; 
        }
        th { 
            background-color: #2d2d2d; 
            color: #fff; 
            white-space: nowrap; 
            font-weight: 600; 
            text-align: left; 
        }
        
        /* 特定欄位寬度設定 */
        .w-seq { width: 60px; text-align: center; }
        .w-color { width: 180px; }
        .w-model { width: 180px; }
        .w-action { width: 120px; text-align: center; }

        /* 表單輸入框樣式設定 */
        input[type="text"], input[type="date"], select { 
            background-color: #1e1e1e; 
            color: #fff; 
            border: 1px solid #555; 
            border-radius: 0.375rem; 
            padding: 0.5rem; 
            width: 100%; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 1px #3b82f6; 
        }
        
        /* 按鈕基礎過渡效果 */
        button { 
            cursor: pointer; 
            transition: all 0.2s ease-in-out; 
        }

        /* 總排程看板專屬樣式 */
        .master-table-container {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #444;
            border-radius: 0.375rem;
        }
        
        /* 固定表頭以利長資料捲動閱讀 */
        .master-table th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #1f2937;
            box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.4);
        }

        /* 狀態填滿特效類別：排版, 倉庫, 採購, 完成 */
        .status-red {
            background-color: #dc2626 !important; /* Tailwind red-600 */
            color: #ffffff !important;
            font-weight: 700;
        }

        /* 狀態填滿特效類別：作業中 */
        .status-violet {
            background-color: #7c3aed !important; /* Tailwind violet-600 */
            color: #ffffff !important;
            font-weight: 700;
        }

        /* 狀態填滿特效類別：完成-先挪庫存料 */
        .status-orange {
            background-color: #f97316 !important; /* Tailwind orange-500 */
            color: #ffffff !important;
            font-weight: 700;
        }

        /* 捲軸美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-base">

    <!-- 用於編輯時的自動補齊清單 -->
    <datalist id="color-list"></datalist>
    <datalist id="model-list"></datalist>

    <!-- 頂部導覽列與語系切換 -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b border-gray-700 gap-4">
        <h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-2" data-i18n="appTitle">
            📊 烤漆作業順序看板
        </h1>
        <div class="flex items-center gap-3 flex-wrap">
            <a href="烤漆順序管理.html" class="bg-gray-700 hover:bg-gray-600 text-green-400 px-4 py-2 rounded-md flex items-center gap-2 font-medium shadow">
                <i class="fa-solid fa-pen-to-square"></i> 切換至建立紀錄
            </a>
            <div class="flex items-center gap-2 ml-2">
                <span class="text-sm text-gray-400" data-i18n="langLabel">語言 / Ngôn ngữ:</span>
                <select id="lang-switch" class="w-auto cursor-pointer py-1 px-2 text-sm">
                    <option value="zh">繁體中文</option>
                    <option value="vi">Tiếng Việt</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 主要內容區塊 -->
    <div class="grid grid-cols-1 gap-8">

        <!-- 新增區塊：總排程看板 (Google Sheets 即時同步) -->
        <div class="card border-l-4 border-l-orange-500 shadow-xl">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-4">
                <h2 class="text-xl font-bold text-orange-400 flex items-center flex-wrap gap-2">
                    <i class="fa-solid fa-table-list mr-1"></i>
                    <span data-i18n="masterTitle">總排程看板 (Google 試算表)</span>
                </h2>
                
                <!-- 控制面板：顯示更新時間與倒數計時器 -->
                <div class="flex items-center gap-3 bg-gray-800 px-3 py-2 rounded-lg border border-gray-700">
                    <div class="flex flex-col text-xs text-gray-400">
                        <span>最後更新: <span id="last-update-time" class="text-white font-mono">--:--:--</span></span>
                        <span>下次更新: <span id="next-update-timer" class="text-orange-400 font-mono font-bold">10:00</span></span>
                    </div>
                    <div class="h-6 w-px bg-gray-600 mx-1"></div>
                    <button id="btn-refresh-master" class="bg-orange-600 hover:bg-orange-700 text-white px-3 py-1 rounded text-sm flex items-center gap-1 transition-all shadow">
                        <i class="fa-solid fa-rotate"></i> 立即更新
                    </button>
                </div>
            </div>
            
            <!-- 總排程表格容器 -->
            <div class="master-table-container">
                <table class="min-w-full master-table" id="master-table">
                    <thead id="master-thead">
                        <!-- 表頭將由 JS 動態生成 -->
                        <tr><th class="text-gray-400 py-3">資料載入中...</th></tr>
                    </thead>
                    <tbody id="master-tbody">
                        <!-- 表格內容將由 JS 動態生成 -->
                        <tr><td class="text-center text-gray-500 py-10"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 區塊 1: 作業資料看板 (Firebase 當日或次日邏輯) -->
        <div class="card border-l-4 border-l-green-500 shadow-lg">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-2">
                <h2 class="text-xl font-bold text-green-400 flex items-center flex-wrap gap-2">
                    <i class="fa-solid fa-calendar-day mr-1"></i>
                    <span id="board-title-text" data-i18n="todayTitle">今日作業資料</span>
                    <span id="today-date-display" class="text-white bg-gray-700 px-3 py-1 rounded text-base font-normal"></span>
                </h2>
                <span class="text-sm text-gray-400 bg-gray-800 px-2 py-1 rounded">
                    <i class="fa-solid fa-rotate animate-spin mr-2"></i>即時同步 (16:30自動切換次日)
                </span>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr>
                            <th class="w-seq" data-i18n="thNo">序號</th>
                            <th class="w-color" data-i18n="thColor">顏色</th>
                            <th class="w-model" data-i18n="thModel">機型</th>
                            <th data-i18n="thRemark">備註</th>
                            <th class="w-action" data-i18n="thAction">操作</th>
                        </tr>
                    </thead>
                    <tbody id="today-tbody">
                        <tr><td colspan="5" class="text-center text-gray-500 py-6" data-i18n="msgLoading">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 區塊 2: 歷史記錄查詢 (Firebase 搜尋功能) -->
        <div class="card border-l-4 border-l-blue-500">
            <h2 class="text-xl font-bold text-blue-400 mb-5 flex items-center gap-2" data-i18n="searchTitle">
                <i class="fa-solid fa-magnifying-glass"></i> 歷史記錄查詢
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end mb-6">
                <div>
                    <label class="block text-sm text-gray-400 mb-1 font-medium" data-i18n="lblDate">日期 (Ngày)</label>
                    <input type="date" id="search-date">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1 font-medium" data-i18n="lblColor">顏色 (Màu sắc)</label>
                    <input type="text" id="search-color" data-i18n-ph="phSearchColor" placeholder="輸入顏色查詢...">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1 font-medium" data-i18n="lblModel">機型 (Model)</label>
                    <input type="text" id="search-model" data-i18n-ph="phSearchModel" placeholder="輸入機型查詢...">
                </div>
                <div class="flex gap-2">
                    <button id="btn-search" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-3 rounded shadow font-bold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i> <span data-i18n="btnSearch">查詢</span>
                    </button>
                    <button id="btn-reset-search" class="w-full bg-gray-600 hover:bg-gray-700 text-white py-2 px-3 rounded shadow font-bold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> <span data-i18n="btnReset">重設</span>
                    </button>
                </div>
            </div>

            <!-- 查詢結果表格 -->
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr>
                            <th data-i18n="thDate">日期</th>
                            <th class="w-seq" data-i18n="thNo">序號</th>
                            <th class="w-color" data-i18n="thColor">顏色</th>
                            <th class="w-model" data-i18n="thModel">機型</th>
                            <th data-i18n="thRemark">備註</th>
                            <th class="w-action" data-i18n="thAction">操作</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="6" class="text-center text-gray-500 py-6" data-i18n="msgNoData">請設定條件進行查詢</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- 腳本邏輯區：包含 Firebase 與 Google Sheets 解析 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Firebase 原始設定與初始化
        const firebaseConfig = {
            apiKey: "AIzaSyBvx7Ej2h9ZV5S1t_Gag756qop_jcoxy2U",
            authDomain: "shopee-60a13.firebaseapp.com",
            databaseURL: "https://shopee-60a13-default-rtdb.firebaseio.com",
            projectId: "shopee-60a13",
            storageBucket: "shopee-60a13.firebasestorage.app",
            messagingSenderId: "18436404849",
            appId: "1:18436404849:web:f2bdfa4189ff15456fcdd0"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 系統全域變數
        let currentLang = 'zh';
        let todayData = [];
        let historyData = [];
        let isEditingToday = null;
        let isEditingHistory = null;

        // 國定假日清單，用於過濾工作日
        const holidays = new Set([
            "2026-01-01", "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19", "2026-02-20", 
            "2026-02-28", "2026-04-03", "2026-04-06", "2026-05-01", "2026-06-19", "2026-09-25", "2026-10-09"
        ]);

        // 詞彙翻譯對照表
        const contentDict = {
            "急件": "Hàng gấp",
            "特急": "Cực gấp",
            "重烤": "Sơn lại",
            "補漆": "Sơn dặm",
            "缺件": "Thiếu kiện",
            "暫停": "Tạm dừng",
            "優先": "Ưu tiên",
            "待確認": "Chờ xác nhận",
            "測試": "Kiểm tra",
            "報廢": "Phế liệu",
            "打樣": "Hàng mẫu"
        };

        /**
         * 多國語系內容翻譯函數
         * @param {string} text - 原始文本
         * @param {string} targetLang - 目標語系 ('zh' 或是 'vi')
         * @returns {string} 翻譯後的文本
         */
        function translateContent(text, targetLang) {
            if (!text) return '';
            let result = text;
            if (targetLang === 'vi') {
                for (const [zh, vi] of Object.entries(contentDict)) {
                    result = result.split(zh).join(vi);
                }
            } else if (targetLang === 'zh') {
                for (const [zh, vi] of Object.entries(contentDict)) {
                    result = result.split(vi).join(zh);
                }
            }
            return result;
        }

        // 介面翻譯字典
        const i18n = {
            zh: {
                appTitle: "📊 烤漆作業順序看板", langLabel: "語言 / Ngôn ngữ:", 
                masterTitle: "總排程看板 (即時同步)", searchTitle: "歷史記錄查詢",
                lblDate: "日期 (Ngày)", lblColor: "顏色 (Màu sắc)", lblModel: "Model (機型)",
                btnSearch: "查詢", btnReset: "重設", msgNoData: "尚無符合條件的資料", msgLoading: "載入中...",
                todayTitle: "今日作業資料", nextDayTitle: "次日作業排程 (已過16:30)", 
                thDate: "日期", thNo: "序號", thColor: "顏色", thModel: "機型", thRemark: "備註", thAction: "操作",
                phSearchColor: "輸入顏色查詢...", phSearchModel: "輸入機型查詢...",
                btnEdit: "編輯", btnSave: "儲存", btnCancel: "取消", msgUpdateOk: "資料更新成功！", msgUpdateErr: "資料更新失敗："
            },
            vi: {
                appTitle: "📊 Bảng Thứ tự Sơn", langLabel: "Ngôn ngữ / 語言:", 
                masterTitle: "Bảng tổng tiến độ (Đồng bộ trực tiếp)", searchTitle: "Tra cứu lịch sử",
                lblDate: "Ngày (日期)", lblColor: "Màu sắc (顏色)", lblModel: "Model (機型)",
                btnSearch: "Tìm kiếm", btnReset: "Đặt lại", msgNoData: "Không có dữ liệu", msgLoading: "Đang tải...",
                todayTitle: "Dữ liệu làm việc hôm nay", nextDayTitle: "Lịch trình ngày mai (Đã qua 16:30)", 
                thDate: "Ngày", thNo: "STT", thColor: "Màu sắc", thModel: "Model", thRemark: "Ghi chú", thAction: "Thao tác",
                phSearchColor: "Nhập màu sắc...", phSearchModel: "Nhập model...",
                btnEdit: "Sửa", btnSave: "Lưu", btnCancel: "Hủy", msgUpdateOk: "Cập nhật thành công!", msgUpdateErr: "Cập nhật thất bại: "
            }
        };

        const weekdays = {
            zh: ["日", "一", "二", "三", "四", "五", "六"],
            vi: ["CN", "T2", "T3", "T4", "T5", "T6", "T7"]
        };

        // Firebase 載入自動補齊選單
        onValue(ref(db, 'settings/colors'), (snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('color-list').innerHTML = snapshot.val().map(c => `<option value="${c}">`).join('');
            }
        });
        onValue(ref(db, 'settings/models'), (snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('model-list').innerHTML = snapshot.val().map(m => `<option value="${m}">`).join('');
            }
        });

        /**
         * 格式化日期至資料庫所需的 YYYY-MM-DD
         */
        function getDBDateFormat(dateObj) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        }

        /**
         * 取得下一個工作日 (略過週末與國定假日)
         */
        function getNextWorkingDate() {
            let nextDate = new Date();
            while (true) {
                nextDate.setDate(nextDate.getDate() + 1);
                let day = nextDate.getDay();
                let isoStr = getDBDateFormat(nextDate);
                if (day !== 0 && day !== 6 && !holidays.has(isoStr)) break;
            }
            const nextDB = getDBDateFormat(nextDate);
            const nextDisplay = `${nextDate.getMonth() + 1}/${nextDate.getDate()} (${currentLang === 'vi' ? 'Thứ ' : '週'}${weekdays[currentLang][nextDate.getDay()]})`;
            return { dbDate: nextDB, displayDate: nextDisplay, isNext: true };
        }

        /**
         * 判斷應顯示的日期面板 (超過 16:30 自動切換至次日)
         */
        function getTargetBoardDate() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            if (hours > 16 || (hours === 16 && minutes >= 30)) {
                return getNextWorkingDate();
            } else {
                const todayDB = getDBDateFormat(now);
                const todayDisplay = `${now.getMonth() + 1}/${now.getDate()} (${currentLang === 'vi' ? 'Thứ ' : '週'}${weekdays[currentLang][now.getDay()]})`;
                return { dbDate: todayDB, displayDate: todayDisplay, isNext: false };
            }
        }

        let currentActiveTarget = getTargetBoardDate();

        /**
         * 套用當前選定的介面語系
         */
        function applyLanguage() {
            const t = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = t[el.getAttribute('data-i18n')]; });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.getAttribute('data-i18n-ph')]; });
            
            currentActiveTarget = getTargetBoardDate();
            document.getElementById('board-title-text').innerText = currentActiveTarget.isNext ? t.nextDayTitle : t.todayTitle;
            document.getElementById('today-date-display').innerText = currentActiveTarget.displayDate;
            
            renderTodayTable();
            renderHistoryTable();
        }

        // 監聽語系切換
        document.getElementById('lang-switch').addEventListener('change', (e) => {
            currentLang = e.target.value;
            applyLanguage();
        });

        /**
         * 渲染今日(或次日)之 Firebase 表格
         */
        function renderTodayTable() {
            const tbody = document.getElementById('today-tbody');
            const t = i18n[currentLang];
            tbody.innerHTML = '';
            
            if (todayData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-gray-500 py-6">${t.msgNoData}</td></tr>`;
                return;
            }

            todayData.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800 transition-colors";
                
                if (isEditingToday === idx) {
                    tr.innerHTML = `
                        <td class="text-center font-bold text-green-400">${item.seqNo}</td>
                        <td><input type="text" id="edit-t-color-${idx}" list="color-list" value="${item.color || ''}"></td>
                        <td><input type="text" id="edit-t-model-${idx}" list="model-list" value="${item.model || ''}"></td>
                        <td><input type="text" id="edit-t-remark-${idx}" value="${item.remarks ? item.remarks.join(' / ') : ''}" placeholder="使用 / 分隔多條備註"></td>
                        <td class="text-center">
                            <div class="flex flex-col md:flex-row gap-2 justify-center">
                                <button onclick="saveToday(${idx})" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm"><i class="fa-solid fa-check"></i> ${t.btnSave}</button>
                                <button onclick="cancelEditToday()" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded text-sm"><i class="fa-solid fa-xmark"></i> ${t.btnCancel}</button>
                            </div>
                        </td>
                    `;
                } else {
                    const displayColor = translateContent(item.color || '', currentLang);
                    const displayModel = translateContent(item.model || '', currentLang);
                    const displayRemarks = item.remarks ? item.remarks.map(r => translateContent(r, currentLang)).join('<br>') : '';
                    
                    tr.innerHTML = `
                        <td class="text-center font-bold text-green-400 text-lg">${item.seqNo}</td>
                        <td class="font-bold text-white text-lg">${displayColor}</td>
                        <td class="font-bold text-white text-lg">${displayModel}</td>
                        <td class="text-gray-300">${displayRemarks}</td>
                        <td class="text-center">
                            <button onclick="editToday(${idx})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded shadow text-sm font-bold"><i class="fa-solid fa-pen"></i> ${t.btnEdit}</button>
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            });
        }

        /**
         * 渲染歷史搜尋之 Firebase 表格
         */
        function renderHistoryTable() {
            const tbody = document.getElementById('history-tbody');
            const t = i18n[currentLang];
            tbody.innerHTML = '';
            
            if (historyData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-gray-500 py-6">${t.msgNoData}</td></tr>`;
                return;
            }

            historyData.forEach((r, idx) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-700 transition-colors";
                
                if (isEditingHistory === idx) {
                    tr.innerHTML = `
                        <td class="text-blue-300 font-mono align-middle">${r.date}</td>
                        <td class="text-center font-bold align-middle">${r.seqNo}</td>
                        <td><input type="text" id="edit-h-color-${idx}" list="color-list" value="${r.color||''}"></td>
                        <td><input type="text" id="edit-h-model-${idx}" list="model-list" value="${r.model||''}"></td>
                        <td><input type="text" id="edit-h-remark-${idx}" value="${r.remarks ? r.remarks.join(' / ') : ''}" placeholder="使用 / 分隔多條備註"></td>
                        <td class="text-center align-middle">
                            <div class="flex flex-col md:flex-row gap-2 justify-center">
                                <button onclick="saveHistory(${idx})" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm"><i class="fa-solid fa-check"></i> ${t.btnSave}</button>
                                <button onclick="cancelEditHistory()" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded text-sm"><i class="fa-solid fa-xmark"></i> ${t.btnCancel}</button>
                            </div>
                        </td>
                    `;
                } else {
                    const displayColor = translateContent(r.color || '', currentLang);
                    const displayModel = translateContent(r.model || '', currentLang);
                    const displayRemarks = r.remarks ? r.remarks.map(rmk => translateContent(rmk, currentLang)).join(' / ') : '';
                    
                    tr.innerHTML = `
                        <td class="text-blue-300 font-mono">${r.date}</td>
                        <td class="text-center font-bold text-lg">${r.seqNo}</td>
                        <td class="text-lg font-bold">${displayColor}</td>
                        <td class="text-lg font-bold">${displayModel}</td>
                        <td>${displayRemarks}</td>
                        <td class="text-center">
                            <button onclick="editHistory(${idx})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded shadow text-sm font-bold"><i class="fa-solid fa-pen"></i> ${t.btnEdit}</button>
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            });
        }

        // Firebase 編輯保存與取消邏輯
        window.editToday = (idx) => { isEditingToday = idx; renderTodayTable(); };
        window.cancelEditToday = () => { isEditingToday = null; renderTodayTable(); };
        window.saveToday = async (idx) => {
            const item = todayData[idx];
            const color = document.getElementById(`edit-t-color-${idx}`).value.trim().toUpperCase();
            const model = document.getElementById(`edit-t-model-${idx}`).value.trim().toUpperCase();
            const rmkStr = document.getElementById(`edit-t-remark-${idx}`).value.trim();
            const remarks = rmkStr ? rmkStr.split('/').map(r => r.trim()).filter(r => r !== '') : [];
            const updatedData = { ...item, color, model, remarks };
            try {
                await set(ref(db, `schedules/${currentActiveTarget.dbDate}/${item.originalIndex}`), updatedData);
                isEditingToday = null;
                alert(i18n[currentLang].msgUpdateOk);
            } catch (err) {
                alert(i18n[currentLang].msgUpdateErr + err.message);
            }
        };

        window.editHistory = (idx) => { isEditingHistory = idx; renderHistoryTable(); };
        window.cancelEditHistory = () => { isEditingHistory = null; renderHistoryTable(); };
        window.saveHistory = async (idx) => {
            const item = historyData[idx];
            const color = document.getElementById(`edit-h-color-${idx}`).value.trim().toUpperCase();
            const model = document.getElementById(`edit-h-model-${idx}`).value.trim().toUpperCase();
            const rmkStr = document.getElementById(`edit-h-remark-${idx}`).value.trim();
            const remarks = rmkStr ? rmkStr.split('/').map(r => r.trim()).filter(r => r !== '') : [];
            const updatedData = { seqNo: item.seqNo, color, model, remarks };
            try {
                await set(ref(db, `schedules/${item.date}/${item.originalIndex}`), updatedData);
                historyData[idx] = { ...item, color, model, remarks };
                isEditingHistory = null;
                renderHistoryTable();
                alert(i18n[currentLang].msgUpdateOk);
            } catch (err) {
                alert(i18n[currentLang].msgUpdateErr + err.message);
            }
        };

        /**
         * 監聽 Firebase 今日(或次日) 即時排程資料
         */
        function listenActiveSchedule() {
            currentActiveTarget = getTargetBoardDate();
            const t = i18n[currentLang];
            document.getElementById('board-title-text').innerText = currentActiveTarget.isNext ? t.nextDayTitle : t.todayTitle;
            document.getElementById('today-date-display').innerText = currentActiveTarget.displayDate;

            onValue(ref(db, `schedules/${currentActiveTarget.dbDate}`), (snapshot) => {
                todayData = [];
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    Object.keys(data).forEach(key => {
                        if (data[key]) todayData.push({ originalIndex: key, ...data[key] });
                    });
                }
                renderTodayTable();
            });
        }

        // Firebase 搜尋按鈕事件
        document.getElementById('btn-search').addEventListener('click', async () => {
            const sDate = document.getElementById('search-date').value;
            const sColor = document.getElementById('search-color').value.trim().toUpperCase();
            const sModel = document.getElementById('search-model').value.trim().toUpperCase();
            const tbody = document.getElementById('history-tbody');
            
            isEditingHistory = null;
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-blue-400 py-6"><i class="fa-solid fa-spinner fa-spin mr-2"></i> ${i18n[currentLang].msgLoading}</td></tr>`;
            
            try {
                let results = [];
                if (sDate) {
                    const snap = await get(ref(db, `schedules/${sDate}`));
                    if(snap.exists()) {
                        const data = snap.val();
                        Object.keys(data).forEach(key => {
                            if(data[key]) results.push({ date: sDate, originalIndex: key, ...data[key] });
                        });
                    }
                } else {
                    const snap = await get(ref(db, `schedules`));
                    if(snap.exists()) {
                        const allData = snap.val();
                        Object.keys(allData).forEach(d => {
                            const dayData = allData[d];
                            Object.keys(dayData).forEach(key => {
                                if(dayData[key]) results.push({ date: d, originalIndex: key, ...dayData[key] });
                            });
                        });
                    }
                }

                if (sColor) results = results.filter(r => r.color && r.color.includes(sColor));
                if (sModel) results = results.filter(r => r.model && r.model.includes(sModel));

                results.sort((a, b) => b.date.localeCompare(a.date) || a.seqNo - b.seqNo);
                historyData = results;
                renderHistoryTable();

            } catch (err) {
                alert(`搜尋失敗 / Lỗi tìm kiếm: ${err.message}`);
            }
        });

        document.getElementById('btn-reset-search').addEventListener('click', () => {
            document.getElementById('search-date').value = '';
            document.getElementById('search-color').value = '';
            document.getElementById('search-model').value = '';
            historyData = [];
            isEditingHistory = null;
            renderHistoryTable();
        });


        /* =========================================================================
           新增區塊：總排程看板 (Google Sheets API 整合邏輯)
           - 讀取唯讀工作表 1 所有資料，不動原資料。
           - 狀態關鍵字填滿：紅(排版/倉庫/採購/完成)、紫(作業中)、橙(完成-先挪庫存料)。
           - 顏色對應：依據文字內容轉換為 CSS 色碼顯示。
           - 10 分鐘計時自動更新機制。
           ========================================================================= */

        const GOOGLE_SHEET_ID = "1Xo-KJND3rkrv02Wl3CdnrJh7g1kyV2gIaOUl0vYKrAk";
        // 透過 Google Visualization API 跨域讀取 JSON 資料 (gid=0 代表工作表 1)
        const MASTER_DATA_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;
        
        let masterTimerInterval = null;
        let masterCountdown = 600; // 600 秒 = 10 分鐘

        /**
         * 顏色轉換引擎：將中文顏色名稱轉為 CSS 色碼 (用於烤漆顏色標示)
         * @param {string} colorText 儲存格內的文字
         * @returns {string|null} 對應的 CSS色碼或 null
         */
        function mapColorNameToHex(colorText) {
            if (!colorText) return null;
            const text = colorText.trim();
            // 常見顏色名稱映射字典
            const colorMap = {
                '紅': '#ef4444', '藍': '#3b82f6', '黃': '#eab308', 
                '綠': '#22c55e', '白': '#ffffff', '灰': '#9ca3af',
                '黑': '#9ca3af', // 深色背景中，黑色文字難以閱讀，使用顯眼灰色代替
                '紫': '#a855f7', '橘': '#f97316', '粉': '#ec4899', 
                '青': '#14b8a6', '棕': '#b45309', '金': '#fbbf24', 
                '銀': '#d1d5db', '透明': '#e5e7eb'
            };

            // 尋找是否包含字典內的關鍵字
            for (let key in colorMap) {
                if (text.includes(key)) {
                    return colorMap[key];
                }
            }
            return null;
        }

        /**
         * 狀態顏色類別引擎：依據儲存格文字內容決定背景顏色
         * 規則優先級：
         * 1. 包含「完成-先挪庫存料」 -> 橙色 (必須優先比對，因包含「完成」二字)
         * 2. 包含「排版」、「倉庫」、「採購」、「完成」 -> 紅色
         * 3. 包含「作業中」 -> 紫羅蘭色
         * @param {string} cellText 儲存格文字
         * @returns {string} Tailwind 類別名稱字串
         */
        function getStatusColorClass(cellText) {
            if (!cellText) return "";
            const text = cellText.trim();
            
            // 優先攔截複合詞彙
            if (text.includes("完成-先挪庫存料")) {
                return "status-orange";
            }
            
            // 檢查是否包含紅色相關狀態關鍵字
            const redKeywords = ["排版", "倉庫", "採購", "完成"];
            for (let word of redKeywords) {
                if (text.includes(word)) {
                    return "status-red";
                }
            }

            // 檢查紫色相關狀態關鍵字
            if (text.includes("作業中")) {
                return "status-violet";
            }

            return "";
        }

        /**
         * 核心函數：非同步取得 Google Sheets 資料並渲染 HTML 表格
         */
        async function fetchAndRenderMasterSheet() {
            const thead = document.getElementById('master-thead');
            const tbody = document.getElementById('master-tbody');
            const timeLabel = document.getElementById('last-update-time');
            
            // 載入狀態 UI
            tbody.innerHTML = `<tr><td class="text-center text-orange-400 py-10"><i class="fa-solid fa-spinner fa-spin fa-2x mb-3"></i><br>正在同步雲端資料...</td></tr>`;

            try {
                // 發送請求以獲取 Visualization 格式的 JSON 數據
                const response = await fetch(MASTER_DATA_URL);
                const rawText = await response.text();
                
                // 去除 Google Visualization API 外層封裝，提取純 JSON 字串
                // 原始格式為: /*O_o*/ google.visualization.Query.setResponse({ ... });
                const jsonString = rawText.substring(47).slice(0, -2);
                const data = JSON.parse(jsonString);

                const cols = data.table.cols;
                const rows = data.table.rows;

                // 判斷哪個欄位是「顏色」欄位 (用來做字體顏色變換)
                let colorColumnIndices = [];

                // 1. 動態建立表頭
                let theadHTML = `<tr class="bg-gray-800 border-b-2 border-gray-600">`;
                cols.forEach((col, index) => {
                    const label = col.label ? col.label : `欄位 ${index + 1}`;
                    // 記錄標題中含有「顏色」或「烤漆」的欄位索引
                    if (label.includes("顏色") || label.includes("烤漆")) {
                        colorColumnIndices.push(index);
                    }
                    theadHTML += `<th class="py-3 px-4 font-bold text-gray-200">${label}</th>`;
                });
                theadHTML += `</tr>`;
                thead.innerHTML = theadHTML;

                // 2. 動態建立表身
                let tbodyHTML = ``;
                if (!rows || rows.length === 0) {
                    tbodyHTML = `<tr><td colspan="${cols.length}" class="text-center py-6 text-gray-400">目前沒有排程資料</td></tr>`;
                } else {
                    rows.forEach((row, rowIndex) => {
                        let trHTML = `<tr class="hover:bg-gray-700 transition-colors border-b border-gray-700">`;
                        const cells = row.c;
                        
                        cells.forEach((cell, colIndex) => {
                            // 取得儲存格顯示文字
                            let cellValue = (cell && cell.v !== null && cell.v !== undefined) ? cell.v : "";
                            // 格式化：若為數字或其他類型，轉為字串
                            let cellText = String(cellValue).trim();

                            // 計算需要套用的樣式 (狀態背景與文字顏色)
                            let cellClass = "py-2 px-4";
                            let cellStyle = "";

                            // 處理狀態背景色填滿邏輯
                            const statusClass = getStatusColorClass(cellText);
                            if (statusClass) {
                                cellClass += ` ${statusClass}`;
                            }

                            // 處理烤漆顏色字體變色邏輯 (僅套用於特定欄位，且該單元格無背景色時為佳，避免干擾)
                            if (colorColumnIndices.includes(colIndex) && !statusClass) {
                                const hexColor = mapColorNameToHex(cellText);
                                if (hexColor) {
                                    cellStyle = `color: ${hexColor}; font-weight: 800; text-shadow: 0px 1px 2px rgba(0,0,0,0.8);`;
                                }
                            }

                            trHTML += `<td class="${cellClass}" style="${cellStyle}">${cellText}</td>`;
                        });
                        trHTML += `</tr>`;
                        tbodyHTML += trHTML;
                    });
                }
                tbody.innerHTML = tbodyHTML;

                // 3. 更新最後更新時間標籤
                const now = new Date();
                timeLabel.innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

                // 資料載入成功，重置倒數計時器
                resetMasterTimer();

            } catch (error) {
                console.error("讀取 Google Sheet 失敗:", error);
                tbody.innerHTML = `<tr><td colspan="10" class="text-center text-red-500 py-6 font-bold"><i class="fa-solid fa-triangle-exclamation mr-2"></i>資料讀取失敗，請檢查網路連線或檔案權限。</td></tr>`;
            }
        }

        /**
         * 總排程看板更新計時器機制 (每 10 分鐘 600 秒)
         */
        function startMasterTimer() {
            const timerDisplay = document.getElementById('next-update-timer');
            
            // 若已有計時器在跑，先清除
            if (masterTimerInterval) {
                clearInterval(masterTimerInterval);
            }
            
            masterTimerInterval = setInterval(() => {
                masterCountdown--;
                
                // 格式化顯示 MM:SS
                const m = Math.floor(masterCountdown / 60);
                const s = masterCountdown % 60;
                timerDisplay.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                
                // 顏色提醒機制 (最後 30 秒變紅色)
                if (masterCountdown <= 30) {
                    timerDisplay.className = "text-red-500 font-mono font-bold animate-pulse";
                } else {
                    timerDisplay.className = "text-orange-400 font-mono font-bold";
                }

                // 倒數歸零，觸發資料更新
                if (masterCountdown <= 0) {
                    fetchAndRenderMasterSheet();
                }
            }, 1000);
        }

        /**
         * 重置計時器回 10 分鐘狀態
         */
        function resetMasterTimer() {
            masterCountdown = 600;
            const timerDisplay = document.getElementById('next-update-timer');
            timerDisplay.innerText = "10:00";
            timerDisplay.className = "text-orange-400 font-mono font-bold";
            startMasterTimer();
        }

        // 手動點擊立即更新按鈕事件
        document.getElementById('btn-refresh-master').addEventListener('click', () => {
            fetchAndRenderMasterSheet();
        });

        // 頁面載入完成後初始化所有功能
        document.addEventListener('DOMContentLoaded', () => {
            // 原 Firebase 相關初始化
            applyLanguage();
            listenActiveSchedule();
            
            // 新增 Google 總排程看板初始化
            fetchAndRenderMasterSheet();
        });

    </script>
</body>
</html>
