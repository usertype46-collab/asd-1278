<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烤漆作業排程 - 建立紀錄</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #1e1e1e; color: #e5e5e5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #252526; border: 1px solid #3c3c3c; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        table { width: 100%; border-collapse: collapse; table-layout: auto; }
        th, td { border: 1px solid #444; padding: 0.85rem; vertical-align: middle; }
        th { background-color: #2d2d2d; color: #fff; white-space: nowrap; font-weight: 600; text-align: left; }
        
        .w-seq { width: 60px; text-align: center; }
        .w-color { width: 220px; }
        .w-model { width: 220px; }
        .w-action { width: 80px; text-align: center; }

        input, select { background-color: #1e1e1e; color: #fff; border: 1px solid #555; border-radius: 0.375rem; padding: 0.6rem; width: 100%; outline: none; font-size: 1rem; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
        
        button { cursor: pointer; transition: all 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #debug-console { height: 140px; overflow-y: auto; background-color: #0d0d0d; color: #0f0; font-family: 'Courier New', Courier, monospace; font-size: 13px; padding: 12px; border: 1px solid #444; border-radius: 0 0 0.5rem 0.5rem; }
        .log-error { color: #ff6b6b; }
        .log-success { color: #51cf66; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-base">

    <!-- 頂部導覽列 -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b border-gray-700 gap-4">
        <h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-2" data-i18n="appTitle">📝 建立烤漆排程紀錄</h1>
        <div class="flex items-center gap-3 flex-wrap">
            <a href="烤漆順序看板.html" class="bg-gray-700 hover:bg-gray-600 text-blue-300 px-4 py-2 rounded-md flex items-center gap-2 font-medium shadow">
                <i class="fa-solid fa-tv"></i> 切換至順序看板
            </a>
            <div class="flex items-center gap-2 ml-2">
                <span class="text-sm text-gray-400" data-i18n="langLabel">語言 / Ngôn ngữ:</span>
                <select id="lang-switch" class="w-auto cursor-pointer py-1 px-2 text-sm">
                    <option value="zh">繁體中文</option>
                    <option value="vi">Tiếng Việt</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Datalist 用於下拉與手動輸入混合 -->
    <datalist id="color-list"></datalist>
    <datalist id="model-list"></datalist>

    <div class="grid grid-cols-1 gap-6">

        <!-- 建立次日排程作業 (編輯區塊) -->
        <div class="card border-l-4 border-l-orange-500">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-4">
                <h2 class="text-xl font-bold text-orange-400 flex items-center">
                    <i class="fa-solid fa-calendar-plus mr-2"></i><span data-i18n="nextTitle">建立次日烤漆排程</span>
                    <span id="next-date-display" class="ml-3 text-white bg-gray-700 px-3 py-1 rounded text-base"></span>
                </h2>
                <div class="flex gap-2">
                    <button id="btn-add-row" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md font-bold shadow-lg flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> <span data-i18n="btnAdd">新增下一筆</span>
                    </button>
                    <button id="btn-save" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-bold shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> <span data-i18n="btnSave">儲存至雲端</span>
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr>
                            <th class="w-seq" data-i18n="thNo">序號</th>
                            <th class="w-color" data-i18n="thColor">顏色</th>
                            <th class="w-model" data-i18n="thModel">機型</th>
                            <th data-i18n="thRemark">備註欄 (按 + 號可新增多條備註)</th>
                            <th class="w-action" data-i18n="thAction">操作</th>
                        </tr>
                    </thead>
                    <tbody id="next-tbody">
                        <!-- 動態新增列 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 系統狀態日誌 -->
        <div class="card p-0 overflow-hidden border-gray-600">
            <div class="bg-gray-800 px-4 py-3 border-b border-gray-700 flex justify-between items-center">
                <span class="font-bold text-gray-300 flex items-center gap-2"><i class="fa-solid fa-terminal"></i>系統訊息日誌 (Console)</span>
                <button onclick="document.getElementById('debug-console').innerHTML=''" class="text-sm text-gray-400 hover:text-white transition-colors">清除 (Clear)</button>
            </div>
            <div id="debug-console"></div>
        </div>

    </div>

    <!-- Firebase 腳本與邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvx7Ej2h9ZV5S1t_Gag756qop_jcoxy2U",
            authDomain: "shopee-60a13.firebaseapp.com",
            databaseURL: "https://shopee-60a13-default-rtdb.firebaseio.com",
            projectId: "shopee-60a13",
            storageBucket: "shopee-60a13.firebasestorage.app",
            messagingSenderId: "18436404849",
            appId: "1:18436404849:web:f2bdfa4189ff15456fcdd0"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const defaultColors = ["WE","YW","GYW","YWH","BKEBK","BKH","BKS","BKS1","BKS5","BKSA","BKSA1","OE","GN","FGN","PELBE","BEG","DBE","IG","IGS","DGS","ATG","GAST","PK","RD","SAT2"];
        let dbColors = [...defaultColors];
        let dbModels = [];
        let currentLang = 'zh';

        const holidays = new Set([
            "2026-01-01", "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19", "2026-02-20", 
            "2026-02-28", "2026-04-03", "2026-04-06", "2026-05-01", "2026-06-19", "2026-09-25", "2026-10-09"
        ]);

        const i18n = {
            zh: {
                appTitle: "📝 建立烤漆排程紀錄", langLabel: "語言 / Ngôn ngữ:", nextTitle: "建立次日烤漆排程", 
                btnAdd: "新增下一筆", btnSave: "儲存至雲端", thNo: "序號", thColor: "顏色", thModel: "機型", 
                thRemark: "備註欄 (按 + 號新增多條備註)", thAction: "操作", phColor: "選擇或輸入顏色", 
                phModel: "選擇或輸入機型", phRemark: "輸入備註...", promptConfirmDel: "確定要刪除此筆記錄嗎？", 
                sysReady: "系統初始化完成。", sysSaveOk: "儲存成功！", sysSaveErr: "儲存失敗："
            },
            vi: {
                appTitle: "📝 Tạo Lịch trình Sơn", langLabel: "Ngôn ngữ / 語言:", nextTitle: "Lịch trình sơn ngày mai", 
                btnAdd: "Thêm dòng mới", btnSave: "Lưu lên Cloud", thNo: "STT", thColor: "Màu sắc", thModel: "Model", 
                thRemark: "Ghi chú (Bấm + để thêm dòng)", thAction: "Thao tác", phColor: "Chọn/Nhập màu", 
                phModel: "Chọn/Nhập model", phRemark: "Nhập ghi chú...", promptConfirmDel: "Bạn có chắc chắn muốn xóa bản ghi này không?", 
                sysReady: "Khởi tạo hệ thống thành công.", sysSaveOk: "Lưu thành công!", sysSaveErr: "Lưu thất bại: "
            }
        };

        const weekdays = {
            zh: ["日", "一", "二", "三", "四", "五", "六"],
            vi: ["CN", "T2", "T3", "T4", "T5", "T6", "T7"]
        };

        window.logMsg = function(msg, type = 'info') {
            const consoleBox = document.getElementById('debug-console');
            const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
            let style = type === 'error' ? 'log-error' : (type === 'success' ? 'log-success' : 'text-gray-300');
            consoleBox.innerHTML += `<div class="${style}">[${time}] ${msg}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function getDBDateFormat(dateObj) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        }

        function getNextWorkingDate() {
            let nextDate = new Date();
            while (true) {
                nextDate.setDate(nextDate.getDate() + 1);
                let day = nextDate.getDay();
                let isoStr = getDBDateFormat(nextDate);
                if (day !== 0 && day !== 6 && !holidays.has(isoStr)) break;
            }
            const nextDB = getDBDateFormat(nextDate);
            const nextDisplay = `${nextDate.getMonth() + 1}/${nextDate.getDate()} (${currentLang === 'vi' ? 'Thứ ' : '週'}${weekdays[currentLang][nextDate.getDay()]})`;
            return { nextDB, nextDisplay };
        }

        function applyLanguage() {
            const t = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = t[el.getAttribute('data-i18n')]; });
            const dates = getNextWorkingDate();
            document.getElementById('next-date-display').innerText = dates.nextDisplay;
            updateDatalists();
            renderNextTable();
        }

        document.getElementById('lang-switch').addEventListener('change', (e) => {
            currentLang = e.target.value;
            applyLanguage();
        });

        function updateDatalists() {
            document.getElementById('color-list').innerHTML = dbColors.map(c => `<option value="${c}">`).join('');
            document.getElementById('model-list').innerHTML = dbModels.map(m => `<option value="${m}">`).join('');
        }

        onValue(ref(db, 'settings/colors'), (snapshot) => {
            if (snapshot.exists()) dbColors = snapshot.val();
            updateDatalists();
        });
        onValue(ref(db, 'settings/models'), (snapshot) => {
            if (snapshot.exists()) dbModels = snapshot.val();
            updateDatalists();
        });

        let nextDayData = [];

        window.addNextRow = function(data = null) {
            nextDayData.push(data ? data : { color: '', model: '', remarks: [''] });
            renderNextTable();
        }

        window.removeNextRow = function(index) {
            if (confirm(i18n[currentLang].promptConfirmDel)) {
                nextDayData.splice(index, 1);
                renderNextTable();
            }
        }

        window.addRemark = function(rowIndex) {
            nextDayData[rowIndex].remarks.push('');
            renderNextTable();
        }
        window.removeRemark = function(rowIndex, rmkIndex) {
            nextDayData[rowIndex].remarks.splice(rmkIndex, 1);
            renderNextTable();
        }
        window.updateData = function(rowIndex, field, val, rmkIndex = -1) {
            if (rmkIndex === -1) nextDayData[rowIndex][field] = val.toUpperCase();
            else nextDayData[rowIndex].remarks[rmkIndex] = val;
        }

        function renderNextTable() {
            const tbody = document.getElementById('next-tbody');
            tbody.innerHTML = '';
            const t = i18n[currentLang];

            if(nextDayData.length === 0) nextDayData.push({ color: '', model: '', remarks: [''] });

            nextDayData.forEach((item, idx) => {
                const tr = document.createElement('tr');
                let remarksHtml = '';
                item.remarks.forEach((rmk, rIdx) => {
                    remarksHtml += `
                        <div class="flex gap-2 mb-2 items-center">
                            <input type="text" value="${rmk}" oninput="updateData(${idx}, 'remarks', this.value, ${rIdx})" placeholder="${t.phRemark}" class="flex-grow">
                            ${rIdx === 0 
                                ? `<button onclick="addRemark(${idx})" class="bg-green-600 text-white w-8 h-8 rounded-md hover:bg-green-700 shadow flex items-center justify-center text-lg" title="新增備註"><i class="fa-solid fa-plus"></i></button>`
                                : `<button onclick="removeRemark(${idx}, ${rIdx})" class="bg-red-600 text-white w-8 h-8 rounded-md hover:bg-red-700 shadow flex items-center justify-center text-lg" title="刪除備註"><i class="fa-solid fa-minus"></i></button>`
                            }
                        </div>
                    `;
                });

                tr.innerHTML = `
                    <td class="text-center font-bold text-lg align-middle">${idx + 1}</td>
                    <td><input list="color-list" value="${item.color}" oninput="updateData(${idx}, 'color', this.value)" placeholder="${t.phColor}"></td>
                    <td><input list="model-list" value="${item.model}" oninput="updateData(${idx}, 'model', this.value)" placeholder="${t.phModel}"></td>
                    <td class="align-top pt-3">${remarksHtml}</td>
                    <td class="text-center align-middle">
                        <button onclick="removeNextRow(${idx})" class="text-red-400 hover:text-red-300 p-2 text-xl transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('btn-add-row').addEventListener('click', () => addNextRow());

        document.getElementById('btn-save').addEventListener('click', async () => {
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;
            
            const { nextDB } = getNextWorkingDate();
            let validTasks = [];
            let newColors = new Set();
            let newModels = new Set();

            nextDayData.forEach((item, idx) => {
                let cleanColor = item.color.trim().toUpperCase();
                let cleanModel = item.model.trim().toUpperCase();
                let cleanRemarks = item.remarks.map(r => r.trim()).filter(r => r !== '');

                if (cleanColor || cleanModel || cleanRemarks.length > 0) {
                    validTasks.push({ seqNo: idx + 1, color: cleanColor, model: cleanModel, remarks: cleanRemarks });
                    if (cleanColor && !dbColors.includes(cleanColor)) newColors.add(cleanColor);
                    if (cleanModel && !dbModels.includes(cleanModel)) newModels.add(cleanModel);
                }
            });

            try {
                await set(ref(db, `schedules/${nextDB}`), validTasks);
                if (newColors.size > 0 || newModels.size > 0) {
                    const updates = {};
                    if (newColors.size > 0) updates['settings/colors'] = [...new Set([...dbColors, ...newColors])];
                    if (newModels.size > 0) updates['settings/models'] = [...new Set([...dbModels, ...newModels])];
                    await update(ref(db), updates);
                }
                logMsg(`${i18n[currentLang].sysSaveOk} (日期: ${nextDB})`, 'success');
                alert(i18n[currentLang].sysSaveOk);
            } catch (err) {
                logMsg(`${i18n[currentLang].sysSaveErr} ${err.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span data-i18n="btnSave">${i18n[currentLang].btnSave}</span>`;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            applyLanguage();
            const { nextDB } = getNextWorkingDate();
            get(ref(db, `schedules/${nextDB}`)).then((snapshot) => {
                nextDayData = [];
                if (snapshot.exists() && snapshot.val().length > 0) {
                    snapshot.val().forEach(item => {
                        nextDayData.push({ color: item.color||'', model: item.model||'', remarks: item.remarks && item.remarks.length > 0 ? item.remarks : [''] });
                    });
                } else {
                    addNextRow();
                }
                renderNextTable();
            });
            logMsg(i18n[currentLang].sysReady, 'success');
        });
    </script>
</body>
</html>
