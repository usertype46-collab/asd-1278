<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>御足靈採 - 智能需求匹配與技師預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        .therapist-off { filter: grayscale(100%); opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 font-sans" x-data="footApp()">

    <header class="bg-indigo-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i data-lucide="sparkles" class="w-6 h-6 text-amber-400"></i>
            <h1 class="text-lg font-bold">御足靈採 - 智能匹配系統</h1>
        </div>
        <span class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full border border-indigo-700 text-indigo-200">商用專業版 v2.9</span>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- 營運統計 -->
        <section x-show="activeTab === 'stats'" class="space-y-4" x-cloak>
            <h2 class="text-lg font-bold flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-5 h-5 text-indigo-600"></i> 營運與客戶分析數據</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-xs text-slate-500">本月造訪人次</p>
                    <p class="text-2xl font-black text-indigo-600 mt-1" x-text="stats.totalVisits"></p>
                    <span class="text-[10px] text-emerald-600 font-medium">即時統計</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-xs text-slate-500">高頻熟客率 (≥3次)</p>
                    <p class="text-2xl font-black text-emerald-600 mt-1" x-text="stats.vipRate + '%'"></p>
                    <span class="text-[10px] text-slate-400" x-text="'總客戶 ' + clients.length + ' 人'"></span>
                </div>
            </div>
        </section>

        <!-- 需求配對與預約 -->
        <section x-show="activeTab === 'match'" class="space-y-4" x-cloak>
            <h2 class="text-lg font-bold flex items-center gap-2"><i data-lucide="zap" class="w-5 h-5 text-indigo-600"></i> 客戶需求匹配技師</h2>
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-4">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-600">選擇既有客戶或預約新客</label>
                        <button @click="openClientModal()" class="text-xs text-indigo-600 font-bold hover:underline">+ 快速建立新客</button>
                    </div>
                    <select x-model="matchForm.clientId" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- 現場新客 / 快速選擇 --</option>
                        <template x-for="client in clients" :key="client.id">
                            <option :value="client.id" x-text="client.name + ' (' + client.phone + ')'"></option>
                        </template>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">力道需求偏好</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button @click="matchForm.pressure = 'light'" :class="matchForm.pressure === 'light' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'" class="py-2 text-xs rounded-lg font-medium transition">輕柔舒壓</button>
                        <button @click="matchForm.pressure = 'medium'" :class="matchForm.pressure === 'medium' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'" class="py-2 text-xs rounded-lg font-medium transition">適中標準</button>
                        <button @click="matchForm.pressure = 'heavy'" :class="matchForm.pressure === 'heavy' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'" class="py-2 text-xs rounded-lg font-medium transition">深層重力</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">指定特定技能需求 (可多選)</label>
                    <div class="flex flex-wrap gap-1.5 mb-2">
                        <template x-for="skill in allSkills" :key="skill">
                            <button @click="toggleMatchSkill(skill)" 
                                    :class="matchForm.selectedSkills.includes(skill) ? 'bg-indigo-100 text-indigo-700 border-indigo-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                                    class="text-xs px-2.5 py-1 rounded-full border transition flex items-center gap-1">
                                <span x-text="skill"></span>
                                <span x-show="matchForm.selectedSkills.includes(skill)">✓</span>
                            </button>
                        </template>
                    </div>
                </div>

                <button @click="runMatching()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                    <i data-lucide="sliders-horizontal" class="w-4 h-4"></i> 開始智能匹配技師
                </button>
            </div>

            <!-- 匹配結果 -->
            <div x-show="matchedTherapists.length > 0" class="space-y-3" x-cloak>
                <h3 class="text-sm font-bold text-slate-700">🎯 最佳匹配技師推薦</h3>
                <template x-for="therapist in matchedTherapists" :key="therapist.id">
                    <div :class="therapist.status === 'off' ? 'therapist-off bg-slate-100' : 'bg-white'" class="p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center relative">
                        <div class="w-3/4">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800" x-text="therapist.name + ' (' + therapist.code + ')'"></span>
                                <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 font-semibold" x-text="'匹配度 ' + therapist.matchScore + '%'"></span>
                            </div>
                            <div class="flex flex-wrap gap-1 mt-1.5">
                                <template x-for="s in therapist.skills" :key="s">
                                    <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded" x-text="s"></span>
                                </template>
                            </div>
                        </div>
                        
                        <!-- 動態按鈕 -->
                        <template x-if="therapist.status === 'active'">
                            <button @click="openBookingModal(therapist)" class="bg-slate-900 text-white text-xs px-3 py-2 rounded-lg font-medium hover:bg-slate-800 transition shadow">立即預約</button>
                        </template>
                        <template x-if="therapist.status === 'busy'">
                            <span class="text-xs text-amber-600 font-bold border border-amber-200 bg-amber-50 px-2 py-1 rounded shadow-sm">服務中</span>
                        </template>
                        <template x-if="therapist.status === 'off'">
                            <span class="text-xs text-rose-500 font-bold border border-rose-200 bg-rose-50 px-2 py-1 rounded shadow-sm">今日休假</span>
                        </template>
                    </div>
                </template>
            </div>
        </section>

        <!-- 技師班表與狀態管理 -->
        <section x-show="activeTab === 'therapists'" class="space-y-4" x-cloak>
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-indigo-600"></i> 技師班表與狀態</h2>
                <button @click="openTherapistModal()" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1 shadow">
                    <i data-lucide="plus" class="w-4 h-4"></i> 新增技師
                </button>
            </div>

            <div class="space-y-3">
                <template x-for="therapist in therapists" :key="therapist.id">
                    <div :class="therapist.status === 'off' ? 'bg-slate-100 border-slate-200 grayscale opacity-70' : 'bg-white border-slate-100 shadow-sm'" class="p-4 rounded-xl border space-y-3 relative transition-all">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-slate-800 text-lg" x-text="therapist.name + ' (' + therapist.code + ')'"></h3>
                                <p class="text-xs text-slate-400" x-text="'聯絡電話: ' + therapist.phone"></p>
                            </div>
                            
                            <!-- 狀態下拉選單連動班表及資料庫同步 -->
                            <div class="flex flex-col items-end gap-1">
                                <span class="text-[10px] text-slate-400 font-semibold">今日班表狀態</span>
                                <select x-model="therapist.status" @change="handleStatusChange(therapist)" class="text-xs font-bold px-2 py-1.5 rounded-lg border outline-none shadow-sm cursor-pointer"
                                    :class="{
                                        'bg-emerald-50 text-emerald-700 border-emerald-200': therapist.status === 'active',
                                        'bg-amber-50 text-amber-700 border-amber-200': therapist.status === 'busy',
                                        'bg-slate-200 text-slate-600 border-slate-300': therapist.status === 'off'
                                    }">
                                    <option value="active">🟢 可排班 (空閒)</option>
                                    <option value="busy">🟡 服務中 (忙碌)</option>
                                    <option value="off">⚫ 休假中 (停班)</option>
                                </select>
                            </div>
                        </div>

                        <!-- 倒數計時區塊 -->
                        <div x-show="therapist.status === 'busy' && therapist.serviceEndTime" class="bg-amber-50 p-3 rounded-lg flex justify-between items-center border border-amber-200 shadow-inner">
                            <span class="text-sm text-amber-700 font-bold flex items-center gap-1"><i data-lucide="clock" class="w-4 h-4 animate-pulse"></i> 服務剩餘時間</span>
                            <div class="flex items-center gap-3">
                                <span class="text-lg font-black text-amber-600 font-mono tracking-wider" x-text="formatTimeLeft(therapist.timeLeft)"></span>
                                <button @click="cancelService(therapist)" class="text-[11px] bg-rose-100 text-rose-600 px-2 py-1 rounded-md font-bold hover:bg-rose-200 transition border border-rose-200 shadow-sm">結束/取消</button>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-1.5">
                            <template x-for="skill in therapist.skills" :key="skill">
                                <span class="text-[11px] font-medium bg-indigo-50 text-indigo-700 px-2 py-1 rounded-md border border-indigo-100" x-text="skill"></span>
                            </template>
                        </div>
                        
                        <div class="pt-3 border-t border-slate-200 flex justify-end gap-3 text-sm">
                            <button @click="editTherapist(therapist)" class="text-indigo-600 font-bold px-2 py-1 flex items-center gap-1 hover:text-indigo-800"><i data-lucide="edit" class="w-3 h-3"></i> 編輯</button>
                            <button @click="deleteTherapist(therapist.id)" class="text-rose-500 font-bold px-2 py-1 flex items-center gap-1 hover:text-rose-700"><i data-lucide="trash-2" class="w-3 h-3"></i> 永久刪除</button>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- 客戶 CRM -->
        <section x-show="activeTab === 'clients'" class="space-y-4" x-cloak>
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold flex items-center gap-2"><i data-lucide="contact-2" class="w-5 h-5 text-indigo-600"></i> 客戶檔案庫</h2>
                <button @click="openClientModal()" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1 shadow">
                    <i data-lucide="plus" class="w-4 h-4"></i> 新增客戶
                </button>
            </div>

            <div class="space-y-3">
                <template x-for="client in clients" :key="client.id">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-2">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-slate-800" x-text="client.name"></h3>
                                <p class="text-xs text-slate-400" x-text="client.phone"></p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100" x-text="'造訪 ' + client.total_visits + ' 次'"></span>
                            </div>
                        </div>
                    </div>
                </template>
                <div x-show="clients.length === 0" class="text-center py-6 text-slate-400 text-sm">
                    目前尚無客戶資料，請點擊上方按鈕新增。
                </div>
            </div>
        </section>
    </main>

    <!-- 底部導覽 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-between items-center max-w-md mx-auto z-30">
        <button @click="activeTab = 'match'" :class="activeTab === 'match' ? 'text-indigo-600' : 'text-slate-400'" class="flex flex-col items-center gap-0.5">
            <i data-lucide="zap" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">需求匹配</span>
        </button>
        <button @click="activeTab = 'therapists'" :class="activeTab === 'therapists' ? 'text-indigo-600' : 'text-slate-400'" class="flex flex-col items-center gap-0.5">
            <i data-lucide="users" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">排班與技師</span>
        </button>
        <button @click="activeTab = 'clients'" :class="activeTab === 'clients' ? 'text-indigo-600' : 'text-slate-400'" class="flex flex-col items-center gap-0.5">
            <i data-lucide="contact-2" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">客戶 CRM</span>
        </button>
        <button @click="activeTab = 'stats'" :class="activeTab === 'stats' ? 'text-indigo-600' : 'text-slate-400'" class="flex flex-col items-center gap-0.5">
            <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">營運統計</span>
        </button>
    </nav>

    <!-- 預約確認 Modal -->
    <div x-show="showBookingModal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" x-cloak>
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-slate-800 border-b pb-2">📅 確認預約服務</h3>
            <div class="space-y-3">
                <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-indigo-500 font-semibold">指派技師</p>
                        <p class="font-bold text-indigo-900 text-sm mt-0.5" x-text="bookingForm.therapistName"></p>
                    </div>
                    <i data-lucide="check-circle-2" class="w-6 h-6 text-indigo-600"></i>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">服務客戶姓名</label>
                    <input type="text" x-model="bookingForm.clientName" class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">服務項目 (系統自動計算時間)</label>
                    <select x-model="bookingForm.serviceItem" class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="60">60分鐘 - 足底按摩</option>
                        <option value="90">90分鐘 - 全身指壓</option>
                        <option value="120">120分鐘 - 全身+足底套餐</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-3">
                <button @click="showBookingModal = false" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-bold w-1/3">取消</button>
                <button @click="confirmBooking()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold w-2/3 shadow-md hover:bg-indigo-700">確認預約並計時</button>
            </div>
        </div>
    </div>

    <!-- 技師 Modal -->
    <div x-show="showTherapistModal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" x-cloak>
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-slate-800 border-b pb-2" x-text="editingTherapist.id ? '編輯技師資訊' : '新增技師資料'"></h3>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-slate-600">技師編號 (留空則系統自動遞增生成)</label>
                    <input type="text" x-model="editingTherapist.code" placeholder="留白或輸入 T001 / VIP-99" class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none placeholder:text-slate-300">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">技師姓名 *</label>
                    <input type="text" x-model="editingTherapist.name" placeholder="例如：陳技師" class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">連絡電話</label>
                    <input type="text" x-model="editingTherapist.phone" placeholder="09xxxxxxxx" class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                
                <div x-data="{ customSkill: '' }">
                    <label class="text-xs font-semibold text-slate-600">擅長技能標籤 (可手動添加)</label>
                    <div class="flex gap-2 mb-2 mt-1">
                        <input type="text" x-model="customSkill" placeholder="輸入自訂技能如: 精油刮痧" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500">
                        <button @click="if(customSkill) { if(!allSkills.includes(customSkill)) allSkills.push(customSkill); if(!editingTherapist.skills.includes(customSkill)) editingTherapist.skills.push(customSkill); customSkill=''; }" type="button" class="bg-indigo-100 text-indigo-700 px-4 rounded-lg text-sm font-bold whitespace-nowrap hover:bg-indigo-200">添加</button>
                    </div>

                    <div class="max-h-32 overflow-y-auto border border-slate-200 rounded-lg p-2 space-y-1 bg-slate-50">
                        <template x-for="skill in allSkills" :key="skill">
                            <label class="flex items-center space-x-2 text-sm p-1.5 hover:bg-white rounded cursor-pointer transition">
                                <input type="checkbox" :value="skill" x-model="editingTherapist.skills" class="rounded text-indigo-600 w-4 h-4">
                                <span x-text="skill" class="font-medium text-slate-700"></span>
                            </label>
                        </template>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-3">
                <button @click="showTherapistModal = false" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-bold w-1/3">取消</button>
                <button @click="saveTherapist()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold w-2/3 shadow-md hover:bg-indigo-700">儲存並同步至資料庫</button>
            </div>
        </div>
    </div>

    <!-- 新增/編輯客戶 Modal -->
    <div x-show="showClientModal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" x-cloak>
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-slate-800">快速新增客戶</h3>
            <input type="text" x-model="editingClient.name" placeholder="客戶姓名" class="w-full border rounded-lg p-2.5 text-sm mt-1 outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="text" x-model="editingClient.phone" placeholder="連絡電話" class="w-full border rounded-lg p-2.5 text-sm mt-1 outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex justify-end gap-3 pt-3">
                <button @click="showClientModal = false" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-bold w-1/3">取消</button>
                <button @click="saveClient()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold w-2/3">儲存</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('footApp', () => ({
                activeTab: 'therapists',
                showTherapistModal: false,
                showClientModal: false,
                showBookingModal: false,

                allSkills: ['足底反射區', '深層經絡', '肩頸舒壓', '重力道', '輕柔放鬆', '孕婦按摩'],
                stats: { totalVisits: 0, vipRate: 0 },
                
                // 改為動態儲存，防重整還原
                clients: [],
                therapists: [],

                matchForm: { clientId: '', pressure: 'medium', selectedSkills: [] },
                matchedTherapists: [],
                editingTherapist: { id: null, code: '', name: '', phone: '', skills: [] },
                editingClient: { id: null, name: '', phone: '' },
                bookingForm: { therapistId: null, therapistName: '', clientName: '', clientPhone: '', serviceItem: '60' },

                async init() {
                    lucide.createIcons();
                    this.loadLocalData(); // 載入本地存儲的客戶資料
                    await this.loadTherapists(); // 系統載入即同步資料庫

                    // 1. 每秒更新倒數計時與提前提醒邏輯
                    setInterval(() => {
                        const now = new Date().getTime();
                        this.therapists.forEach(t => {
                            if (t.status === 'busy' && t.serviceEndTime) {
                                const diff = t.serviceEndTime - now;
                                if (diff > 0) {
                                    t.timeLeft = diff;
                                    const minsLeft = Math.floor(diff / 60000);
                                    const secsLeft = Math.floor((diff % 60000) / 1000);
                                    
                                    if (minsLeft === 10 && secsLeft === 59 && !t.reminded) {
                                        setTimeout(() => {
                                            alert(`🔔【系統加時詢問提醒】\n\n${t.name} 的服務將於 10 分鐘後結束。\n請前往詢問客戶是否需要加時間！`);
                                        }, 100);
                                        t.reminded = true;
                                    }
                                } else {
                                    t.status = 'active';
                                    t.serviceEndTime = null;
                                    t.timeLeft = 0;
                                    t.reminded = false;
                                    this.syncTherapist(t);
                                }
                            }
                        });
                    }, 1000);

                    // 2. 每 10 秒自動無感向資料庫輪詢，確保多裝置即時同步不掉線
                    setInterval(async () => {
                        await this.loadTherapists(true);
                    }, 10000);
                },

                // 本地持久化資料 (修復重整還原問題)
                loadLocalData() {
                    const localClients = localStorage.getItem('massage_clients');
                    const localStats = localStorage.getItem('massage_stats');
                    if (localClients) {
                        this.clients = JSON.parse(localClients);
                    } else {
                        // 初始預設範例
                        this.clients = [{ id: 1, name: '林先生', phone: '0911222333', prefer_pressure: 'heavy', total_visits: 6 }];
                        this.saveLocalData();
                    }
                    if (localStats) {
                        this.stats = JSON.parse(localStats);
                    } else {
                        this.stats = { totalVisits: 184, vipRate: 38 };
                        this.saveLocalData();
                    }
                },

                saveLocalData() {
                    localStorage.setItem('massage_clients', JSON.stringify(this.clients));
                    localStorage.setItem('massage_stats', JSON.stringify(this.stats));
                },

                // 向 API 拉取技師資料 (isSilent 用於背景輪詢不覆蓋本地計時狀態)
                async loadTherapists(isSilent = false) {
                    try {
                        const res = await fetch('/api/therapists');
                        if (!res.ok) throw new Error('API 尚未連線或未建表');
                        const data = await res.json();
                        
                        this.therapists = data.map(newT => {
                            const existingT = this.therapists.find(t => t.id === newT.id);
                            // 若是背景更新，保留當前本地的提醒狀態避免重複觸發
                            return {
                                ...newT,
                                serviceEndTime: newT.service_end_time ? parseInt(newT.service_end_time) : null,
                                timeLeft: existingT ? existingT.timeLeft : 0,
                                reminded: existingT ? existingT.reminded : false
                            };
                        });
                        
                        // 重新計算匹配結果(如果目前停留在匹配畫面)
                        if(this.activeTab === 'match' && this.matchedTherapists.length > 0){
                            this.runMatching();
                        }
                    } catch(e) {
                        if (!isSilent) console.error('載入技師失敗：請確認 Cloudflare D1 資料庫是否已綁定並建立 Table。', e);
                    }
                },

                // 單一技師狀態同步到資料庫
                async syncTherapist(therapist) {
                    try {
                        await fetch('/api/therapists', {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                ...therapist,
                                serviceEndTime: therapist.serviceEndTime 
                            })
                        });
                    } catch(e) {
                        console.error('同步狀態失敗', e);
                    }
                },

                formatTimeLeft(ms) {
                    if (!ms || ms <= 0) return '00:00:00';
                    const h = Math.floor(ms / 3600000);
                    const m = Math.floor((ms % 3600000) / 60000);
                    const s = Math.floor((ms % 60000) / 1000);
                    const hh = String(h).padStart(2, '0');
                    const mm = String(m).padStart(2, '0');
                    const ss = String(s).padStart(2, '0');
                    return h > 0 ? `${hh}:${mm}:${ss}` : `${mm}:${ss}`;
                },

                // 班表狀態下拉改變時，即時寫回資料庫同步
                async handleStatusChange(therapist) {
                    if (therapist.status !== 'busy') {
                        therapist.serviceEndTime = null;
                        therapist.timeLeft = 0;
                        therapist.reminded = false;
                    }
                    await this.syncTherapist(therapist);
                },

                // 提早取消/結束服務
                async cancelService(therapist) {
                    if (confirm(`⚠️ 確定要提早結束/取消 ${therapist.name} (${therapist.code}) 的服務嗎？`)) {
                        therapist.status = 'active'; 
                        therapist.serviceEndTime = null;
                        therapist.timeLeft = 0;
                        therapist.reminded = false;
                        await this.syncTherapist(therapist);
                    }
                },

                toggleMatchSkill(skill) {
                    if (this.matchForm.selectedSkills.includes(skill)) {
                        this.matchForm.selectedSkills = this.matchForm.selectedSkills.filter(s => s !== skill);
                    } else {
                        this.matchForm.selectedSkills.push(skill);
                    }
                },

                runMatching() {
                    this.matchedTherapists = this.therapists.map(t => {
                        let score = 70; 
                        this.matchForm.selectedSkills.forEach(s => {
                            if (t.skills.includes(s)) score += 10;
                        });
                        return { ...t, matchScore: Math.min(score, 99) };
                    }).sort((a, b) => {
                        const statusWeight = { active: 3, busy: 2, off: 1 };
                        if (statusWeight[a.status] !== statusWeight[b.status]) {
                            return statusWeight[b.status] - statusWeight[a.status];
                        }
                        return b.matchScore - a.matchScore;
                    });
                },

                openBookingModal(therapist) {
                    this.bookingForm.therapistId = therapist.id;
                    this.bookingForm.therapistName = therapist.name;
                    if (this.matchForm.clientId) {
                        const selectedClient = this.clients.find(c => String(c.id) === String(this.matchForm.clientId));
                        this.bookingForm.clientName = selectedClient ? selectedClient.name : '';
                    } else {
                        this.bookingForm.clientName = '';
                    }
                    this.showBookingModal = true;
                },

                async confirmBooking() {
                    if (!this.bookingForm.clientName) return alert('請填寫客戶姓名！');

                    const targetT = this.therapists.find(t => t.id === this.bookingForm.therapistId);
                    if (targetT) {
                        const durationMins = parseInt(this.bookingForm.serviceItem);
                        targetT.status = 'busy';
                        targetT.serviceEndTime = new Date().getTime() + (durationMins * 60 * 1000); 
                        targetT.reminded = false;
                        
                        // 狀態改變，立即同步到雲端 DB
                        await this.syncTherapist(targetT);
                    }
                    
                    // 增加營運統計並存檔
                    this.stats.totalVisits += 1;
                    this.saveLocalData();

                    alert(`✅ 預約成功！\n系統已自動啟動 ${this.bookingForm.serviceItem} 分鐘服務倒數計時並寫入資料庫。`);
                    this.showBookingModal = false;
                    this.activeTab = 'therapists'; 
                },

                openTherapistModal() {
                    this.editingTherapist = { id: null, code: '', name: '', phone: '', skills: [] };
                    this.showTherapistModal = true;
                },

                editTherapist(therapist) {
                    this.editingTherapist = JSON.parse(JSON.stringify(therapist));
                    this.showTherapistModal = true;
                },

                // 新增/編輯 API 同步
                async saveTherapist() {
                    if (!this.editingTherapist.name) return alert('請輸入技師名稱！');
                    
                    try {
                        if (this.editingTherapist.id) {
                            // 更新 (PUT)
                            await fetch('/api/therapists', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ ...this.editingTherapist, status: this.editingTherapist.status || 'active' })
                            });
                        } else {
                            // 新增 (POST)
                            await fetch('/api/therapists', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(this.editingTherapist)
                            });
                        }
                        this.showTherapistModal = false;
                        await this.loadTherapists(); // 重新向 DB 抓取最新名單
                    } catch(e) {
                        alert('與資料庫同步儲存失敗！請確認資料庫連線。');
                        console.error(e);
                    }
                },

                async deleteTherapist(id) {
                    if (confirm('⚠️ 警告：確定要永久刪除此離職技師的資料嗎？\n此動作將不可復原，且會移除班表與資料庫上的所有紀錄。')) {
                        try {
                            await fetch(`/api/therapists?id=${id}`, { method: 'DELETE' });
                            await this.loadTherapists();
                            alert('已將該技師資料永久移除。');
                        } catch(e) {
                            alert('刪除失敗');
                            console.error(e);
                        }
                    }
                },

                openClientModal() {
                    this.editingClient = { id: null, name: '', phone: '' };
                    this.showClientModal = true;
                },

                saveClient() {
                    if(!this.editingClient.name) return alert('請輸入姓名');
                    const newClientId = Date.now();
                    this.clients.push({
                        id: newClientId,
                        name: this.editingClient.name,
                        phone: this.editingClient.phone,
                        total_visits: 1
                    });
                    this.saveLocalData(); // 儲存至 LocalStorage 避免重整遺失
                    this.matchForm.clientId = newClientId;
                    this.showClientModal = false;
                }
            }));
        });
    </script>
</body>
</html>
