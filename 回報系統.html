<body class="pb-10">

    <header class="bg-orange-500 text-white text-center py-4 sticky top-0 z-10 shadow-md">
        <h1 class="text-xl font-bold tracking-wider">📦 蝦皮門市作業輔助系統</h1>
    </header>

    <main class="max-w-lg mx-auto mt-4 px-4 space-y-6">
        
        <section class="bg-white rounded-xl card p-5 border-t-4 border-green-500">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-md font-bold text-gray-800 flex items-center gap-2">
                    🟢 LINE 門市群組捷徑
                    <span id="gpsStatus" class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded">📍 定位讀取中...</span>

                    ⚙️ 管理捷徑
                </button>
            </div>
            
            <div id="shortcutButtons" class="grid grid-cols-3 gap-2 text-center">
                </div>

            <div id="manageShortcutsSection" class="hidden mt-4 pt-4 border-t border-gray-200">
                <h3 class="text-sm font-bold text-gray-600 mb-2" id="shortcutFormTitle">新增捷徑</h3>
                <form id="shortcutForm" onsubmit="saveShortcut(event)" class="mb-4">
                    <input type="hidden" id="editShortcutId">
                    <select id="shortcutGroup" required class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-green-500 outline-none mb-2">
                        <option value="愛國群組">愛國群組</option>
                        <option value="中洲群組">中洲群組</option>
                    </select>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="shortcutName" placeholder="門市名稱" required class="flex-1 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-green-500 outline-none">
                        <input type="url" id="shortcutUrl" placeholder="LINE 網址 (https://...)" required class="flex-[2] border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-green-500 outline-none">

                    <div class="flex gap-2">

                        <button type="button" onclick="resetShortcutForm()" class="flex-1 bg-gray-400 text-white text-sm py-1 rounded hover:bg-gray-500 transition">取消</button>
                    </div>
                </form>
                <div id="manageShortcutList" class="space-y-2 max-h-40 overflow-y-auto hide-scroll">
                    </div>
            </div>
        </section>

                    <select id="locationSelect" class="flex-1 border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="潮州中洲">潮州中洲</option>

                        <option value="潮州大同">潮州大同</option>
                        <option value="潮州光春">潮州光春</option>
                        <option value="潮州愛國">潮州愛國</option>
                        <option value="潮州四維">潮州四維</option>
                        <option value="潮州文化">潮州文化</option>
                        <option value="潮州延平">潮州延平</option>
                        <option value="潮州太平">潮州太平</option>

                        <option value="NDD_FBS_PACKING">NDD,FBS離店打包</option>

                        <option value="PACKAGE_REALLOC">包裹重新分配</option>
                        <option value="PDA_SHELVING">PDA上架完成</option>
                        <option value="STAY_BOX_REPORT">滯留箱數回報</option>

                <div id="line2Container" class="hidden bg-gray-50 p-3 rounded border">

                <div id="line3Container" class="hidden bg-gray-50 p-3 rounded border">

        <section class="bg-white rounded-xl card p-5 border-t-4 border-purple-500 mb-10">
            <h2 class="text-md font-bold text-gray-800 mb-4">🔣 條碼 & QR Code 產生器</h2>
            
            <div class="space-y-3">
                <input type="text" id="inputValue" placeholder="請輸入數值 (例如: SPX30657)..." class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-purple-500 outline-none">
                
                <div class="flex gap-2">
                    <select id="codeType" onchange="toggleAdvancedOptions()" class="flex-1 border border-gray-300 rounded px-2 py-2 bg-gray-100 outline-none">
                        <option value="qrcode">QR Code</option>
                        <option value="barcode">條碼 (Barcode)</option>
                    </select>

                    <select id="barcodeFormat" style="display: none;" class="flex-1 border border-gray-300 rounded px-2 py-2 bg-gray-100 outline-none">
                        <option value="CODE128">CODE128 (英數)</option>
                        <option value="CODE39">CODE39 (大寫)</option>
                    </select>

                    <select id="qrErrorLevel" class="flex-1 border border-gray-300 rounded px-2 py-2 bg-gray-100 outline-none">
                        <option value="M">容錯: 一般</option>
                        <option value="H">容錯: 高</option>
                    </select>
                </div>

                <button onclick="generateCode()" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 rounded-lg shadow transition">
                    產生圖片
                </button>
            </div>

            <div id="codeGrid" class="grid grid-cols-1 gap-4 mt-4"></div>
        </section>

    </main>

    <script>
        /* ================= 0. 系統與各門市 GPS 座標設定 ================= */
        
        // ⚠️ 請填寫準確的 Google Map 經緯度，以確保 50 公尺判定精準
        const STORE_LOCATIONS = {
            '愛國群組': [
                { name: '潮州愛國智取店', lat: 22.553198, lng: 120.540112 },
                { name: '潮州四維智取店', lat: 22.551234, lng: 120.542234 },
                { name: '潮州文化智取店', lat: 22.554321, lng: 120.538888 },
                { name: '潮州延平智取店', lat: 22.548900, lng: 120.544500 },
                { name: '潮州太平智取店', lat: 22.546789, lng: 120.541111 },
                { name: '潮州新生智取店', lat: 22.555555, lng: 120.546666 }
            ],
            '中洲群組': [
                { name: '潮州中洲智取店', lat: 22.547198, lng: 120.537112 },
                { name: '潮州光華智取店', lat: 22.549234, lng: 120.539234 },
                { name: '潮州大同智取店', lat: 22.552321, lng: 120.536888 },
                { name: '潮州光春智取店', lat: 22.545900, lng: 120.548500 }
            ]
        };

        // Supabase 初始化
        const supabaseUrl = 'https://hyvcfxwoewvbpfzvfdnn.supabase.co';
        const supabaseKey = 'sb_publishable_TR5C2Zc7eOj9uUosUUsX4g_KbBOwey2';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        /* ================= 1. LINE 群組捷徑 (Supabase CRUD & GPS) ================= */
        let shortcuts = [];
        let editShortcutId = null;
        let currentVisibleGroup = null; // 當前使用者位在的 50m 範圍群組
        let userLat = null;
        let userLng = null;

        // Haversine 公式計算兩點距離 (單位：公尺)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dl = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(dp / 2) * Math.sin(dp / 2) +
                      Math.cos(p1) * Math.cos(p2) *
                      Math.sin(dl / 2) * Math.sin(dl / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
        }

        function updateGpsStatus(status, colorClass) {
            const el = document.getElementById('gpsStatus');
            el.innerText = status;
            el.className = `text-xs px-2 py-0.5 rounded ${colorClass}`;
        }

        function checkLocationVisibility() {
            if (userLat === null || userLng === null) return;
            
            let inAiguo = false;
            let inZhongzhou = false;

            // 檢查是否在愛國群組門市 50m 內
            for (let store of STORE_LOCATIONS['愛國群組']) {
                if (calculateDistance(userLat, userLng, store.lat, store.lng) <= 50) {
                    inAiguo = true; break;
                }
            }

            // 檢查是否在中洲群組門市 50m 內
            for (let store of STORE_LOCATIONS['中洲群組']) {
                if (calculateDistance(userLat, userLng, store.lat, store.lng) <= 50) {
                    inZhongzhou = true; break;
                }
            }

            if (inAiguo) {
                currentVisibleGroup = '愛國群組';
                updateGpsStatus(`📍 在範圍內 (${currentVisibleGroup})`, 'bg-green-100 text-green-700');
            } else if (inZhongzhou) {
                currentVisibleGroup = '中洲群組';
                updateGpsStatus(`📍 在範圍內 (${currentVisibleGroup})`, 'bg-green-100 text-green-700');
            } else {
                currentVisibleGroup = null; 
                updateGpsStatus('📍 距離過遠 (已隱藏)', 'bg-yellow-100 text-yellow-700');
            }

            renderShortcuts();
        }

        async function fetchShortcuts() {
            const { data, error } = await supabase.from('shopee_shortcuts').select('*').order('created_at', { ascending: true });
            if (!error && data) {
                shortcuts = data;
                renderShortcuts();
            }
        }

        function renderShortcuts() {
            const btnContainer = document.getElementById('shortcutButtons');
            
            // 預設隱藏，僅顯示當前符合 GPS 定位的群組
            if (currentVisibleGroup === null) {
                btnContainer.innerHTML = '<div class="col-span-3 text-gray-500 text-sm py-2 bg-gray-50 rounded">請靠近門市 50 公尺內以顯示專屬捷徑</div>';
            } else {
                const visibleShortcuts = shortcuts.filter(s => s.group_type === currentVisibleGroup);
                if (visibleShortcuts.length === 0) {
                    btnContainer.innerHTML = '<div class="col-span-3 text-gray-500 text-sm py-2">該群組尚無建立任何捷徑</div>';
                } else {
                    btnContainer.innerHTML = visibleShortcuts.map(s => 
                        `<a href="${s.url}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-3 px-1 rounded-lg shadow transition flex items-center justify-center break-all">${escapeHtml(s.name)}</a>`
                    ).join('');
                }
            }

            // 渲染管理列表 (管理後台永遠顯示全部，方便增刪改)
            const listContainer = document.getElementById('manageShortcutList');
            listContainer.innerHTML = shortcuts.map(s => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-200">
                    <div class="overflow-hidden pr-2">
                        <div class="font-bold text-sm text-gray-800">
                            <span class="text-xs bg-gray-200 text-gray-600 px-1 rounded mr-1">${escapeHtml(s.group_type)}</span>
                            ${escapeHtml(s.name)}
                        </div>
                        <div class="text-xs text-gray-400 truncate">${escapeHtml(s.url)}</div>
                    </div>
                    <div class="flex gap-1 shrink-0">
                        <button type="button" onclick="editShortcut('${s.id}')" class="bg-blue-100 hover:bg-blue-200 text-blue-600 px-2 py-1 rounded text-xs transition">✏️</button>
                        <button type="button" onclick="deleteShortcut('${s.id}')" class="bg-red-100 hover:bg-red-200 text-red-600 px-2 py-1 rounded text-xs transition">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleManageShortcuts() {
            const section = document.getElementById('manageShortcutsSection');
            section.classList.toggle('hidden');
            resetShortcutForm();
        }

        async function saveShortcut(e) {
            e.preventDefault();
            const group_type = document.getElementById('shortcutGroup').value;
            const name = document.getElementById('shortcutName').value.trim();
            const url = document.getElementById('shortcutUrl').value.trim();
            if (!name || !url) return;

            document.getElementById('saveShortcutBtn').disabled = true;
            document.getElementById('saveShortcutBtn').innerText = '儲存中...';

            if (editShortcutId) {
                const { error } = await supabase.from('shopee_shortcuts')
                    .update({ name, url, group_type })
                    .eq('id', editShortcutId);
                if (error) alert('更新失敗！');
            } else {
                const { error } = await supabase.from('shopee_shortcuts')
                    .insert([{ name, url, group_type }]);
                if (error) alert('新增失敗！');
            }

            resetShortcutForm();
        }

        function editShortcut(id) {
            const s = shortcuts.find(x => x.id === id);
            if (!s) return;
            editShortcutId = id;
            document.getElementById('shortcutGroup').value = s.group_type;
            document.getElementById('shortcutName').value = s.name;
            document.getElementById('shortcutUrl').value = s.url;
            document.getElementById('shortcutFormTitle').innerText = '修改捷徑';
            document.getElementById('saveShortcutBtn').innerText = '更新';
        }

        async function deleteShortcut(id) {
            if (!confirm('確定要刪除此捷徑嗎？')) return;
            const { error } = await supabase.from('shopee_shortcuts').delete().eq('id', id);
            if (error) alert('刪除失敗！');
        }

        function resetShortcutForm() {
            editShortcutId = null;
            document.getElementById('shortcutForm').reset();
            document.getElementById('shortcutFormTitle').innerText = '新增捷徑';
            const btn = document.getElementById('saveShortcutBtn');
            btn.disabled = false;
            btn.innerText = '儲存';
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        /* ================= 2. 回報字串產生器邏輯 ================= */
        const today = new Date();
        document.getElementById('todayDate').innerText = `${today.getMonth() + 1}/${today.getDate()}`;

        const L2_CONFIG = {
            'SCS_FBS_BLACKBOX': [
                { val: 'strap', text: '束帶×（手動輸入）', inputs: ['數量'] },
                { val: 'no_strap', text: '無束帶×（手動輸入）', inputs: ['數量'] }
            ],
            'NDD_FBS_PACKING': [
                { val: 'none', text: '無', inputs: [] },
                { val: 'lack', text: '缺（手動輸入）', inputs: ['數量'] }
            ],
            'NDD_SHELVING': [
                { val: 'none', text: '無', inputs: [] },
                { val: 'lack', text: '缺（手動輸入）', inputs: ['數量'] },
                { val: 'stay_pcs', text: '滯留（手動輸入）件', inputs: ['件數'] },
                { val: 'stay_naked', text: '滯留（手動輸入）裸', inputs: ['裸數'] },
                { val: 'exception', text: '異退（手動輸入）件', inputs: ['件數'] }
            ],
            'PACKAGE_REALLOC': [], 
            'PDA_SHELVING': [
                { val: 'none', text: '無', inputs: [] },
                { val: 'stay_box_naked', text: '滯留（手動輸入）箱（手動輸入）裸', inputs: ['箱數', '裸數'] },
                { val: 'stay_box', text: '滯留（手動輸入）箱', inputs: ['箱數'] },
                { val: 'stay_naked', text: '滯留（手動輸入）裸', inputs: ['裸數'] }
            ],
            'STAY_BOX_REPORT': [
                { val: 'none', text: '無', inputs: [] },
                { val: 'stay_box_naked', text: '滯留（手動輸入）箱（手動輸入）裸', inputs: ['箱數', '裸數'] },
                { val: 'stay_box', text: '滯留（手動輸入）箱', inputs: ['箱數'] },
                { val: 'stay_naked', text: '滯留（手動輸入）裸', inputs: ['裸數'] }
            ],
            'STOREFRONT_CHECK': [] 
        };

        const L3_CONFIG = {
            'SCS_FBS_BLACKBOX': {
                'strap': [
                    { val: 'strap', text: '束帶×（手動輸入）', inputs: ['數量'] },
                    { val: 'no_strap', text: '無束帶×（手動輸入）', inputs: ['數量'] }
                ],
                'no_strap': [] 
            },
            'NDD_FBS_PACKING': {
                'none': [], 
                'lack': [
                    { val: 'none', text: '無', inputs: [] },
                    { val: 'found', text: '已刷已找', inputs: [] }
                ]
            },
            'NDD_SHELVING': {
                'none': [],
                'lack': [ { val: 'no_pkg', text: '門市已無包裹', inputs: [] } ],
                'exception': [
                    { val: 'damage', text: '濕損破損', inputs: [] },
                    { val: 'no_accept', text: '系統無法驗收', inputs: [] },
                    { val: 'no_label', text: '無面單', inputs: [] },
                    { val: 'double_label', text: '雙面單', inputs: [] }
                ],
                'stay_pcs': [ { val: 'no_suitable', text: '無合適櫃位', inputs: [] }, { val: 'no_cabinet', text: '無櫃位', inputs: [] } ],
                'stay_naked': [ { val: 'no_suitable', text: '無合適櫃位', inputs: [] }, { val: 'no_cabinet', text: '無櫃位', inputs: [] } ]
            },
            'PDA_SHELVING': {
                'none': [],
                'stay_box_naked': [ { val: 'no_suitable', text: '無合適櫃位', inputs: [] }, { val: 'no_cabinet', text: '無櫃位', inputs: [] } ],
                'stay_box': [ { val: 'no_suitable', text: '無合適櫃位', inputs: [] }, { val: 'no_cabinet', text: '無櫃位', inputs: [] } ],

            },

                'stay_box': [ { val: 'no_suitable', text: '無合適櫃位', inputs: [] }, { val: 'no_cabinet', text: '無櫃位', inputs: [] } ],
                'stay_naked': [ { val: 'no_suitable', text: '無合適櫃位', inputs: [] }, { val: 'no_cabinet', text: '無櫃位', inputs: [] } ]
            }
        };

        let currentCategory = '';

        function onCategoryChange() {
            currentCategory = document.getElementById('categorySelect').value;
            const l2Conf = L2_CONFIG[currentCategory];
            const l2Container = document.getElementById('line2Container');
            const l3Container = document.getElementById('line3Container');

            if (!l2Conf || l2Conf.length === 0) {
                l2Container.classList.add('hidden');
                l3Container.classList.add('hidden');
                return;
            }

            l2Container.classList.remove('hidden');
            document.getElementById('line2Select').innerHTML = l2Conf.map(opt => `<option value="${opt.val}">${opt.text}</option>`).join('');
            onL2Change();
        }

        function onL2Change() {
            const l2Val = document.getElementById('line2Select').value;
            const l2Conf = L2_CONFIG[currentCategory].find(c => c.val === l2Val);
            
            document.getElementById('line2Inputs').innerHTML = l2Conf.inputs.map((ph, i) => 
                `<input type="number" id="l2_in_${i}" placeholder="${ph}" class="w-14 border border-gray-300 rounded px-1 py-1 text-center text-sm outline-none focus:ring-1 focus:ring-blue-500" min="0">`
            ).join('');

            const l3Container = document.getElementById('line3Container');
            const l3Options = L3_CONFIG[currentCategory]?.[l2Val];

            if (!l3Options || l3Options.length === 0) {
                l3Container.classList.add('hidden');
            } else {
                l3Container.classList.remove('hidden');
                document.getElementById('line3Select').innerHTML = l3Options.map(opt => `<option value="${opt.val}">${opt.text}</option>`).join('');
                onL3Change();
            }
        }

        function onL3Change() {
            const l2Val = document.getElementById('line2Select').value;
            const l3Val = document.getElementById('line3Select').value;
            const l3Conf = L3_CONFIG[currentCategory]?.[l2Val]?.find(c => c.val === l3Val);
            
            if (l3Conf && l3Conf.inputs) {
                document.getElementById('line3Inputs').innerHTML = l3Conf.inputs.map((ph, i) => 
                    `<input type="number" id="l3_in_${i}" placeholder="${ph}" class="w-14 border border-gray-300 rounded px-1 py-1 text-center text-sm outline-none focus:ring-1 focus:ring-blue-500" min="0">`
                ).join('');
            } else {
                document.getElementById('line3Inputs').innerHTML = '';
            }
        }

        function formatLineText(val, level) {
            if (val === 'none') return '';
            
            const inputs = [];
            let i = 0;
            while (document.getElementById(`l${level}_in_${i}`)) {
                inputs.push(document.getElementById(`l${level}_in_${i}`).value || '0');
                i++;
            }

            switch(val) {
                case 'strap': return `束帶×${inputs[0]}`;
                case 'no_strap': return `無束帶×${inputs[0]}`;
                case 'lack': return `缺${inputs[0]}`;
                case 'stay_pcs': return `滯留${inputs[0]}件`;
                case 'stay_naked': return `滯留${inputs[0]}裸`;
                case 'stay_box': return `滯留${inputs[0]}箱`;
                case 'stay_box_naked': return `滯留${inputs[0]}箱${inputs[1]}裸`;
                case 'exception': return `異退${inputs[0]}件`;
                case 'found': return '已刷已找';
                case 'no_pkg': return '門市已無包裹';
                case 'damage': return '濕損破損';
                case 'no_accept': return '系統無法驗收';
                case 'no_label': return '無面單';
                case 'double_label': return '雙面單';
                case 'no_suitable': return '無合適櫃位';
                case 'no_cabinet': return '無櫃位';
                default: return '';
            }
        }

        function generateAndCopyString() {
            const cat = document.getElementById('categorySelect').value;
            if (!cat) return alert('⚠️ 請先選擇回報情境！');

            const dateStr = document.getElementById('todayDate').innerText;
            const store = document.getElementById('locationSelect').value;
            
            const lines = [`${dateStr} ${store}`];

            const l2Container = document.getElementById('line2Container');
            if (!l2Container.classList.contains('hidden')) {
                const l2Text = formatLineText(document.getElementById('line2Select').value, 2);
                if (l2Text) lines.push(l2Text);
            }

            const l3Container = document.getElementById('line3Container');
            if (!l3Container.classList.contains('hidden')) {
                const l3Text = formatLineText(document.getElementById('line3Select').value, 3);
                if (l3Text) lines.push(l3Text);
            }

            const finalString = lines.join('\n');
            const output = document.getElementById('resultOutput');
            output.value = finalString;

            navigator.clipboard.writeText(finalString).then(() => {
                alert('✅ 字串已成功複製！\n\n' + finalString);
            }).catch(() => {
                alert('❌ 複製失敗，請手動選取文字框的內容複製。');
            });
        }

        /* ================= 3. 條碼 & QR Code 產生器邏輯 ================= */
        function toggleAdvancedOptions() {
            const type = document.getElementById('codeType').value;
            document.getElementById('barcodeFormat').style.display = type === 'barcode' ? 'block' : 'none';
            document.getElementById('qrErrorLevel').style.display = type === 'qrcode' ? 'block' : 'none';
        }

        function generateCode() {
            const inputField = document.getElementById('inputValue');
            let rawInput = inputField.value.trim();
            const type = document.getElementById('codeType').value;

            if (!rawInput) return alert('⚠️ 請先輸入數值！');
            const safeInput = rawInput.replace(/[\u200B-\u200D\uFEFF]/g, '');
            const grid = document.getElementById('codeGrid');

            const card = document.createElement('div');
            card.className = 'bg-white p-4 border rounded-xl shadow-sm flex flex-col items-center gap-3';

            const textDisplay = document.createElement('div');
            textDisplay.className = 'font-bold text-gray-700 break-all text-center w-full text-sm';
            textDisplay.textContent = safeInput;

            const actions = document.createElement('div');
            actions.className = 'flex gap-2 w-full';

            let downloadTarget;

            try {
                if (type === 'barcode') {
                    if (typeof JsBarcode === 'undefined') return alert('⚠️ 條碼模組載入中，請稍候再試。');
                    const canvas = document.createElement('canvas');
                    const format = document.getElementById('barcodeFormat').value;
                    JsBarcode(canvas, safeInput, { format: format, width: 2, height: 60, displayValue: false, margin: 10 });
                    canvas.className = "max-w-full h-auto rounded bg-white p-2";
                    card.appendChild(canvas);
                    downloadTarget = canvas;
                } else if (type === 'qrcode') {
                    if (typeof QRious === 'undefined') return alert('⚠️ QR Code 模組載入中，請稍候再試。');
                    const qrCanvas = document.createElement('canvas');
                    new QRious({ element: qrCanvas, value: safeInput, size: 160, level: document.getElementById('qrErrorLevel').value });
                    qrCanvas.className = "max-w-full h-auto rounded bg-white p-2 border";
                    card.appendChild(qrCanvas);
                    downloadTarget = qrCanvas;
                }
            } catch (e) {
                return alert(`❌ 產生失敗！系統訊息: ${e.message || e}`); 
            }

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'flex-1 bg-blue-100 text-blue-600 font-bold py-2 rounded hover:bg-blue-200 transition text-sm';
            downloadBtn.textContent = '下載';
            downloadBtn.onclick = () => downloadImage(downloadTarget, safeInput, type);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'flex-1 bg-red-100 text-red-600 font-bold py-2 rounded hover:bg-red-200 transition text-sm';
            removeBtn.textContent = '移除';
            removeBtn.onclick = () => card.remove();

            actions.appendChild(downloadBtn);
            actions.appendChild(removeBtn);
            card.appendChild(textDisplay);
            card.appendChild(actions);

            grid.prepend(card); 
            inputField.value = ''; 
        }

        function downloadImage(canvas, text, type) {
            const url = canvas.toDataURL("image/png");
            const a = document.createElement('a');
            a.href = url;
            const safeName = text.replace(/[^a-zA-Z0-9]/gi, '_').substring(0, 15);
            a.download = `${type}_${safeName || 'image'}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        /* ================= 4. 初始化與訂閱機制 ================= */
        document.addEventListener('DOMContentLoaded', () => {
            
            // 初始化獲取資料
            fetchShortcuts();

            // 訂閱 Supabase Realtime 即時更新
            supabase
                .channel('public:shopee_shortcuts')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'shopee_shortcuts' }, payload => {
                    fetchShortcuts(); 
                })
                .subscribe();

            // 初始化 GPS 定位監聽
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;
                        checkLocationVisibility();
                    },
                    (error) => {
                        console.warn(`Geolocation error: ${error.message}`);
                        let msg = '📍 定位失敗';
                        if (error.code === 1) msg = '📍 定位被拒(請開權限)';
                        updateGpsStatus(msg, 'bg-red-100 text-red-700');
                        currentVisibleGroup = null;
                        renderShortcuts();
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                updateGpsStatus('📍 裝置不支援定位', 'bg-red-100 text-red-700');
            }

        });
    </script>
</body>
</html>
