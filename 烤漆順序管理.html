<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>烤漆作業順序紀錄系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/org/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- 標題與系統狀態 -->
    <div class="bg-white p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid font-sharp fa-fill-drip text-indigo-600"></i>
          烤漆作業順序紀錄系統
        </h1>
        <p class="text-sm text-slate-500 mt-1">當天預登隔天作業程序 | 即時雲端同步</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs font-semibold px-3 py-1 bg-slate-100 text-slate-600 rounded-full flex items-center gap-1.5 border">
          <span id="targetDateBadge" class="font-bold text-indigo-600">---</span> (下一工作日)
        </span>
        <span id="syncStatus" class="text-xs px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full font-medium flex items-center gap-1">
          <i class="fa-solid fa-circle text-[8px]"></i> 已連線 Firebase
        </span>
      </div>
    </div>

    <!-- 表單區塊：新增紀錄 -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-indigo-600"></i> 新增烤漆作業資料
      </h2>

      <form id="scheduleForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          
          <!-- 工作日期 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">預計排程日期</label>
            <input type="text" id="targetDateInput" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 font-bold" readonly>
          </div>

          <!-- 序號 (自動遞增) -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">自動序號</label>
            <input type="number" id="seqNoInput" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold text-indigo-600" readonly>
          </div>

          <!-- 顏色下拉/可查詢/動態擴充 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">顏色</label>
            <input list="colorOptions" id="colorInput" placeholder="選擇或輸入顏色" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
            <datalist id="colorOptions"></datalist>
          </div>

          <!-- 機型下拉/可查詢/動態擴充 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">機型</label>
            <input list="modelOptions" id="modelInput" placeholder="選擇或輸入機型" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
            <datalist id="modelOptions"></datalist>
          </div>

        </div>

        <!-- 動態備註欄 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold text-slate-600">備註項目</label>
            <button type="button" id="addRemarkBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1">
              <i class="fa-solid fa-plus"></i> 新增備註欄
            </button>
          </div>
          <div id="remarkContainer" class="space-y-2">
            <div class="flex gap-2">
              <input type="text" class="remark-field w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="輸入備註事項...">
            </div>
          </div>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition duration-200 shadow hover:shadow-lg flex justify-center items-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> 儲存至雲端資料庫
        </button>
      </form>
    </div>

    <!-- 歷史記錄查詢與資料列表 -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4 pb-2 border-b">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-clock-history text-indigo-600"></i> 烤漆紀錄與歷史查詢
        </h2>
        
        <!-- 查詢過濾欄 -->
        <div class="flex flex-wrap gap-2 w-full md:w-auto">
          <input type="text" id="filterDate" placeholder="過濾日期 (月/日)" class="border border-slate-300 rounded-md px-2.5 py-1 text-xs outline-none focus:border-indigo-500 w-28">
          <input type="text" id="filterColor" placeholder="過濾顏色" class="border border-slate-300 rounded-md px-2.5 py-1 text-xs outline-none focus:border-indigo-500 w-28">
          <input type="text" id="filterModel" placeholder="過濾機型" class="border border-slate-300 rounded-md px-2.5 py-1 text-xs outline-none focus:border-indigo-500 w-28">
          <button id="resetFilterBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2.5 py-1 rounded-md font-medium">重置</button>
        </div>
      </div>

      <!-- 表格 -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold text-xs">
              <th class="p-3">序號</th>
              <th class="p-3">排程日期</th>
              <th class="p-3">顏色</th>
              <th class="p-3">機型</th>
              <th class="p-3">備註</th>
              <th class="p-3">建立時間</th>
              <th class="p-3 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="recordTableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="text-center py-8 text-slate-400">載入中或尚無資料...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Firebase SDK JS Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyBvx7Ej2h9ZV5S1t_Gag756qop_jcoxy2U",
      authDomain: "shopee-60a13.firebaseapp.com",
      databaseURL: "https://shopee-60a13-default-rtdb.firebaseio.com",
      projectId: "shopee-60a13",
      storageBucket: "shopee-60a13.firebasestorage.app",
      messagingSenderId: "18436404849",
      appId: "1:18436404849:web:f2bdfa4189ff15456fcdd0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, "painting_schedules");
    const colorsRef = ref(db, "custom_colors");
    const modelsRef = ref(db, "custom_models");

    // 預設顏色選項清單
    let colorList = ["WE","YW","GYW","YWH","BKEBK","BKH","BKS","BKS1","BKS5","BKSA","BKSA1","OE","GN","FGN","PELBE","BEG","DBE","IG","IGS","DGS","ATG","GAST","PK","RD","SAT2"];
    let modelList = ["Model-A", "Model-B", "Model-C"];
    let rawRecords = [];
    let currentNextSeq = 1;

    // 常用國定假日清單 (MM-DD格式，可自行擴充)
    const holidays = ["01-01", "02-28", "04-04", "04-05", "05-01", "10-10"];

    // 計算下一個工作日 (自動跳過六日與國定假日)
    function getNextWorkingDate(startDate = new Date()) {
      let date = new Date(startDate);
      date.setDate(date.getDate() + 1); // 當天紀錄隔天

      while (true) {
        const dayOfWeek = date.getDay(); // 0: 日, 6: 六
        const monthDay = String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
        
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const isHoliday = holidays.includes(monthDay);

        if (!isWeekend && !isHoliday) {
          break;
        }
        date.setDate(date.getDate() + 1);
      }

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const weeks = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const weekStr = weeks[date.getDay()];

      return `${year}/${month}/${day} (${weekStr})`;
    }

    // 初始化選單
    function renderDropdowns() {
      const colorDatalist = document.getElementById("colorOptions");
      colorDatalist.innerHTML = colorList.map(c => `<option value="${c}">`).join('');

      const modelDatalist = document.getElementById("modelOptions");
      modelDatalist.innerHTML = modelList.map(m => `<option value="${m}">`).join('');
    }

    // 頁面初始化執行
    const targetDateFormatted = getNextWorkingDate();
    document.getElementById("targetDateInput").value = targetDateFormatted;
    document.getElementById("targetDateBadge").innerText = targetDateFormatted;

    // Firebase 顏色與機型動態選單同步
    onValue(colorsRef, (snapshot) => {
      if (snapshot.exists()) {
        const customColors = Object.values(snapshot.val());
        colorList = Array.from(new Set([...colorList, ...customColors]));
      }
      renderDropdowns();
    });

    onValue(modelsRef, (snapshot) => {
      if (snapshot.exists()) {
        const customModels = Object.values(snapshot.val());
        modelList = Array.from(new Set([...modelList, ...customModels]));
      }
      renderDropdowns();
    });

    // 動態新增備註欄
    document.getElementById("addRemarkBtn").addEventListener("click", () => {
      const container = document.getElementById("remarkContainer");
      const div = document.createElement("div");
      div.className = "flex gap-2 items-center";
      div.innerHTML = `
        <input type="text" class="remark-field w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="輸入備註事項...">
        <button type="button" class="remove-remark text-red-500 hover:text-red-700 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
      `;
      container.appendChild(div);

      div.querySelector(".remove-remark").addEventListener("click", () => div.remove());
    });

    // 監聽 Firebase 即時資料更新與自動算序號
    onValue(dbRef, (snapshot) => {
      const tableBody = document.getElementById("recordTableBody");
      tableBody.innerHTML = "";
      rawRecords = [];

      if (snapshot.exists()) {
        const data = snapshot.val();
        let maxSeq = 0;

        Object.keys(data).forEach(key => {
          const item = { id: key, ...data[key] };
          rawRecords.push(item);
          if (item.targetDate === targetDateFormatted && item.seqNo > maxSeq) {
            maxSeq = item.seqNo;
          }
        });

        currentNextSeq = maxSeq + 1;
        document.getElementById("seqNoInput").value = currentNextSeq;

        // 預設倒序顯示最新紀錄
        renderTable(rawRecords.reverse());
      } else {
        currentNextSeq = 1;
        document.getElementById("seqNoInput").value = currentNextSeq;
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">目前尚無排程資料</td></tr>`;
      }
    });

    // 繪製資料表
    function renderTable(records) {
      const tableBody = document.getElementById("recordTableBody");
      if (records.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-400">查無符合條件的歷史紀錄</td></tr>`;
        return;
      }

      tableBody.innerHTML = records.map(r => `
        <tr class="hover:bg-slate-50 transition">
          <td class="p-3 font-bold text-indigo-600">#${r.seqNo}</td>
          <td class="p-3 font-medium">${r.targetDate}</td>
          <td class="p-3"><span class="px-2 py-0.5 bg-slate-100 rounded border border-slate-200 text-xs font-semibold">${r.color}</span></td>
          <td class="p-3"><span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded border border-blue-100 text-xs font-semibold">${r.model}</span></td>
          <td class="p-3 text-slate-600">${Array.isArray(r.remarks) ? r.remarks.join("；") : (r.remarks || "-")}</td>
          <td class="p-3 text-xs text-slate-400">${r.createdAt || "-"}</td>
          <td class="p-3 text-center">
            <button onclick="deleteRecord('${r.id}')" class="text-xs text-red-500 hover:text-red-700 font-medium px-2 py-1 rounded">
              <i class="fa-solid fa-trash"></i> 刪除
            </button>
          </td>
        </tr>
      `).join('');
    }

    // 全域刪除函數
    window.deleteRecord = (id) => {
      if (confirm("確定要刪除這筆烤漆紀錄嗎？")) {
        remove(ref(db, `painting_schedules/${id}`));
      }
    };

    // 表單提交：寫入 Firebase
    document.getElementById("scheduleForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const colorVal = document.getElementById("colorInput").value.trim().toUpperCase();
      const modelVal = document.getElementById("modelInput").value.trim();
      const targetDate = document.getElementById("targetDateInput").value;
      const seqNo = parseInt(document.getElementById("seqNoInput").value);

      // 收集所有備註
      const remarkInputs = document.querySelectorAll(".remark-field");
      const remarks = Array.from(remarkInputs).map(i => i.value.trim()).filter(v => v !== "");

      if (!colorVal || !modelVal) return;

      // 若手動輸入新顏色/機型，自動記錄擴充
      if (!colorList.includes(colorVal)) {
        push(colorsRef, colorVal);
      }
      if (!modelList.includes(modelVal)) {
        push(modelsRef, modelVal);
      }

      const now = new Date();
      const createdAt = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      // 儲存至 Firebase
      push(dbRef, {
        seqNo,
        targetDate,
        color: colorVal,
        model: modelVal,
        remarks,
        createdAt
      }).then(() => {
        // 重置欄位與備註
        document.getElementById("colorInput").value = "";
        document.getElementById("modelInput").value = "";
        document.getElementById("remarkContainer").innerHTML = `
          <div class="flex gap-2">
            <input type="text" class="remark-field w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="輸入備註事項...">
          </div>
        `;
      });
    });

    // 歷史紀錄查詢過濾功能
    function filterRecords() {
      const dateTerm = document.getElementById("filterDate").value.trim().toLowerCase();
      const colorTerm = document.getElementById("filterColor").value.trim().toLowerCase();
      const modelTerm = document.getElementById("filterModel").value.trim().toLowerCase();

      const filtered = rawRecords.filter(r => {
        const matchDate = !dateTerm || r.targetDate.toLowerCase().includes(dateTerm);
        const matchColor = !colorTerm || r.color.toLowerCase().includes(colorTerm);
        const matchModel = !modelTerm || r.model.toLowerCase().includes(modelTerm);
        return matchDate && matchColor && matchModel;
      });

      renderTable(filtered);
    }

    document.getElementById("filterDate").addEventListener("input", filterRecords);
    document.getElementById("filterColor").addEventListener("input", filterRecords);
    document.getElementById("filterModel").addEventListener("input", filterRecords);

    document.getElementById("resetFilterBtn").addEventListener("click", () => {
      document.getElementById("filterDate").value = "";
      document.getElementById("filterColor").value = "";
      document.getElementById("filterModel").value = "";
      renderTable(rawRecords);
    });
  </script>
</body>
</html>
