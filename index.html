<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>足療客戶技師匹配系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 頂部標題 -->
  <header>
    <h1>足療智能預約系統</h1>
  </header>

  <!-- 內容區域 -->
  <main id="main-content">
    
    <!-- 模組 1：預約與紀錄 -->
    <section id="view-booking" class="view-section active">
      <h2>新增預約</h2>
      <form id="booking-form" class="card-form">
        <input type="text" id="client-name" placeholder="客戶姓名 / 電話" required>
        <select id="client-need" required>
          <option value="" disabled selected>請選擇客戶需求</option>
          <option value="腳底按摩">腳底按摩</option>
          <option value="全身指壓">全身指壓</option>
          <option value="肩頸舒壓">肩頸舒壓</option>
          <option value="修腳皮/凍甲">修腳皮/凍甲</option>
        </select>
        <select id="tech-select" required>
          <option value="" disabled selected>載入技師中...</option>
        </select>
        <input type="datetime-local" id="book-time" required>
        <button type="submit" class="btn-primary">建立預約</button>
      </form>

      <h2>即時預約紀錄</h2>
      <div id="appointments-list" class="list-container"></div>
    </section>

    <!-- 模組 2：技師管理 -->
    <section id="view-techs" class="view-section">
      <h2>新增/修改技師</h2>
      <form id="tech-form" class="card-form">
        <input type="hidden" id="tech-id">
        <input type="text" id="tech-name" placeholder="技師名稱/編號" required>
        <input type="text" id="tech-skills" placeholder="專長 (如: 腳底按摩, 修腳皮)" required>
        <button type="submit" class="btn-primary" id="tech-submit-btn">新增技師</button>
      </form>

      <h2>技師名單</h2>
      <div id="techs-list" class="list-container"></div>
    </section>

    <!-- 模組 3：客戶管理與統計 -->
    <section id="view-clients" class="view-section">
      <h2>客戶造訪頻率統計</h2>
      <div id="clients-list" class="list-container"></div>
    </section>

  </main>

  <!-- 底部手機版導航 -->
  <nav class="bottom-nav">
    <button onclick="switchTab('view-booking')" class="active" id="tab-view-booking">📅 預約大廳</button>
    <button onclick="switchTab('view-techs')" id="tab-view-techs">💆‍♂️ 技師管理</button>
    <button onclick="switchTab('view-clients')" id="tab-view-clients">📊 客戶統計</button>
  </nav>

  <!-- 引入模組化 JavaScript -->
  <script type="module" src="app.js"></script>
  <script>
    // 簡單的 Tab 切換邏輯
    function switchTab(tabId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.bottom-nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }
  </script>
</body>
</html>
