<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烤漆作業排程與紀錄系統 | Lịch trình Sơn</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased selection:bg-blue-200">

    <!-- 導航列 (Navbar) -->
    <nav class="bg-blue-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-spray-can text-2xl"></i>
                    <span class="font-bold text-xl tracking-wider" id="nav-title" data-i18n="appTitle">烤漆順序紀錄系統</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="tab-main" class="nav-btn active px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="tabMain">主控台</button>
                    <button id="tab-history" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition-colors hover:bg-blue-700" data-i18n="tabHistory">歷史查詢</button>
                    <div class="h-6 w-px bg-blue-400 mx-2"></div>
                    <!-- 語言切換按鈕 -->
                    <button id="btn-lang" class="flex items-center space-x-2 bg-white text-blue-800 px-3 py-1.5 rounded-full text-sm font-bold shadow hover:bg-gray-100 transition-all">
                        <i class="fa-solid fa-globe"></i>
                        <span id="lang-text">Tiếng Việt</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 系統通知 (Toast) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative">
        <!-- 視圖: 主控台 (Main Dashboard) -->
        <div id="view-main" class="view-section active space-y-8">
            
            <!-- 今日作業看板 -->
            <section class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden">
                <div class="bg-emerald-500 px-6 py-4 flex justify-between items-center text-white">
                    <h2 class="text-lg font-bold flex items-center space-x-2">
                        <i class="fa-solid fa-calendar-day"></i>
                        <span data-i18n="todayTask">今日作業資料</span>
                    </h2>
                    <span id="today-date-display" class="font-mono text-sm bg-emerald-600 px-3 py-1 rounded-full shadow-inner"></span>
                </div>
                <div class="p-6">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider">
                                    <th class="p-3 rounded-tl-lg" data-i18n="colSeq">序號</th>
                                    <th class="p-3" data-i18n="colColor">顏色</th>
                                    <th class="p-3" data-i18n="colModel">機型</th>
                                    <th class="p-3 rounded-tr-lg" data-i18n="colRemarks">備註</th>
                                </tr>
                            </thead>
                            <tbody id="today-task-body" class="divide-y divide-gray-200">
                                <!-- 透過 JS 動態載入今日資料 -->
                            </tbody>
                        </table>
                        <div id="today-empty-state" class="hidden text-center py-8 text-gray-400">
                            <i class="fa-solid fa-inbox text-4xl mb-3"></i>
                            <p data-i18n="noDataToday">今日無作業紀錄</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 隔日作業建立表單 -->
            <section class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden border-t-4 border-t-blue-500">
                <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center space-x-2">
                        <i class="fa-solid fa-clipboard-list text-blue-500"></i>
                        <span data-i18n="nextTask">次日烤漆作業程序建立</span>
                    </h2>
                    <div class="flex items-center space-x-3">
                        <span class="text-sm text-gray-500" data-i18n="targetDate">目標日期:</span>
                        <span id="next-date-display" class="font-bold text-blue-700 bg-blue-100 px-3 py-1 rounded shadow-sm"></span>
                    </div>
                </div>
                
                <div class="p-6">
                    <div class="overflow-x-auto min-h-[300px]">
                        <table class="w-full text-left border-collapse mb-4">
                            <thead>
                                <tr class="bg-gray-800 text-white text-sm">
                                    <th class="p-3 w-20 text-center rounded-tl-lg" data-i18n="colSeq">序號</th>
                                    <th class="p-3 w-1/4" data-i18n="colColor">顏色</th>
                                    <th class="p-3 w-1/4" data-i18n="colModel">機型</th>
                                    <th class="p-3" data-i18n="colRemarks">備註</th>
                                    <th class="p-3 w-16 rounded-tr-lg"></th>
                                </tr>
                            </thead>
                            <tbody id="next-task-body" class="divide-y divide-gray-200">
                                <!-- 動態新增欄位區 -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="flex justify-between items-center mt-6 pt-4 border-t border-gray-100">
                        <button id="btn-add-row" class="flex items-center space-x-2 bg-blue-100 text-blue-700 hover:bg-blue-200 px-4 py-2 rounded-lg font-semibold transition-colors">
                            <i class="fa-solid fa-plus"></i>
                            <span data-i18n="addRow">加入下一筆資料</span>
                        </button>
                        
                        <button id="btn-save-schedule" class="flex items-center space-x-2 bg-blue-600 text-white hover:bg-blue-700 px-6 py-2 rounded-lg font-bold shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span data-i18n="saveData">儲存紀錄至雲端</span>
                        </button>
                    </div>
                </div>
            </section>
        </div>

        <!-- 視圖: 歷史紀錄查詢 (History View) -->
        <div id="view-history" class="view-section hidden space-y-6">
            <section class="bg-white rounded-xl shadow border border-gray-100 p-6">
                <h2 class="text-xl font-bold mb-6 text-gray-800 flex items-center space-x-2">
                    <i class="fa-solid fa-magnifying-glass-chart text-indigo-500"></i>
                    <span data-i18n="historySearch">歷史記錄查詢</span>
                </h2>
                
                <form id="search-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="searchDate">日期 (Date)</label>
                        <input type="date" id="search-date" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="colColor">顏色 (Color)</label>
                        <input type="text" id="search-color" list="history-color-list" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="colModel">機型 (Model)</label>
                        <input type="text" id="search-model" list="history-model-list" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition-colors shadow flex justify-center items-center space-x-2">
                            <i class="fa-solid fa-search"></i>
                            <span data-i18n="searchBtn">查詢</span>
                        </button>
                    </div>
                </form>

                <div class="mt-8 overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-indigo-50 text-indigo-800 text-sm border-b-2 border-indigo-200">
                                <th class="p-3" data-i18n="searchDate">日期</th>
                                <th class="p-3" data-i18n="colSeq">序號</th>
                                <th class="p-3" data-i18n="colColor">顏色</th>
                                <th class="p-3" data-i18n="colModel">機型</th>
                                <th class="p-3" data-i18n="colRemarks">備註</th>
                            </tr>
                        </thead>
                        <tbody id="history-result-body" class="divide-y divide-gray-200">
                            <!-- 歷史查詢結果 -->
                        </tbody>
                    </table>
                    <div id="history-empty-state" class="text-center py-10 text-gray-400">
                        <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
                        <p data-i18n="noHistoryResult">請設定條件進行查詢，或無符合資料</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 共用 Datalist (由 JS 動態注入選項) -->
    <datalist id="color-options"></datalist>
    <datalist id="model-options"></datalist>
    <datalist id="history-color-list"></datalist>
    <datalist id="history-model-list"></datalist>

    <!-- 系統主邏輯 -->
    <script type="module" src="app.js"></script>
</body>
</html>
