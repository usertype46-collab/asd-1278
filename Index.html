<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足療智能預約與技師匹配系統</title>
    <!-- 引入 Tailwind CSS 進行手機版優化排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- 頂部導航列 -->
    <nav class="bg-teal-600 text-white p-4 shadow-md sticky top-0 z-50">
        <h1 class="text-xl font-bold mb-3 text-center">足療匹配系統</h1>
        <div class="flex justify-between space-x-1 text-sm overflow-x-auto pb-2">
            <button onclick="switchTab('dashboard')" class="px-3 py-1 bg-teal-700 rounded hover:bg-teal-500 whitespace-nowrap">📊 統計</button>
            <button onclick="switchTab('techs')" class="px-3 py-1 bg-teal-700 rounded hover:bg-teal-500 whitespace-nowrap">💆 技師</button>
            <button onclick="switchTab('customers')" class="px-3 py-1 bg-teal-700 rounded hover:bg-teal-500 whitespace-nowrap">👥 客戶</button>
            <button onclick="switchTab('appointments')" class="px-3 py-1 bg-teal-700 rounded hover:bg-teal-500 whitespace-nowrap">📅 預約</button>
        </div>
    </nav>

    <div class="p-4 max-w-md mx-auto">
        <!-- 1. 統計面板 -->
        <div id="dashboard" class="tab-content active">
            <h2 class="text-xl font-bold mb-4 border-b-2 border-teal-500 pb-2">客戶造訪頻率統計</h2>
            <div id="statsList" class="space-y-3">
                <p class="text-gray-500">載入中...</p>
            </div>
        </div>

        <!-- 2. 技師管理 -->
        <div id="techs" class="tab-content">
            <h2 class="text-xl font-bold mb-4 border-b-2 border-teal-500 pb-2">技師管理</h2>
            <form id="techForm" class="bg-white p-4 rounded shadow mb-4">
                <input type="text" id="techName" placeholder="技師姓名" class="w-full mb-2 p-2 border rounded" required>
                <input type="text" id="techSkills" placeholder="專長 (例: 腳底按摩, 修腳皮)" class="w-full mb-2 p-2 border rounded" required>
                <button type="submit" class="w-full bg-teal-600 text-white p-2 rounded">新增技師</button>
            </form>
            <div id="techList" class="space-y-3"></div>
        </div>

        <!-- 3. 客戶紀錄 -->
        <div id="customers" class="tab-content">
            <h2 class="text-xl font-bold mb-4 border-b-2 border-teal-500 pb-2">客戶資訊紀錄</h2>
            <form id="customerForm" class="bg-white p-4 rounded shadow mb-4">
                <input type="text" id="custName" placeholder="客戶姓名" class="w-full mb-2 p-2 border rounded" required>
                <input type="tel" id="custPhone" placeholder="聯絡電話" class="w-full mb-2 p-2 border rounded" required>
                <textarea id="custNeeds" placeholder="身體狀況/偏好 (例: 力道偏重、怕癢)" class="w-full mb-2 p-2 border rounded" required></textarea>
                <button type="submit" class="w-full bg-teal-600 text-white p-2 rounded">新增客戶</button>
            </form>
            <div id="customerList" class="space-y-3"></div>
        </div>

        <!-- 4. 預約系統 -->
        <div id="appointments" class="tab-content">
            <h2 class="text-xl font-bold mb-4 border-b-2 border-teal-500 pb-2">預約與匹配</h2>
            <form id="appointmentForm" class="bg-white p-4 rounded shadow mb-4">
                <select id="aptCustomer" class="w-full mb-2 p-2 border rounded" required>
                    <option value="">選擇客戶...</option>
                </select>
                <select id="aptTech" class="w-full mb-2 p-2 border rounded" required>
                    <option value="">選擇技師...</option>
                </select>
                <input type="datetime-local" id="aptTime" class="w-full mb-2 p-2 border rounded" required>
                <button type="submit" class="w-full bg-teal-600 text-white p-2 rounded">新增預約</button>
            </form>
            <div id="appointmentList" class="space-y-3"></div>
        </div>
    </div>

    <!-- Firebase 模組化導入 (使用 CDN 以利 GitHub Pages 直接運行) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 您的 Firebase 設置
        const firebaseConfig = {
            apiKey: "AIzaSyC3wmOmhpFG3gaHk9uUHmcjS09sdAAHM9k",
            authDomain: "smart-matching-system-services.firebaseapp.com",
            projectId: "smart-matching-system-services",
            storageBucket: "smart-matching-system-services.firebasestorage.app",
            messagingSenderId: "699119431060",
            appId: "1:699119431060:web:0672bf06c3cd7707f8f381",
            measurementId: "G-RMS75RXKK0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 狀態儲存
        let techsData = [];
        let customersData = [];
        let appointmentsData = [];

        // UI 渲染函數
        function renderTechs() {
            const list = document.getElementById('techList');
            const aptSelect = document.getElementById('aptTech');
            list.innerHTML = '';
            aptSelect.innerHTML = '<option value="">選擇技師...</option>';

            techsData.forEach(t => {
                // 技師列表 UI
                list.innerHTML += `
                    <div class="bg-white p-3 rounded shadow flex justify-between items-center border-l-4 border-teal-500">
                        <div>
                            <p class="font-bold">${t.name}</p>
                            <p class="text-sm text-gray-600">專長: ${t.skills}</p>
                        </div>
                        <div class="space-x-2">
                            <button onclick="editTech('${t.id}', '${t.name}', '${t.skills}')" class="text-blue-500 text-sm">編輯</button>
                            <button onclick="deleteDocHandler('technicians', '${t.id}')" class="text-red-500 text-sm">刪除</button>
                        </div>
                    </div>`;
                // 預約選單更新
                aptSelect.innerHTML += `<option value="${t.id}">${t.name} (${t.skills})</option>`;
            });
        }

        function renderCustomers() {
            const list = document.getElementById('customerList');
            const aptSelect = document.getElementById('aptCustomer');
            list.innerHTML = '';
            aptSelect.innerHTML = '<option value="">選擇客戶...</option>';

            customersData.forEach(c => {
                list.innerHTML += `
                    <div class="bg-white p-3 rounded shadow border-l-4 border-indigo-500">
                        <div class="flex justify-between items-center">
                            <p class="font-bold text-indigo-700">${c.name} <span class="text-sm font-normal text-gray-500">${c.phone}</span></p>
                            <button onclick="deleteDocHandler('customers', '${c.id}')" class="text-red-500 text-sm">刪除</button>
                        </div>
                        <p class="text-sm text-gray-600 mt-1 bg-gray-100 p-2 rounded">需求: ${c.needs}</p>
                    </div>`;
                aptSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
            renderStats(); // 客戶更新時重新計算統計
        }

        function renderAppointments() {
            const list = document.getElementById('appointmentList');
            list.innerHTML = '';

            appointmentsData.forEach(a => {
                const customer = customersData.find(c => c.id === a.customerId)?.name || '未知客戶';
                const tech = techsData.find(t => t.id === a.techId)?.name || '未知技師';
                
                list.innerHTML += `
                    <div class="bg-white p-3 rounded shadow border-l-4 border-orange-500 flex justify-between items-center">
                        <div>
                            <p class="text-sm text-orange-600 font-bold">${new Date(a.time).toLocaleString('zh-TW')}</p>
                            <p class="font-bold">👤 ${customer} <span class="text-gray-400 mx-1">➜</span> 💆 ${tech}</p>
                        </div>
                        <button onclick="deleteDocHandler('appointments', '${a.id}')" class="text-red-500 text-sm">取消</button>
                    </div>`;
            });
            renderStats(); // 預約更新時重新計算統計
        }

        // 統計客戶造訪頻率
        function renderStats() {
            const statsList = document.getElementById('statsList');
            statsList.innerHTML = '';
            
            const visits = {};
            appointmentsData.forEach(apt => {
                visits[apt.customerId] = (visits[apt.customerId] || 0) + 1;
            });

            // 排序並渲染
            customersData.map(c => ({
                name: c.name,
                count: visits[c.id] || 0
            })).sort((a, b) => b.count - a.count).forEach(stat => {
                statsList.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-3 rounded shadow">
                        <span class="font-bold">${stat.name}</span>
                        <span class="bg-teal-100 text-teal-800 py-1 px-3 rounded-full text-sm font-bold">造訪 ${stat.count} 次</span>
                    </div>`;
            });
        }

        // ===== 核心 CRUD 操作 =====

        // 新增技師
        document.getElementById('techForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "technicians"), {
                name: document.getElementById('techName').value,
                skills: document.getElementById('techSkills').value
            });
            e.target.reset();
        });

        // 新增客戶
        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "customers"), {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                needs: document.getElementById('custNeeds').value
            });
            e.target.reset();
        });

        // 新增預約
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "appointments"), {
                customerId: document.getElementById('aptCustomer').value,
                techId: document.getElementById('aptTech').value,
                time: document.getElementById('aptTime').value
            });
            e.target.reset();
        });

        // 全域函數綁定 (為了讓 HTML onClick 呼叫)
        window.deleteDocHandler = async (colName, id) => {
            if(confirm('確定要刪除嗎？')) {
                await deleteDoc(doc(db, colName, id));
            }
        };

        window.editTech = async (id, oldName, oldSkills) => {
            const newName = prompt("修改姓名:", oldName);
            if (!newName) return;
            const newSkills = prompt("修改專長:", oldSkills);
            if (!newSkills) return;
            
            await updateDoc(doc(db, "technicians", id), {
                name: newName,
                skills: newSkills
            });
        };

        // ===== 即時監聽 Firebase (Real-time Sync) =====
        
        onSnapshot(collection(db, "technicians"), (snapshot) => {
            techsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderTechs();
        });

        onSnapshot(collection(db, "customers"), (snapshot) => {
            customersData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderCustomers();
        });

        // 預約依時間排序監聽
        const aptQuery = query(collection(db, "appointments"), orderBy("time", "desc"));
        onSnapshot(aptQuery, (snapshot) => {
            appointmentsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderAppointments();
        });

    </script>

    <!-- UI 頁籤切換邏輯 -->
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
