<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>作業輔助工具集 (綜合離線版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JsBarcode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <!-- QRious -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .card { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .num-input { width: 70px; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; text-align: center; }
        .num-input:focus { outline: none; border-color: #f97316; ring: 1px; }
        
        /* 條碼區域樣式保留 */
        .code-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
        .code-card { background: white; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; gap: 15px; animation: fadeIn 0.3s ease-in-out;}
        .code-card canvas { max-width: 100%; height: auto; background: white; padding: 10px; border-radius: 4px; }
        .text-display { word-break: break-all; color: #666; font-size: 0.95em; text-align: center; width: 100%; font-weight: bold; }
        .card-actions { display: flex; gap: 10px; width: 100%; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-10">

    <header class="bg-orange-500 text-white text-center py-4 sticky top-0 z-10 shadow-md">
        <h1 class="text-xl font-bold tracking-wider">🛠️ 作業輔助工具集 (綜合離線版)</h1>
    </header>

    <main class="max-w-2xl mx-auto mt-4 px-4 space-y-6">
        
        <!-- ================= LINE 群組快捷鍵 ================= -->
        <section class="bg-white rounded-xl card p-5 border-t-4 border-green-500">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800">🟢 LINE 門市群組捷徑</h2>
                <button onclick="toggleEditMode()" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded transition">⚙️ 管理捷徑</button>
            </div>
            
            <!-- 捷徑顯示區 -->
            <div id="shortcutDisplay" class="grid grid-cols-3 sm:grid-cols-4 gap-2 text-center">
                <!-- 動態生成 -->
            </div>

            <!-- 捷徑管理區 (預設隱藏) -->
            <div id="shortcutManager" class="hidden mt-4 pt-4 border-t border-gray-200">
                <h3 class="text-sm font-semibold text-gray-600 mb-2">管理現有捷徑</h3>
                <ul id="shortcutList" class="space-y-2 mb-4">
                    <!-- 動態生成 -->
                </ul>
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-semibold text-gray-600 mb-2">新增捷徑</h3>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="newShortcutName" placeholder="門市名稱" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-green-500">
                        <input type="text" id="newShortcutUrl" placeholder="LINE 網址" class="flex-2 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-green-500">
                        <button onclick="addShortcut()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-1.5 px-4 rounded text-sm transition">新增</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= 分類回報字串產生器 ================= -->
        <section class="bg-white rounded-xl card p-5 border-t-4 border-blue-500">
            <h2 class="text-lg font-bold text-gray-800 mb-4">📝 分類回報字串產生器</h2>
            
            <div class="space-y-4">
                <!-- 類型選擇 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">回報類型</label>
                    <select id="mainCategory" onchange="handleCategoryChange()" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-blue-700">
                        <option value="scs_fbs">SCS,FBS黑箱</option>
                        <option value="ndd_fbs_leave">NDD,FBS離店打包</option>
                        <option value="ndd_shelf">NDD上架完成</option>
                        <option value="parcel_reassign">包裹重新分配</option>
                        <option value="pda_shelf">PDA上架完成</option>
                        <option value="stay_box_report">滯留箱數回報</option>
                        <option value="facade_check">門面檢查</option>
                    </select>
                </div>

                <!-- 第一行：日期+門市 -->
                <div class="flex items-center gap-2 bg-gray-100 p-2 rounded-lg border border-gray-200">
                    <span id="todayDate" class="font-bold text-gray-700 whitespace-nowrap px-2"></span>
                    <select id="storeSelect" class="flex-1 border border-gray-300 rounded px-2 py-1 focus:outline-none">
                        <option value="潮州中洲">潮州中洲</option>
                        <option value="潮州光華">潮州光華</option>
                        <option value="潮州大同">潮州大同</option>
                        <option value="潮州光春">潮州光春</option>
                        <option value="潮州愛國">潮州愛國</option>
                        <option value="潮州四維">潮州四維</option>
                        <option value="潮州文化">潮州文化</option>
                        <option value="潮州延平">潮州延平</option>
                        <option value="潮州太平">潮州太平</option>
                        <option value="潮州新生">潮州新生</option>
                        <option value="新園仙吉">新園仙吉</option>
                    </select>
                </div>

                <!-- 第二行 -->
                <div id="line2Container" class="flex flex-wrap items-center gap-2 p-2 bg-yellow-50 rounded-lg border border-yellow-200">
                    <span class="text-sm font-semibold text-gray-600 w-12">第二行</span>
                    <select id="line2Select" onchange="handleLine2Change()" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none"></select>
                    <div id="line2Inputs" class="flex items-center gap-1"></div>
                </div>

                <!-- 第三行 -->
                <div id="line3Container" class="flex flex-wrap items-center gap-2 p-2 bg-red-50 rounded-lg border border-red-200">
                    <span class="text-sm font-semibold text-gray-600 w-12">第三行</span>
                    <select id="line3Select" onchange="handleLine3Change()" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none"></select>
                    <div id="line3Inputs" class="flex items-center gap-1"></div>
                </div>

                <!-- 產出與複製 -->
                <button onclick="generateString()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition">
                    產生並複製字串
                </button>
                <textarea id="resultOutput" rows="4" readonly placeholder="產生的字串會顯示在這裡..." class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 focus:outline-none"></textarea>
            </div>
        </section>

        <!-- ================= 條碼與 QR Code 產生器 ================= -->
        <section class="bg-white rounded-xl card p-5 border-t-4 border-purple-500">
            <h2 class="text-lg font-bold text-gray-800 mb-4">🔣 條碼 & QR Code 產生器</h2>
            <div class="flex flex-wrap gap-2">
                <input type="text" id="inputValue" placeholder="請輸入數值 (例如: SPX30657)..." class="flex-1 min-w-[200px] border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" />
                
                <select id="codeType" onchange="toggleCodeType()" class="border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 focus:outline-none">
                    <option value="qrcode">QR Code</option>
                    <option value="barcode">條碼 (Barcode)</option>
                </select>

                <select id="barcodeFormat" class="hidden border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 focus:outline-none">
                    <option value="CODE128">CODE128 (支援大小寫英數)</option>
                    <option value="CODE39">CODE39 (僅支援大寫英數)</option>
                </select>

                <select id="qrErrorLevel" class="border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 focus:outline-none">
                    <option value="M">容錯率: 一般 (M)</option>
                    <option value="H">容錯率: 高 (H)</option>
                </select>

                <button onclick="generateCode()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-lg transition">產生</button>
            </div>
            
            <div id="codeGrid" class="code-grid"></div>
        </section>
    </main>

    <script>
        /* ================= LINE 群組捷徑邏輯 (Local Storage) ================= */
        const DEFAULT_SHORTCUTS = [
            { id: Date.now().toString(), name: '潮州愛國', url: 'https://line.me/R/ti/g/fZrPvcKMBK' },
            { id: (Date.now()+1).toString(), name: '潮州中洲', url: 'https://line.me/R/ti/g/QBVMmunss2' },
            { id: (Date.now()+2).toString(), name: '新園仙吉', url: 'https://line.me/R/ti/g/rqjPNW5fjg' }
        ];

        let shortcuts = JSON.parse(localStorage.getItem('lineShortcuts')) || DEFAULT_SHORTCUTS;

        function saveShortcuts() {
            localStorage.setItem('lineShortcuts', JSON.stringify(shortcuts));
            renderShortcuts();
        }

        function renderShortcuts() {
            const displayArea = document.getElementById('shortcutDisplay');
            const listArea = document.getElementById('shortcutList');
            
            // 渲染按鈕
            displayArea.innerHTML = shortcuts.map(s => 
                `<a href="${s.url}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 px-1 rounded-lg shadow transition block truncate">${s.name}</a>`
            ).join('');

            // 渲染管理列表
            listArea.innerHTML = shortcuts.map(s => `
                <li class="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-200">
                    <div class="truncate flex-1 pr-2">
                        <span class="font-bold text-sm text-gray-700">${s.name}</span>
                        <span class="text-xs text-gray-400 block truncate">${s.url}</span>
                    </div>
                    <button onclick="deleteShortcut('${s.id}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded">刪除</button>
                </li>
            `).join('');
        }

        function toggleEditMode() {
            const manager = document.getElementById('shortcutManager');
            manager.classList.toggle('hidden');
        }

        function addShortcut() {
            const nameInput = document.getElementById('newShortcutName');
            const urlInput = document.getElementById('newShortcutUrl');
            if(!nameInput.value || !urlInput.value) return alert('請填寫完整資訊');
            
            shortcuts.push({
                id: Date.now().toString(),
                name: nameInput.value,
                url: urlInput.value
            });
            nameInput.value = '';
            urlInput.value = '';
            saveShortcuts();
        }

        function deleteShortcut(id) {
            if(!confirm('確定刪除此捷徑？')) return;
            shortcuts = shortcuts.filter(s => s.id !== id);
            saveShortcuts();
        }


        /* ================= 字串產生器邏輯 ================= */
        
        // 設定今天日期
        const today = new Date();
        document.getElementById('todayDate').textContent = `${today.getMonth() + 1}/${today.getDate()}`;

        const l2Container = document.getElementById('line2Container');
        const l3Container = document.getElementById('line3Container');
        const l2Select = document.getElementById('line2Select');
        const l3Select = document.getElementById('line3Select');
        const l2Inputs = document.getElementById('line2Inputs');
        const l3Inputs = document.getElementById('line3Inputs');

        // 資料結構定義
        const OPTIONS_MAP = {
            'none': '無',
            'strap': '束帶',
            'no_strap': '無束帶',
            'lack': '缺',
            'stay_pcs': '滯留件',
            'stay_naked': '滯留裸',
            'abnormal_return': '異退件',
            'stay_box': '滯留箱',
            'stay_box_naked': '滯留箱裸',
            
            // L3 特殊文字
            'scanned_found': '已刷已找',
            'store_no_parcel': '門市已無包裹',
            'wet_damage': '濕損破損',
            'system_error': '系統無法驗收',
            'no_label': '無面單',
            'double_label': '雙面對單',
            'no_suitable_cabinet': '無合適櫃位',
            'no_cabinet': '無櫃位'
        };

        function populateSelect(selectElement, optionsArray) {
            selectElement.innerHTML = optionsArray.map(opt => `<option value="${opt}">${OPTIONS_MAP[opt] || opt}</option>`).join('');
        }

        // 核心連動邏輯
        function handleCategoryChange() {
            const cat = document.getElementById('mainCategory').value;
            
            // 重置顯示狀態
            l2Container.classList.remove('hidden');
            l3Container.classList.remove('hidden');
            
            if (cat === 'parcel_reassign' || cat === 'facade_check') {
                // 僅第一行
                l2Container.classList.add('hidden');
                l3Container.classList.add('hidden');
            } else if (cat === 'scs_fbs') {
                populateSelect(l2Select, ['strap', 'no_strap']);
            } else if (cat === 'ndd_fbs_leave') {
                populateSelect(l2Select, ['none', 'lack']);
            } else if (cat === 'ndd_shelf') {
                populateSelect(l2Select, ['none', 'lack', 'stay_pcs', 'stay_naked', 'abnormal_return']);
            } else if (cat === 'pda_shelf' || cat === 'stay_box_report') {
                populateSelect(l2Select, ['none', 'stay_box_naked', 'stay_box', 'stay_naked']);
            }
            
            handleLine2Change(); // 觸發第二行更新
        }

        function handleLine2Change() {
            const cat = document.getElementById('mainCategory').value;
            const val2 = l2Select.value;

            // 1. 處理第二行的輸入框
            renderInputs(val2, l2Inputs);

            // 2. 處理絕不出現第三行的條件
            if (val2 === 'none' || val2 === 'no_strap') {
                l3Container.classList.add('hidden');
                return;
            } else {
                l3Container.classList.remove('hidden');
            }

            // 3. 根據選項給予第三行內容
            if (cat === 'scs_fbs') {
                populateSelect(l3Select, ['strap', 'no_strap']);
            } else if (cat === 'ndd_fbs_leave') {
                populateSelect(l3Select, ['none', 'scanned_found']);
            } else if (cat === 'ndd_shelf') {
                if (val2 === 'lack') {
                    populateSelect(l3Select, ['store_no_parcel']);
                } else if (val2 === 'abnormal_return') {
                    populateSelect(l3Select, ['wet_damage', 'system_error', 'no_label', 'double_label']);
                } else {
                    populateSelect(l3Select, ['no_suitable_cabinet', 'no_cabinet']);
                }
            } else if (cat === 'pda_shelf' || cat === 'stay_box_report') {
                populateSelect(l3Select, ['no_suitable_cabinet', 'no_cabinet']);
            }

            handleLine3Change();
        }

        function handleLine3Change() {
            const val3 = l3Select.value;
            renderInputs(val3, l3Inputs);
        }

        // 動態產生輸入框
        function renderInputs(type, container) {
            container.innerHTML = '';
            if (['strap', 'no_strap'].includes(type)) {
                container.innerHTML = `<span class="text-xs text-gray-500">×</span><input type="number" class="num-input" placeholder="數量" min="0">`;
            } else if (['lack', 'stay_pcs', 'stay_naked', 'abnormal_return', 'stay_box'].includes(type)) {
                const unit = type === 'stay_box' ? '箱' : (type === 'stay_naked' ? '裸' : (type === 'lack' ? '' : '件'));
                container.innerHTML = `<input type="number" class="num-input mx-1" placeholder="${unit}" min="0"><span class="text-xs text-gray-700 font-bold">${unit}</span>`;
            } else if (type === 'stay_box_naked') {
                container.innerHTML = `
                    <input type="number" class="num-input mx-1" placeholder="箱" min="0"><span class="text-xs text-gray-700 font-bold">箱</span>
                    <input type="number" class="num-input mx-1" placeholder="裸" min="0"><span class="text-xs text-gray-700 font-bold">裸</span>`;
            }
        }

        // 讀取某一行產生的字串
        function getLineString(selectElement, inputContainer) {
            const val = selectElement.value;
            const inputs = inputContainer.querySelectorAll('input');
            const v1 = inputs.length > 0 ? (inputs[0].value || '0') : '';
            const v2 = inputs.length > 1 ? (inputs[1].value || '0') : '';

            switch(val) {
                case 'strap': return `束帶×${v1}`;
                case 'no_strap': return `無束帶×${v1}`;
                case 'none': return '無';
                case 'lack': return `缺${v1}`;
                case 'stay_pcs': return `滯留${v1}件`;
                case 'stay_naked': return `滯留${v1}裸`;
                case 'abnormal_return': return `異退${v1}件`;
                case 'stay_box': return `滯留${v1}箱`;
                case 'stay_box_naked': return `滯留${v1}箱${v2}裸`;
                default: return OPTIONS_MAP[val] || val; // 沒有輸入框的純文字選項
            }
        }

        function generateString() {
            const dateStr = document.getElementById('todayDate').textContent;
            const store = document.getElementById('storeSelect').value;
            let result = [`${dateStr} ${store}`];

            if (!l2Container.classList.contains('hidden')) {
                result.push(getLineString(l2Select, l2Inputs));
            }
            if (!l3Container.classList.contains('hidden')) {
                result.push(getLineString(l3Select, l3Inputs));
            }

            const finalStr = result.join('\n');
            document.getElementById('resultOutput').value = finalStr;

            navigator.clipboard.writeText(finalStr).then(() => {
                alert('✅ 複製成功！\n\n' + finalStr);
            }).catch(() => {
                alert('❌ 複製失敗，請手動複製文字框內容。');
            });
        }


        /* ================= 條碼 & QR Code 產生器邏輯 (維持不變) ================= */
        
        function toggleCodeType() {
            const type = document.getElementById('codeType').value;
            document.getElementById('barcodeFormat').classList.toggle('hidden', type !== 'barcode');
            document.getElementById('qrErrorLevel').classList.toggle('hidden', type !== 'qrcode');
        }

        function generateCode() {
            const inputField = document.getElementById('inputValue');
            let rawInput = inputField.value.trim();
            const type = document.getElementById('codeType').value;

            if (!rawInput) return alert('⚠️ 請先輸入數值！');

            const safeInput = rawInput.replace(/[\u200B-\u200D\uFEFF]/g, '');
            const grid = document.getElementById('codeGrid');
            const card = document.createElement('div');
            card.className = 'code-card';

            const textDisplay = document.createElement('div');
            textDisplay.className = 'text-display';
            textDisplay.textContent = safeInput;

            const actions = document.createElement('div');
            actions.className = 'card-actions';

            let downloadTarget;

            try {
                if (type === 'barcode') {
                    const canvas = document.createElement('canvas');
                    JsBarcode(canvas, safeInput, { 
                        format: document.getElementById('barcodeFormat').value, 
                        width: 2, height: 60, displayValue: false, margin: 10
                    });
                    card.appendChild(canvas);
                    downloadTarget = canvas;
                } else if (type === 'qrcode') {
                    const qrCanvas = document.createElement('canvas');
                    new QRious({
                        element: qrCanvas, value: safeInput, size: 180,
                        level: document.getElementById('qrErrorLevel').value
                    });
                    card.appendChild(qrCanvas);
                    downloadTarget = qrCanvas;
                }
            } catch (e) {
                return alert(`❌ 產生失敗！\n系統訊息: ${e.message || e}`);
            }

            const btnClass = "flex-1 text-white font-bold py-1 px-2 rounded text-sm transition";
            const downloadBtn = document.createElement('button');
            downloadBtn.className = `${btnClass} bg-blue-500 hover:bg-blue-600`;
            downloadBtn.textContent = '下載';
            downloadBtn.onclick = () => downloadImage(downloadTarget, safeInput, type);

            const removeBtn = document.createElement('button');
            removeBtn.className = `${btnClass} bg-red-500 hover:bg-red-600`;
            removeBtn.textContent = '移除';
            removeBtn.onclick = () => card.remove();

            actions.appendChild(downloadBtn);
            actions.appendChild(removeBtn);
            card.appendChild(textDisplay);
            card.appendChild(actions);
            grid.prepend(card); 
            inputField.value = ''; 
        }

        function downloadImage(canvas, text, type) {
            const a = document.createElement('a');
            a.href = canvas.toDataURL("image/png");
            a.download = `${type}_${text.replace(/[^a-zA-Z0-9]/gi, '_').substring(0, 15)}.png`;
            a.click();
        }

        // 初始化執行
        renderShortcuts();
        handleCategoryChange(); // 初始化下拉選單狀態
        toggleCodeType();
    </script>
</body>
</html>
