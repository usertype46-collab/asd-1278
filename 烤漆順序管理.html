<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烤漆順序管理系統 | Hệ thống quản lý thứ tự sơn</title>
    <link rel="stylesheet" href="styles.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 頂部導航與設定 -->
        <header class="app-header">
            <h1 data-i18n="appTitle">烤漆順序管理系統</h1>
            <div class="header-controls">
                <button id="lang-switch-btn" class="btn-lang">
                    <i class="fas fa-globe"></i> <span id="current-lang">繁體中文</span>
                </button>
            </div>
        </header>

        <!-- 頁籤導航 -->
        <nav class="tabs">
            <button class="tab-btn active" data-target="tab-today" data-i18n="tabToday">今日作業</button>
            <button class="tab-btn" data-target="tab-plan" data-i18n="tabPlan">明日排程</button>
            <button class="tab-btn" data-target="tab-history" data-i18n="tabHistory">歷史記錄</button>
        </nav>

        <main class="content-area">
            <!-- 今日作業區塊 -->
            <section id="tab-today" class="tab-content active">
                <h2 class="section-title"><i class="fas fa-calendar-day"></i> <span data-i18n="todayTitle">今日烤漆作業</span> (<span id="today-date-display"></span>)</h2>
                <div class="table-responsive">
                    <table class="data-table" id="today-table">
                        <thead>
                            <tr>
                                <th data-i18n="colSeq">序號</th>
                                <th data-i18n="colColor">顏色</th>
                                <th data-i18n="colMachine">機型</th>
                                <th data-i18n="colRemarks">備註</th>
                            </tr>
                        </thead>
                        <tbody id="today-tbody">
                            <!-- 動態載入今日資料 -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 明日排程區塊 (新增紀錄) -->
            <section id="tab-plan" class="tab-content">
                <h2 class="section-title"><i class="fas fa-calendar-plus"></i> <span data-i18n="planTitle">安排下一個工作日作業</span></h2>
                
                <div class="form-card">
                    <div class="form-header">
                        <div class="target-date-badge">
                            <span data-i18n="targetDateLabel">目標日期：</span>
                            <strong id="next-working-day-display">載入中...</strong>
                        </div>
                        <div class="seq-badge">
                            <span data-i18n="nextSeqLabel">下一筆序號：</span>
                            <strong id="next-seq-display">1</strong>
                        </div>
                    </div>

                    <form id="add-record-form">
                        <div class="form-group">
                            <label for="color-input" data-i18n="labelColor">顏色 (可選或輸入)</label>
                            <input type="text" id="color-input" list="color-datalist" required placeholder="請選擇或輸入顏色代碼" data-i18n-placeholder="phColor">
                            <datalist id="color-datalist">
                                <!-- 動態載入顏色 -->
                            </datalist>
                        </div>

                        <div class="form-group">
                            <label for="machine-input" data-i18n="labelMachine">機型 (可選或輸入)</label>
                            <input type="text" id="machine-input" list="machine-datalist" required placeholder="請選擇或輸入機型" data-i18n-placeholder="phMachine">
                            <datalist id="machine-datalist">
                                <!-- 動態載入機型 -->
                            </datalist>
                        </div>

                        <div class="form-group">
                            <label data-i18n="labelRemarks">備註</label>
                            <div id="remarks-container">
                                <div class="remark-row">
                                    <input type="text" class="remark-input" placeholder="輸入備註事項" data-i18n-placeholder="phRemark">
                                    <button type="button" class="btn-icon btn-add-remark" title="新增備註欄位"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary">
                                <i class="fas fa-save"></i> <span data-i18n="btnSave">儲存並加入下一筆</span>
                            </button>
                        </div>
                    </form>
                </div>
                
                <h3 class="subsection-title" data-i18n="planListTitle">已排定之作業</h3>
                <div class="table-responsive">
                    <table class="data-table" id="plan-table">
                        <thead>
                            <tr>
                                <th data-i18n="colSeq">序號</th>
                                <th data-i18n="colColor">顏色</th>
                                <th data-i18n="colMachine">機型</th>
                                <th data-i18n="colRemarks">備註</th>
                            </tr>
                        </thead>
                        <tbody id="plan-tbody">
                            <!-- 動態載入計畫資料 -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 歷史記錄查詢區塊 -->
            <section id="tab-history" class="tab-content">
                <h2 class="section-title"><i class="fas fa-history"></i> <span data-i18n="historyTitle">歷史記錄查詢</span></h2>
                
                <div class="search-filters">
                    <div class="filter-group">
                        <label data-i18n="filterDate">日期</label>
                        <input type="date" id="search-date">
                    </div>
                    <div class="filter-group">
                        <label data-i18n="filterColor">顏色</label>
                        <input type="text" id="search-color" list="color-datalist" placeholder="搜尋顏色" data-i18n-placeholder="phSearchColor">
                    </div>
                    <div class="filter-group">
                        <label data-i18n="filterMachine">機型</label>
                        <input type="text" id="search-machine" list="machine-datalist" placeholder="搜尋機型" data-i18n-placeholder="phSearchMachine">
                    </div>
                    <div class="filter-actions">
                        <button id="btn-search" class="btn-secondary"><i class="fas fa-search"></i> <span data-i18n="btnSearch">查詢</span></button>
                        <button id="btn-reset" class="btn-outline"><i class="fas fa-undo"></i> <span data-i18n="btnReset">重置</span></button>
                    </div>
                </div>

                <div class="table-responsive mt-20">
                    <table class="data-table" id="history-table">
                        <thead>
                            <tr>
                                <th data-i18n="colDate">日期</th>
                                <th data-i18n="colSeq">序號</th>
                                <th data-i18n="colColor">顏色</th>
                                <th data-i18n="colMachine">機型</th>
                                <th data-i18n="colRemarks">備註</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody">
                            <!-- 查詢結果 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase SDK (Modular) & Application Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
