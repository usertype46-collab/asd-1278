<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蝦皮門市作業輔助與回報系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- Tesseract.js 文字解析引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-orange-500 text-white text-center py-4 sticky top-0 z-10 shadow-md">
        <h1 class="text-xl font-bold tracking-wider">📦 蝦皮門市作業輔助系統</h1>
    </header>

    <main class="max-w-lg mx-auto mt-4 px-4 space-y-6">
        
        <!-- 捷徑區域 -->
        <section class="bg-white rounded-xl card p-5 border-t-4 border-green-500">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-md font-bold text-gray-800 flex items-center gap-2">
                    🟢 LINE 門市群組捷徑
                    <span id="gpsStatus" class="text-xs px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700">📍 尋找定位中...</span>
                </h2>
                <button onclick="toggleManageShortcuts()" class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded hover:bg-gray-300 transition shrink-0">
                    ⚙️ 管理
                </button>
            </div>
            
            <div id="shortcutButtons" class="grid grid-cols-3 gap-2 text-center"></div>

            <div id="manageShortcutsSection" class="hidden mt-4 pt-4 border-t border-gray-200">
                <h3 class="text-sm font-bold text-gray-600 mb-2" id="shortcutFormTitle">新增捷徑</h3>
                <form id="shortcutForm" onsubmit="saveShortcut(event)" class="mb-4">
                    <input type="hidden" id="editShortcutId">
                    <div class="flex flex-col gap-2 mb-2">
                        <select id="shortcutGroup" required class="border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-green-500 outline-none">
                            <option value="愛國群組">隸屬：愛國群組</option>
                            <option value="中洲群組">隸屬：中洲群組</option>
                        </select>
                        <div class="flex gap-2">
                            <input type="text" id="shortcutName" placeholder="門市名稱" required class="flex-1 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-green-500 outline-none">
                            <input type="url" id="shortcutUrl" placeholder="LINE 網址 (https://...)" required class="flex-[2] border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="saveShortcutBtn" class="flex-1 bg-green-500 text-white text-sm py-1 rounded hover:bg-green-600 transition">儲存</button>
                        <button type="button" onclick="resetShortcutForm()" class="flex-1 bg-gray-400 text-white text-sm py-1 rounded hover:bg-gray-500 transition">取消</button>
                    </div>
                </form>
                <div id="manageShortcutList" class="space-y-2 max-h-40 overflow-y-auto hide-scroll"></div>
            </div>
        </section>

        <!-- 回報字串產生器區域 -->
        <section class="bg-white rounded-xl card p-5 border-t-4 border-blue-500">
            <h2 class="text-md font-bold text-gray-800 mb-4">📝 狀態回報字串產生器</h2>
            
            <div class="space-y-4">
                <div class="flex items-center gap-2">
                    <div class="bg-gray-100 text-gray-700 font-bold px-3 py-2 rounded border shrink-0 flex items-center gap-2">
                        <span id="todayDate">讀取中</span>
                        <span id="shiftIndicator" class="text-[10px] px-1.5 py-0.5 rounded-full text-white bg-gray-400">時段</span>
                    </div>
                    <select id="locationSelect" onchange="renderCategories()" class="flex-1 border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm h-full">
                        <option value="潮州中洲">潮州中洲</option>
                        <option value="潮州光華">潮州光華</option>
                        <option value="潮州大同">潮州大同</option>
                        <option value="潮州光春">潮州光春</option>
                        <option value="潮州愛國">潮州愛國</option>
                        <option value="潮州四維">潮州四維</option>
                        <option value="潮州文化">潮州文化</option>
                        <option value="潮州延平">潮州延平</option>
                        <option value="潮州太平">潮州太平</option>
                        <option value="潮州新生">潮州新生</option>
                        <option value="新園仙吉">新園仙吉</option>
                    </select>
                </div>

                <div class="bg-blue-50 p-3 rounded border">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold text-gray-600">回報情境</label>
                        <div class="space-x-1 shrink-0">
                            <button onclick="addCategory()" class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded shadow-sm">➕新增</button>
                            <button onclick="editCategory()" class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded shadow-sm">✏️修改</button>
                            <button onclick="deleteCategory()" class="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded shadow-sm">🗑️刪除</button>
                        </div>
                    </div>
                    <select id="categorySelect" onchange="onCategoryChange()" class="w-full border border-gray-300 rounded px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm"></select>
                </div>

                <div id="line2Container" class="hidden bg-gray-50 p-3 rounded border">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold text-gray-600">第二行狀態</label>
                        <div class="space-x-1 shrink-0">
                            <button onclick="addL2()" class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded shadow-sm">➕新增</button>
                            <button onclick="editL2()" class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded shadow-sm">✏️修改</button>
                            <button onclick="deleteL2()" class="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded shadow-sm">🗑️刪除</button>
                        </div>
                    </div>
                    <div class="flex items-center flex-wrap gap-2">
                        <select id="line2Select" onchange="onL2Change()" class="border border-gray-300 rounded px-2 py-1 outline-none text-sm bg-white min-w-[120px]"></select>
                        <span id="line2Inputs" class="flex gap-1"></span>
                    </div>
                </div>

                <div id="line3Container" class="hidden bg-gray-50 p-3 rounded border">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold text-gray-600">第三行狀態</label>
                        <div class="space-x-1 shrink-0">
                            <button onclick="addL3()" class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded shadow-sm">➕新增</button>
                            <button onclick="editL3()" class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded shadow-sm">✏️修改</button>
                            <button onclick="deleteL3()" class="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded shadow-sm">🗑️刪除</button>
                        </div>
                    </div>
                    <div class="flex items-center flex-wrap gap-2">
                        <select id="line3Select" onchange="onL3Change()" class="border border-gray-300 rounded px-2 py-1 outline-none text-sm bg-white min-w-[120px]"></select>
                        <span id="line3Inputs" class="flex gap-1"></span>
                    </div>
                </div>

                <div id="line4Container" class="hidden bg-gray-50 p-3 rounded border">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold text-gray-600">第四行狀態</label>
                        <div class="space-x-1 shrink-0">
                            <button onclick="addL4()" class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded shadow-sm">➕新增</button>
                            <button onclick="editL4()" class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded shadow-sm">✏️修改</button>
                            <button onclick="deleteL4()" class="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded shadow-sm">🗑️刪除</button>
                        </div>
                    </div>
                    <div class="flex items-center flex-wrap gap-2">
                        <select id="line4Select" onchange="onL4Change()" class="border border-gray-300 rounded px-2 py-1 outline-none text-sm bg-white min-w-[120px]"></select>
                        <span id="line4Inputs" class="flex gap-1"></span>
                    </div>
                </div>

                <button onclick="generateAndCopyString()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg shadow transition">
                    產生並複製字串
                </button>

                <textarea id="resultOutput" rows="4" readonly placeholder="產生的結果會顯示在這裡..." class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 text-gray-800 outline-none resize-none text-sm"></textarea>
            </div>
        </section>

        <!-- 條碼產生器區域 -->
        <section class="bg-white rounded-xl card p-5 border-t-4 border-purple-500 mb-10">
            <h2 class="text-md font-bold text-gray-800 mb-4">🔣 條碼 & QR Code 產生器</h2>
            
            <div class="space-y-3">
                <div class="flex gap-2">
                    <input type="text" id="inputValue" placeholder="請輸入數值 (例如: TW266484886B)..." class="flex-1 border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-purple-500 outline-none text-sm">
                    <button type="button" onclick="openScannerModal()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-2 rounded-lg shadow transition text-xs flex items-center gap-1 shrink-0">
                        📷 掃描 / 拍照
                    </button>
                </div>

                <!-- 顯示 OCR 解析圖片範例的區塊 -->
                <div id="ocrPreviewContainer" class="hidden flex-col items-center mt-2 bg-gray-50 p-3 border rounded-lg shadow-inner">
                    <span class="text-xs text-gray-600 mb-2 font-bold w-full text-left">📸 最新 OCR 裁切解析圖片 (已強化對比)：</span>
                    <img id="ocrPreviewImg" class="max-h-24 object-contain rounded shadow-sm border border-gray-200">
                </div>
                
                <div class="flex gap-2">
                    <select id="codeType" onchange="toggleAdvancedOptions()" class="flex-1 border border-gray-300 rounded px-2 py-2 bg-gray-100 outline-none text-sm">
                        <option value="qrcode">QR Code</option>
                        <option value="barcode">條碼 (Barcode)</option>
                    </select>

                    <select id="barcodeFormat" style="display: none;" class="flex-1 border border-gray-300 rounded px-2 py-2 bg-gray-100 outline-none text-sm">
                        <option value="CODE128">CODE128 (英數)</option>
                        <option value="CODE39">CODE39 (大寫)</option>
                    </select>

                    <select id="qrErrorLevel" class="flex-1 border border-gray-300 rounded px-2 py-2 bg-gray-100 outline-none text-sm">
                        <option value="M">容錯: 一般</option>
                        <option value="H">容錯: 高</option>
                    </select>
                </div>

                <button onclick="generateCode()" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 rounded-lg shadow transition">
                    產生圖片
                </button>
            </div>

            <div id="codeGrid" class="grid grid-cols-1 gap-4 mt-4"></div>
        </section>

    </main>

    <!-- 相機掃描彈跳視窗 -->
    <div id="scannerModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-4 flex flex-col items-center relative shadow-lg">
            <h3 class="text-md font-bold text-gray-800 mb-3">📷 相機掃描與範圍裁切 OCR</h3>
            
            <!-- 攝影機與裁切框疊加層 -->
            <div id="readerWrapper" class="relative w-full rounded overflow-hidden bg-black min-h-[200px]">
                <div id="reader" class="w-full"></div>
                <!-- 視覺化裁切框引導層 (提示改至上方外側，避免擋住畫面中心) -->
                <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                    <div class="border-2 border-dashed border-yellow-400 w-4/5 h-24 rounded-lg bg-yellow-400/10 flex items-center justify-center shadow-lg relative">
                        <span class="absolute -top-3 left-1/2 -translate-x-1/2 text-yellow-300 text-[10px] font-bold bg-black/80 px-2 py-0.5 rounded whitespace-nowrap shadow">📌 請將單號對準此框內</span>
                    </div>
                </div>
            </div>

            <p id="scannerStatus" class="text-xs text-gray-500 mt-2 text-center font-semibold">自動尋找條碼... 或將單號對準黃色虛線框點擊拍照</p>
            
            <div class="flex gap-2 w-full mt-4">
                <button type="button" onclick="captureAndOCR()" id="ocrBtn" class="flex-[2] bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded-lg transition text-sm flex justify-center items-center gap-1 shadow">
                    📸 拍照裁切解析文字
                </button>
                <button type="button" onclick="closeScannerModal()" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 rounded-lg transition text-sm shadow">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ================= 1. Supabase 連線設定與全域變數 ================= */
        const { createClient } = supabase;
        const supabaseUrl = 'https://hyvcfxwoewvbpfzvfdnn.supabase.co';
        const supabaseKey = 'sb_publishable_TR5C2Zc7eOj9uUosUUsX4g_KbBOwey2';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        let shortcuts = [];
        let STORE_LOCATIONS = { '愛國群組': [], '中洲群組': [] };
        let currentVisibleGroup = null; 
        let editShortcutId = null;
        let currentShift = 'other'; 

        const INPUT_HELP = '若需要手動輸入數值，請用「中括號」包住變數名稱。\n範例：「滯留[箱數]箱[裸數]裸」或「缺[數量]」';

        const DEFAULT_CONFIG = {
            categories: [
                { id: 'cat_1', text: 'SCS,FBS黑箱' },
                { id: 'cat_2', text: 'NDD,FBS離店打包' },
                { id: 'cat_3', text: 'NDD上架完成' },
                { id: 'cat_4', text: '包裹重新分配' },
                { id: 'cat_5', text: 'PDA上架完成' },
                { id: 'cat_6', text: '滯留箱數回報' },
                { id: 'cat_7', text: '門面檢查' },
                { id: 'cat_8', text: '自助機檢查' },
                { id: 'cat_9', text: '逾期包裹-打包前' },
                { id: 'cat_10', text: '逾期包裹相簿' },
                { id: 'cat_11', text: '逾期包裹-PDA打包後' },
                { id: 'cat_12', text: '每週五系統更新' }
            ],
            l2: {
                'cat_1': [ { id: 'l2_1_1', text: '束帶×[數量]' }, { id: 'l2_1_2', text: '無束帶×[數量]' } ],
                'cat_2': [ { id: 'l2_2_1', text: '無' }, { id: 'l2_2_2', text: '缺[數量]' } ],
                'cat_3': [ { id: 'l2_3_1', text: '無' }, { id: 'l2_3_2', text: '缺[數量]' }, { id: 'l2_3_3', text: '滯留[件數]件' }, { id: 'l2_3_4', text: '滯留[裸數]裸' }, { id: 'l2_3_5', text: '異退[件數]件' } ],
                'cat_4': [],
                'cat_5': [ { id: 'l2_5_1', text: '無滯留' }, { id: 'l2_5_2', text: '滯留[箱數]箱[裸數]裸' }, { id: 'l2_5_3', text: '滯留[箱數]箱' }, { id: 'l2_5_4', text: '滯留[裸數]裸' } ],
                'cat_6': [ { id: 'l2_6_1', text: '無' }, { id: 'l2_6_2', text: '滯留[箱數]箱[裸數]裸' }, { id: 'l2_6_3', text: '滯留[箱數]箱' }, { id: 'l2_6_4', text: '滯留[裸數]裸' } ],
                'cat_7': [], 'cat_8': [], 'cat_9': [], 'cat_10': [], 'cat_11': [], 'cat_12': []
            },
            l3: {
                'l2_1_1': [ { id: 'l3_1_1_1', text: '束帶×[數量]' }, { id: 'l3_1_1_2', text: '無束帶×[數量]' } ],
                'l2_2_2': [ { id: 'l3_2_2_1', text: '無' }, { id: 'l3_2_2_2', text: '已刷已找' } ],
                'l2_3_2': [ { id: 'l3_3_2_1', text: '門市已無包裹' } ],
                'l2_3_5': [ { id: 'l3_3_5_1', text: '濕損破損' }, { id: 'l3_3_5_2', text: '系統無法驗收' }, { id: 'l3_3_5_3', text: '無面單' }, { id: 'l3_3_5_4', text: '雙面單' } ],
                'l2_3_3': [ { id: 'l3_3_3_1', text: '無合適櫃位' }, { id: 'l3_3_3_2', text: '無櫃位' } ],
                'l2_3_4': [ { id: 'l3_3_4_1', text: '無合適櫃位' }, { id: 'l3_3_4_2', text: '無櫃位' } ],
                'l2_5_2': [ { id: 'l3_5_2_1', text: '無合適櫃位' }, { id: 'l3_5_2_2', text: '無櫃位' } ],
                'l2_5_3': [ { id: 'l3_5_3_1', text: '無合適櫃位' }, { id: 'l3_5_3_2', text: '無櫃位' } ],
                'l2_5_4': [ { id: 'l3_5_4_1', text: '無合適櫃位' }, { id: 'l3_5_4_2', text: '無櫃位' } ],
                'l2_6_2': [ { id: 'l3_6_2_1', text: '無合適櫃位' }, { id: 'l3_6_2_2', text: '無櫃位' } ],
                'l2_6_3': [ { id: 'l3_6_3_1', text: '無合適櫃位' }, { id: 'l3_6_3_2', text: '無櫃位' } ],
                'l2_6_4': [ { id: 'l3_6_4_1', text: '無合適櫃位' }, { id: 'l3_6_4_2', text: '無櫃位' } ]
            },
            l4: {}
        };

        let config = DEFAULT_CONFIG; 

        /* ================= 2. 核心同步邏輯 ================= */
        supabaseClient.channel('public:shortcuts').on('postgres_changes', { event: '*', schema: 'public', table: 'shortcuts' }, payload => { fetchShortcuts(); }).subscribe();
        supabaseClient.channel('public:store_locations').on('postgres_changes', { event: '*', schema: 'public', table: 'store_locations' }, payload => { fetchLocations(); }).subscribe();
        supabaseClient.channel('public:report_settings').on('postgres_changes', { event: '*', schema: 'public', table: 'report_settings' }, payload => { fetchConfig(); }).subscribe();

        async function fetchShortcuts() {
            const { data } = await supabaseClient.from('shortcuts').select('*').order('created_at', { ascending: true });
            if (data) { shortcuts = data; renderShortcuts(); }
        }

        async function fetchLocations() {
            const { data } = await supabaseClient.from('store_locations').select('*');
            if (data && data.length > 0) {
                STORE_LOCATIONS = { '愛國群組': [], '中洲群組': [] };
                data.forEach(loc => {
                    if(!STORE_LOCATIONS[loc.group_type]) STORE_LOCATIONS[loc.group_type] = [];
                    STORE_LOCATIONS[loc.group_type].push({ name: loc.name, lat: loc.lat, lng: loc.lng });
                });
            }
        }

        async function fetchConfig() {
            const { data } = await supabaseClient.from('report_settings').select('config_data').eq('id', 1).single();
            if (data && data.config_data) {
                config = data.config_data;
                if (!config.l4) config.l4 = {};
                let changed = false;
                DEFAULT_CONFIG.categories.forEach(defaultCat => {
                    if (!config.categories.find(c => c.text === defaultCat.text)) {
                        config.categories.push({ id: defaultCat.id, text: defaultCat.text });
                        if (!config.l2[defaultCat.id]) config.l2[defaultCat.id] = [];
                        changed = true;
                    }
                });
                if (changed) syncConfigToSupabase();
                renderCategories();
            } else {
                await supabaseClient.from('report_settings').upsert([{ id: 1, config_data: DEFAULT_CONFIG }]);
                config = DEFAULT_CONFIG;
                renderCategories();
            }
        }

        async function syncConfigToSupabase() {
            renderCategories(); 
            await supabaseClient.from('report_settings').upsert([{ id: 1, config_data: config }]);
        }

        /* ================= 3. 時間與班別偵測 ================= */
        function updateShiftStatus() {
            const now = new Date();
            const hour = now.getHours();
            const day = now.getDay();
            
            let shiftName = "其他時段";
            let shiftColor = "bg-gray-400";
            
            if (hour >= 6 && hour < 17) {
                currentShift = 'morning';
                shiftName = day === 5 ? "週五早班" : "早班";
                shiftColor = "bg-orange-500";
            } else if (hour >= 17 || hour < 6) {
                currentShift = 'evening';
                shiftName = "晚班";
                shiftColor = "bg-indigo-500";
            } else {
                currentShift = 'other';

        /* ================= 4. GPS 距離與定位 ================= */
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        function startGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(position => {
                    checkLocation(position.coords.latitude, position.coords.longitude);
                }, error => {
                    const gpsSpan = document.getElementById('gpsStatus');
                    gpsSpan.innerText = '📍 定位拒絕或失敗';
                    gpsSpan.className = 'text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-700';
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
            } else {
                document.getElementById('gpsStatus').innerText = '📍 裝置不支援GPS';
            }
        }

        function checkLocation(userLat, userLng) {
            let newGroup = null;
            let closestStore = null;

            for (let store of (STORE_LOCATIONS['愛國群組'] || [])) {
                if (calculateDistance(userLat, userLng, store.lat, store.lng) <= 50) {
                    newGroup = '愛國群組';
                    closestStore = store.name.replace('智取店', ''); break;
                }
            }

            if (!newGroup) {
                for (let store of (STORE_LOCATIONS['中洲群組'] || [])) {
                    if (calculateDistance(userLat, userLng, store.lat, store.lng) <= 50) {
                        newGroup = '中洲群組';
                        closestStore = store.name.replace('智取店', ''); break;
                    }
                }
            }

            currentVisibleGroup = newGroup;
            const gpsSpan = document.getElementById('gpsStatus');
            
            if (newGroup) {
                gpsSpan.className = 'text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700';
                gpsSpan.innerText = `📍 在 ${newGroup} 範圍內`;
                
                if (closestStore) {
                    const locSelect = document.getElementById('locationSelect');
                    let changed = false;
                    for (let i = 0; i < locSelect.options.length; i++) {
                        if (locSelect.options[i].value === closestStore) {
                            if (locSelect.selectedIndex !== i) { locSelect.selectedIndex = i; changed = true; }
                            break;
                        }
                    }
                    if (changed) renderCategories();
                }
            } else {
                gpsSpan.className = 'text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500';
                gpsSpan.innerText = `📍 未進入任何門市 50m 內`;
            }
            renderShortcuts();
        }

        // 拍照並精準依據「黃色虛線裁切框」範圍解析文字 (OCR - 已修正解析邏輯與 PSM 模式)
        async function captureAndOCR() {
            const video = document.querySelector('#reader video');
            if (!video) return alert('⚠️ 找不到相機畫面，請確認相機已授權並啟動。');

            const ocrBtn = document.getElementById('ocrBtn');
            const statusText = document.getElementById('scannerStatus');
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            const displayWidth = video.clientWidth;
            const displayHeight = video.clientHeight;

            const cropW = displayWidth * 0.8;
            const cropH = 96;
            const cropX = (displayWidth - cropW) / 2;
            const cropY = (displayHeight - cropH) / 2;

            const scaleX = videoWidth / displayWidth;
            const scaleY = videoHeight / displayHeight;

            const sx = cropX * scaleX;
            const sy = cropY * scaleY;
            const sWidth = cropW * scaleX;
            const sHeight = cropH * scaleY;

            const upscale = 2;
            canvas.width = sWidth * upscale;
            canvas.height = sHeight * upscale;

            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                const contrast = 2.0;
                let color = ((gray / 255 - 0.5) * contrast + 0.5) * 255;
                if (color < 0) color = 0;
                if (color > 255) color = 255;
                
                data[i] = data[i + 1] = data[i + 2] = color;
            }
            ctx.putImageData(imageData, 0, 0);

            try {
                ocrBtn.disabled = true;
                ocrBtn.innerHTML = '⏳ 範圍影像解析中...';
                statusText.innerText = '正在透過優化 OCR 引擎解析單號，請稍候...';

                // 改用 PSM 6（統一文字區塊模式），以正確辨識標籤上的多行文字（如代碼與中文）
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_pageseg_mode: '6',
                });
                
                const result = await worker.recognize(canvas);
                await worker.terminate();

                const text = result.data.text;
                const cleanText = text.replace(/[\r\n]+/g, ' ').trim();
                
                // 優化過濾邏輯：優先尋找蝦皮物流單號格式（例如英文字母開頭後接多碼數字，如 P22359528038）
                const matches = cleanText.match(/[A-Z0-9]{8,}/gi) || [];
                let finalString = '';
                
                const explicitCode = matches.find(m => /[A-Z]/i.test(m) && /\d/.test(m));
                if (explicitCode) {
                    finalString = explicitCode;
                } else if (matches.length > 0) {
                    finalString = matches.reduce((a, b) => a.length >= b.length ? a : b);
                } else {
                    const allMatches = cleanText.match(/[A-Za-z0-9]{5,}/g);
                    finalString = allMatches ? allMatches.reduce((a, b) => a.length >= b.length ? a : b) : cleanText.replace(/[^a-zA-Z0-9]/g, '');
                }

                if (finalString) {
                    document.getElementById('inputValue').value = finalString.toUpperCase();
                    
                    document.getElementById('ocrPreviewImg').src = canvas.toDataURL('image/jpeg');
                    document.getElementById('ocrPreviewContainer').classList.remove('hidden');
                    document.getElementById('ocrPreviewContainer').classList.add('flex');

                    alert('✅ 裁切範圍文字解析成功: ' + finalString.toUpperCase());
                    closeScannerModal();
                } else {
                    alert('❌ 裁切框內找不到可辨識的文字，請將單號對準框內後重試。');
                    statusText.innerText = '自動尋找條碼... 或將單號對準黃色虛線框點擊拍照';
                }
            } catch (err) {
                alert('❌ 解析發生錯誤: ' + err.message);
                statusText.innerText = '解析失敗，請重試';
            } finally {
                ocrBtn.disabled = false;
                ocrBtn.innerHTML = '📸 拍照裁切解析文字';
            }
        }

        function toggleAdvancedOptions() {
            const type = document.getElementById('codeType').value;
            document.getElementById('barcodeFormat').style.display = type === 'barcode' ? 'block' : 'none';
            document.getElementById('qrErrorLevel').style.display = type === 'qrcode' ? 'block' : 'none';
        }

        function generateCode() {
            const inputField = document.getElementById('inputValue');
            let rawInput = inputField.value.trim();
            const type = document.getElementById('codeType').value;
            if (!rawInput) return alert('⚠️ 請先輸入數值或使用相機掃描！');
            const safeInput = rawInput.replace(/[\u200B-\u200D\uFEFF]/g, '');
            const grid = document.getElementById('codeGrid');
            const card = document.createElement('div');
            card.className = 'bg-white p-4 border rounded-xl shadow-sm flex flex-col items-center gap-3';
            const textDisplay = document.createElement('div');
            textDisplay.className = 'font-bold text-gray-700 break-all text-center w-full text-sm';
            textDisplay.textContent = safeInput;
            const actions = document.createElement('div');
            actions.className = 'flex gap-2 w-full';
            let downloadTarget;
            try {
                if (type === 'barcode') {
                    if (typeof JsBarcode === 'undefined') return alert('⚠️ 條碼模組載入中，請稍後再試。');
                    const canvas = document.createElement('canvas'); const format = document.getElementById('barcodeFormat').value;
                    JsBarcode(canvas, safeInput, { format: format, width: 2, height: 60, displayValue: false, margin: 10 });
                    canvas.className = "max-w-full h-auto rounded bg-white p-2"; card.appendChild(canvas); downloadTarget = canvas;
                } else if (type === 'qrcode') {
                    if (typeof QRious === 'undefined') return alert('⚠️ QR Code 模組載入中，請稍後再試。');
                    const qrCanvas = document.createElement('canvas');
                    new QRious({ element: qrCanvas, value: safeInput, size: 160, level: document.getElementById('qrErrorLevel').value });
                    qrCanvas.className = "max-w-full h-auto rounded bg-white p-2 border"; card.appendChild(qrCanvas); downloadTarget = qrCanvas;
                }
            } catch (e) { return alert(`❌ 產生失敗！系統訊息: ${e.message || e}`); }
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'flex-1 bg-blue-100 text-blue-600 font-bold py-2 rounded hover:bg-blue-200 transition text-sm';
            downloadBtn.textContent = '下載'; downloadBtn.onclick = () => downloadImage(downloadTarget, safeInput, type);
            const removeBtn = document.createElement('button');
            removeBtn.className = 'flex-1 bg-red-100 text-red-600 font-bold py-2 rounded hover:bg-red-200 transition text-sm';
            removeBtn.textContent = '移除'; removeBtn.onclick = () => card.remove();
            actions.appendChild(downloadBtn); actions.appendChild(removeBtn);
            card.appendChild(textDisplay); card.appendChild(actions); grid.prepend(card); inputField.value = ''; 
        }

        function downloadImage(canvas, text, type) {
            const a = document.createElement('a'); a.href = canvas.toDataURL("image/png");
            const safeName = text.replace(/[^a-zA-Z0-9]/gi, '_').substring(0, 15);
            a.download = `${type}_${safeName || 'image'}.png`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            updateShiftStatus(); 
            setInterval(updateShiftStatus, 60000); 
            
            await fetchLocations(); 
            fetchShortcuts();       
            fetchConfig();          
            startGPS();             
        });
    </script>
</body>
</html>
